','Natutulog','Nagtatago'],'Inamin niyang may kakulangan sila.'],['Ano ang pangunahing kaisipan?',['May kabutihan at hamon ang harapang klase at online na pag-aaral, at maaaring pagsamahin ang dalawa','Masama ang online','Masama ang harapang klase','Mahal ang laptop'],'Ipinakita ang dalawang panig at ang blended learning.'],['Bakit madalas maiwan ang anak ni Ginoong Flores sa online na klase?',['Mahina ang signal at walang laptop','Ayaw niyang mag-aral','Mahirap ang aralin','Maaga ang klase'],'May kakulangan sa gamit at koneksiyon.'],['Ano ang ipinahihiwatig ng “Hindi lahat ng natutuhan ay nasa libro”?',['May mga aral na natututuhan sa pakikisama at karanasan','Hindi mahalaga ang libro','Libre ang libro','Mahirap ang libro'],'Kasama sa pagkatuto ang pakikipag-ugnayan.'],['Bakit mahalagang may maaasahang internet sa blended learning?',['Kung wala, hindi makasasabay ang bata sa online na bahagi','Para mapabilis ang bagyo','Para magpasikat','Para makatipid ng papel'],'Kailangan ito ng online na gawain.'],['Ano ang ipinahihiwatig ng layuning “walang batang maiwan”?',['Dapat makinabang ang lahat, hindi lamang ang may gamit','Dapat tumigil ang klase','Dapat bawal ang online','Dapat mag-isa ang bata'],'Dapat patas ang pagkakataon.'],['Ano ang layunin ng may-akda?',['Ilahad ang magkabilang panig at ang posibleng pinaghalong solusyon','Ipagbawal ang online','Ipagbili ang laptop','Magkuwento ng biro'],'Patas ang paglalahad.'],['Alin ang detalyeng sumusuporta sa pananaw na may bentahe ang online para sa ilang pamilya?',['Nakakatipid ng oras at pamasahe at nakakapag-aral kahit may bagyo','Mahaba ang aralin','Maraming guro','Mahal ang libro'],'Konkretong benepisyo ang nabanggit.'],['Paano naiiba ang pananaw ni Gng. Ocampo at ni Ginoong Flores?',['Interaksiyon at tulong agad ang diin ng una; abot-kaya at kaginhawahan ang diin ng ikalawa','Pareho sila','Estudyante ang una','Tsuper ang ikalawa'],'Magkaiba ang kanilang pokus.'],['Alin ang pinakamahusay na dahilan para sa blended learning?',['Napagsasama ang lakas ng dalawang paraan kung may sapat na gamit ang lahat','Mas mura ito','Mas mabilis ito','Wala nang guro'],'Pinagsasama nito ang mabuting bahagi ng dalawa.']],'Sumulat ng iskedyul ng isang linggo na may harapang klase at online na gawain.'),
RA('adv-en-6','en','Grade 6','Are Video Games Good for Kids?',['In many Filipino homes, the sound of a game console or a phone game after school is as familiar as the sound of cooking in the kitchen. Millions of children play video games every week. Parents and educators disagree on whether this is harmless fun or a growing problem.','Supporters say that games can sharpen the mind. Many games require players to solve puzzles, plan strategies, and react quickly. Some studies suggest that certain action games improve attention and hand-eye coordination. Online games can also help children make friends and learn teamwork. Coach Ben Torres, who runs an after-school club, says, “When children play in teams, they learn to communicate, take turns, and handle losing.”','Critics worry about the risks. Playing for hours can cut into sleep, homework, and physical activity. Some games reward players for logging in every day, which can make it hard to stop. Counselor Dr. Anne Salonga notes that children who play excessively may become irritable when asked to stop, and some spend money on in-game purchases without understanding the cost.','Experts agree that the answer is not simply yes or no. Quality and quantity both matter. Families can set time limits, choose age-appropriate games, play together, and keep gaming away from bedtime. When games become one part of a balanced day, rather than the whole day, they are more likely to help than harm.'],[['strategies','careful plans to reach a goal'],['coordination','the smooth working together of body parts'],['excessively','too much'],['irritable','easily annoyed or angry'],['purchases','things that are bought'],['balanced','having the right amount of different things']],[['What do some action games improve, according to some studies?',['Attention and hand-eye coordination','Height','Handwriting','Hearing'],'The passage names attention and coordination.'],['What does Coach Torres say children learn in teams?',['To communicate, take turns, and handle losing','To always win','To avoid friends','To skip homework'],'He lists these teamwork skills.'],['“Excessively” means…',['Too much','Very little','Quietly','Slowly'],'Excessively means beyond what is healthy.'],['What is the main idea?',['Video games can help or harm depending on how much and what kind children play','Games are bad','Games are good','Consoles are expensive'],'The passage weighs benefits and risks.'],['Why can daily login rewards make it hard to stop playing?',['They encourage players to return every day','They are boring','They are free','They end the game'],'Rewards pull players back daily.'],['What can you infer about children who spend money on in-game purchases without understanding the cost?',['They may need guidance about money and spending','They are rich','They hate games','They are experts'],'They do not understand the cost.'],['Why might the author compare game sounds to cooking sounds?',['To show how common gaming is in many homes','To praise cooking','To describe a kitchen','To scare readers'],'Both are familiar household sounds.'],['What does “quality and quantity both matter” suggest?',['What children play and how long they play both affect the result','Only time matters','Only the game matters','Nothing matters'],'Both type and amount count.'],['What is the author’s purpose?',['To present both sides and suggest balance','To ban games','To advertise games','To entertain'],'The author is balanced.'],['Which detail best supports the claim that games can teach social skills?',['Players in teams learn to communicate and take turns','Games are loud','Consoles are small','Games have colors'],'It names real social skills.'],['How do supporters and critics differ?',['Supporters stress skills and friendships; critics stress lost sleep, study time, and spending','They agree','Supporters are children','Critics are players'],'They focus on different effects.'],['Which is the strongest reason for setting time limits?',['It protects sleep and study while keeping the fun','It ends games','It is cheaper','It is trendy'],'It keeps a healthy balance.']],'Write a family agreement about gaming rules that is fair to everyone.'),
RA('adv-en-7','en','Grade 6','Sea Walls or Mangroves?',['When a typhoon pushes waves toward the coast, communities need protection. Two solutions are often discussed: building concrete sea walls or planting mangrove forests. Both aim to shield homes from floods and storm surges, but they work in very different ways.','Engineers who favor sea walls point to their strength and predictability. A well-built wall can be designed to resist waves of a certain height, and it can be finished in months. Mr. Paolo Garcia, a civil engineer, notes that dense towns with little open space may not have room for forests. “In crowded areas, a wall may be the only practical choice,” he says.','Marine scientists, however, highlight the benefits of mangroves. Their tangled roots slow down waves and trap mud, which helps build up the shoreline over time. Mangroves also shelter young fish and crabs, supporting local fishers, and they absorb carbon dioxide from the air. Dr. Lourdes Aquino adds that unlike concrete, mangroves can grow back and repair themselves after damage. The downside is that it takes years for a young forest to become strong enough, and it needs clean water and space.','Many coastal planners now recommend combining both: using walls in the most threatened areas while restoring mangroves in front of them to soften the waves. Choosing the best protection means weighing cost, speed, space, and long-term benefits for people and nature.'],[['surges','sudden rises of sea water during a storm'],['dense','closely packed'],['tangled','twisted together'],['absorb','take in'],['restoring','bringing back to a good condition'],['practical','sensible and workable']],[['How do mangrove roots help the shoreline?',['They slow waves and trap mud','They block the sun','They pump water','They stop rain'],'Their roots slow waves and trap mud.'],['What does Dr. Aquino say mangroves can do that concrete cannot?',['Grow back and repair themselves','Resist all waves','Be built quickly','Fit in small spaces'],'Mangroves can repair themselves.'],['“Dense” means…',['Closely packed','Empty','Wet','Colorful'],'Dense towns are crowded with buildings.'],['What is the main idea?',['Sea walls and mangroves each have strengths and limits, and combining them may be wise','Concrete is bad','Mangroves are slow','Typhoons are strong'],'The passage compares both and suggests combining them.'],['Why might a sea wall be the only practical choice in a crowded town?',['There may be no space for a forest','Walls are cheap','Mangroves are ugly','Fish dislike towns'],'Mr. Garcia points to a lack of open space.'],['What can you infer about how fast a young mangrove forest protects a coast?',['Protection may not be immediate','It is instant','It is useless','It is never needed'],'The text says it takes years.'],['Why might the author mention fish and crabs?',['To show mangroves also support livelihoods and wildlife','To change the topic','To describe food','To end the passage'],'Mangroves help local fishers and wildlife.'],['What does placing mangroves in front of walls suggest?',['Using both can give stronger and softer protection','Walls are useless','Mangroves are enough alone','Nothing is needed'],'Combining them softens waves.'],['What is the author’s purpose?',['To compare two solutions so readers can weigh them','To ban sea walls','To advertise mangroves','To describe a typhoon'],'The author compares fairly.'],['Which detail best supports the claim that mangroves benefit nature?',['They shelter young fish and absorb carbon dioxide','They are green','They grow in mud','They are common'],'These are ecological benefits.'],['How do engineers and marine scientists differ?',['Engineers stress strength and speed; scientists stress ecological and long-term benefits','They agree','Engineers plant trees','Scientists build walls'],'They emphasize different strengths.'],['Which is the strongest reason to restore mangroves along with building walls?',['It gives protection now while building natural defenses for the future','It is cheaper in all cases','It is faster than walls','It needs no care'],'It covers both short- and long-term needs.']],'Sketch a coast that uses both a sea wall and mangroves, and label what each does.'),
RA('adv-fil-9','fil','Grade 6','Paputok sa Bagong Taon: Ipagbawal o Panatilihin?',['Tuwing sasapit ang hatinggabi ng Bagong Taon, nagliliwanag at umuugong ang kalangitan sa tunog ng paputok. Para sa maraming Pilipino, bahagi ito ng tradisyon: ang ingay daw ay nagtataboy ng malas at nag-aanyaya ng suwerte. Ngunit tuwing Enero, nag-uulat din ang mga ospital ng mga batang nasugatan dahil sa paputok.','Panig sa pagbabawal si Dr. Lorna Dizon, doktor sa emergency room. Aniya, marami sa mga pasyente niya ang nasusunog ang kamay o nawawalan ng daliri, at ang iba ay napapahamak kahit nanonood lamang. Dagdag pa niya, nakakagambala rin ang ingay sa mga bata, matatanda, at mga alagang hayop, at nag-iiwan ng usok at basura sa mga kalye.','Hindi sang-ayon si Mang Ronnie Castro, na may maliit na negosyong gumagawa ng paputok sa kanilang bayan. Taon-taon ay umaasa ang pamilya niya at ng maraming kapitbahay sa kita tuwing Disyembre. “Kung ipagbabawal, ano ang ipapalit sa hanapbuhay namin?” tanong niya. Naniniwala siyang mas mainam ang mahigpit na regulasyon at pagsasanay sa ligtas na paggamit, kaysa sa tuluyang pagbabawal.','Nagmungkahi ang ilang lungsod ng gitnang solusyon: magtakda ng ligtas na pampublikong palabas ng mga ilaw na pinamamahalaan ng mga eksperto, at magbigay ng pagsasanay sa kabuhayan sa mga gumagawa ng paputok. Para sa marami, ang hamon ay kung paano pananatilihin ang kasiyahan nang hindi isinusugal ang kaligtasan ng mga bata. Samantala, patuloy na nagpapaalala ang pamahalaan na lumayo sa paputok at manood na lamang sa ligtas na distansiya.'],[['tradisyon','kaugaliang ipinapasa sa mga susunod na henerasyon'],['malas','masamang kapalaran'],['regulasyon','tuntunin o patakaran ng pamahalaan'],['nakakagambala','nakaiistorbo'],['isinusugal','inilalagay sa panganib']],[['Ano ang paniniwala tungkol sa ingay ng paputok sa Bagong Taon?',['Nagtataboy ng malas at nag-aanyaya ng suwerte','Nagpapagising ng hayop','Nagpapaulan','Nagpapalamig'],'Ito ang sinasabi ng tradisyon.'],['Ano ang ikinabubuhay ni Mang Ronnie Castro?',['Paggawa ng paputok','Pangingisda','Pagtuturo','Pagtitinda ng gulay'],'May maliit siyang negosyong gumagawa ng paputok.'],['Ano ang ibig sabihin ng “regulasyon”?',['Tuntunin o patakaran ng pamahalaan','Laruan','Pagkain','Kulay'],'Ito ay mga patakarang ipinatutupad.'],['Ano ang pangunahing kaisipan?',['May tradisyon at kabuhayang nakataya sa paputok, ngunit kailangang unahin ang kaligtasan ng tao','Masama ang Bagong Taon','Maganda ang ilaw','Mahal ang paputok'],'Ipinakita ang magkabilang panig.'],['Bakit sinusuportahan ni Dr. Dizon ang pagbabawal?',['Maraming pasyente ang nasusugatan dahil sa paputok','Mahal ang gamot','Maliit ang ospital','Ayaw niya ng Bagong Taon'],'Nakikita niya ang pinsalang idinudulot nito.'],['Ano ang ipinahihiwatig ng tanong ni Mang Ronnie na “ano ang ipapalit sa hanapbuhay namin?”',['Umaasa ang pamilya niya sa kita mula sa paputok at nangangailangan ng alternatibo','Ayaw niyang magtrabaho','Mayaman siya','Gusto niyang ipagbawal ito'],'Nanganganib ang kabuhayan nila.'],['Bakit kaya nabanggit ang ingay sa mga alagang hayop at matatanda?',['Para ipakitang may epekto ito sa iba, hindi lamang sa gumagamit','Para magbenta ng pagkain','Para magpatawa','Para ituro ang pagluluto'],'Hindi lamang ang gumagamit ang apektado.'],['Ano ang ipinahihiwatig ng mungkahing pampublikong palabas ng mga ilaw?',['Maaaring mapanatili ang kasiyahan sa mas ligtas na paraan','Dapat ipagbawal ang kasiyahan','Dapat mas maingay','Dapat mas maliit ang selebrasyon'],'Mas ligtas itong alternatibo.'],['Ano ang layunin ng may-akda?',['Ilahad ang magkabilang panig at isang posibleng gitnang solusyon','Ipagbawal ang Bagong Taon','Magbenta ng paputok','Magpatawa'],'Patas ang paglalahad.'],['Alin ang pinakamatibay na ebidensiya na may panganib ang paputok?',['Nag-uulat ang mga ospital ng nasugatang bata tuwing Enero','Maingay ito','Makulay ito','Mura ito'],'May tunay na pinsalang naitala.'],['Paano naiiba ang pananaw ni Dr. Dizon at ni Mang Ronnie?',['Kaligtasan ang diin ng una; hanapbuhay at mahigpit na regulasyon ang diin ng ikalawa','Pareho sila','Gumagawa ng paputok ang una','Doktor ang ikalawa'],'Magkaiba ang kanilang prayoridad.'],['Alin ang pinakamahusay na dahilan para sa gitnang solusyon?',['Napoprotektahan ang tao at natutulungan din ang kabuhayan ng gumagawa ng paputok','Mas mura ito','Mas maingay ito','Walang kailangang gawin'],'Binabalanse nito ang kaligtasan at kabuhayan.']],'Magmungkahi ng ligtas na paraan ng pagsalubong sa Bagong Taon.'),
RA('adv-fil-10','fil','Grade 6','Boracay: Turismo o Kalikasan?',['Noong 2018, isinara ng pamahalaan ang Isla ng Boracay sa mga turista sa loob ng anim na buwan. Ang dahilan: napansin ng mga awtoridad na umaabot sa dagat ang maruming tubig mula sa mga establisimyento, at lumalala ang basura at siksikan sa isla. Layunin ng pagsasara na ayusin ang imprastraktura at pangalagaan ang kapaligiran.','Para kay Dr. Mira Estrada, environmental scientist, tama ang desisyon. Aniya, kung hindi agad kikilos, mamamatay ang mga koral at lulubha ang polusyon, at mawawala rin ang dahilan kung bakit dinadayo ang isla. “Hindi mapagpapatuloy ang turismo kapag sinisira nito ang sarili nitong yaman,” sabi niya.','Ngunit libo-libong manggagawa ang naapektuhan: mga tagabuhat ng bagahe, tindera, at mga tsuper ng bangka. Isa na rito si Aling Nena, na ilang dekada nang nagtitinda ng souvenir sa baybayin. Sa loob ng anim na buwan, wala siyang kita, at nagbenta pa siya ng ilang kagamitan para may makain ang pamilya. “Gusto rin naming protektahan ang isla,” wika niya, “pero sana may tulong habang sarado.”','Pagkatapos ng muling pagbubukas, ipinatupad ang mas mahigpit na patakaran: limitasyon sa dami ng bisita, mas malayo ang mga gusali sa dalampasigan, at tamang sistema ng imburnal. Ayon sa mga nagmamasid, luminis ang tubig, ngunit nanatili ang hamon na magkaroon ng balanse sa pagitan ng kita at pangangalaga. Para sa maraming mamamayan, ang tanong ay kung paano matutulungan ang mga manggagawang nawalan ng hanapbuhay.'],[['awtoridad','mga opisyal na may kapangyarihan'],['imprastraktura','mga pampublikong gusali at sistema tulad ng kalsada at imburnal'],['mapagpapatuloy','maaaring ituloy nang matagal'],['imburnal','daluyan ng maruming tubig'],['limitasyon','hangganan']],[['Gaano katagal isinara ang Boracay noong 2018?',['Anim na buwan','Isang linggo','Dalawang taon','Isang araw'],'Anim na buwan ang pagsasara.'],['Ano ang ibinebenta ni Aling Nena?',['Souvenir sa baybayin','Isda','Gulay','Damit'],'Nagtitinda siya ng souvenir.'],['Ano ang ibig sabihin ng “imburnal”?',['Daluyan ng maruming tubig','Bundok','Sasakyan','Laruan'],'Dito dumadaloy ang maruming tubig.'],['Ano ang pangunahing kaisipan?',['Kailangang timbangin ang pangangalaga sa kapaligiran at ang kabuhayan ng mga manggagawa sa turismo','Masama ang turismo','Maganda ang isla','Mahal ang hotel'],'Ipinakita ang dalawang pangangailangan.'],['Bakit isinara ang Boracay?',['Umaabot sa dagat ang maruming tubig at lumalala ang basura at siksikan','Walang turista','Maraming bagyo','Nasunog ang isla'],'Nasisira ang kapaligiran.'],['Ano ang ibig ipahiwatig ni Dr. Estrada na mawawala ang dahilan kung bakit dinadayo ang isla?',['Kapag nasira ang kalikasan, mawawalan ng dahilan ang mga turistang bumisita','Aalis ang mga isda','Titigil ang hangin','Magbabago ang oras'],'Ang ganda ng kalikasan ang akit ng isla.'],['Ano ang ipinahihiwatig ng pagbebenta ni Aling Nena ng ilang kagamitan?',['Mahirap ang kalagayan niya habang walang kita','Mayaman siya','Gusto niyang lumipat','Ayaw niyang magtinda'],'Kinailangan niya ng pambili ng pagkain.'],['Ano ang ipinahihiwatig ng “sana may tulong habang sarado”?',['Sinusuportahan niya ang layunin ngunit kailangan ng suporta ang mga apektado','Tutol siya sa lahat','Gusto niyang buksan agad','Ayaw niya ng isla'],'Hindi siya tutol, humihingi lamang ng tulong.'],['Ano ang layunin ng may-akda?',['Ilahad ang magkabilang panig at ang hamon ng balanse','Ipagbawal ang turismo','Magbenta ng tiket','Magpatawa'],'Patas ang paglalahad.'],['Alin ang ebidensiyang may positibong epekto ang pagsasaayos?',['Ayon sa mga nagmamasid, luminis ang tubig','Maraming hotel','Mahal ang pamasahe','Maraming turista'],'Ito ang nabanggit na resulta.'],['Paano naiiba ang pananaw ni Dr. Estrada at ni Aling Nena?',['Kalikasan sa mahabang panahon ang diin ng una; agarang kabuhayan ang diin ng ikalawa','Pareho sila','Tindera ang una','Siyentista ang ikalawa'],'Magkaiba ang kanilang pokus.'],['Alin ang pinakamahusay na dahilan para magbigay ng tulong sa mga manggagawa habang sarado ang isla?',['Nakatutulong itong protektahan ang kalikasan nang hindi iniiwan ang mga nawalan ng kita','Mas mura ito','Mas mabilis ito','Walang kailangang gawin'],'Pinagsasama nito ang pangangalaga at pagkalinga.']],'Magmungkahi ng dalawang paraan para matulungan ang mga manggagawang apektado ng pagsasara ng isang pook-pasyalan.'),
RA('adv-en-8','en','Grade 6','Are Electric Vehicles the Answer?',['On busy streets in Manila, thick exhaust from old jeepneys and trucks hangs in the air. Because transport is one of the largest sources of air pollution and greenhouse gases, many governments are encouraging electric vehicles, or EVs, which run on batteries instead of gasoline or diesel.','Supporters say EVs offer clear benefits. They produce no tailpipe smoke, which can improve air quality in crowded cities. They are also quieter, and electric motors waste less energy than combustion engines. Some Philippine cities have introduced electric jeepneys, and drivers report lower fuel costs over time. Engineer Lara Santos notes that even when the electricity comes from a mix of sources, EVs generally cause fewer emissions over their lifetime.','Critics point out the challenges. EVs cost more to buy, and charging stations are still limited, especially outside big cities. Making batteries requires mining minerals such as lithium and nickel, which can harm land and communities if done carelessly. In places where most electricity comes from coal, the environmental gains are smaller. Jeepney driver Mang Ben worries that he cannot afford a new vehicle and fears losing his livelihood.','Many experts therefore suggest a gradual approach: expand charging stations, produce cleaner electricity, recycle old batteries, and offer loans and training for drivers. Electric vehicles may be an important part of the solution, but not the only one. Better public transport and safer walking and cycling lanes also matter.'],[['exhaust','smoke and gases from an engine'],['emissions','gases released into the air'],['combustion','the burning of fuel'],['minerals','natural materials found in the ground'],['gradual','happening slowly, step by step'],['livelihood','a way of earning a living']],[['What do EVs run on?',['Batteries','Gasoline','Diesel','Wood'],'EVs run on batteries.'],['What does Engineer Santos say about EVs over their lifetime?',['They generally cause fewer emissions','They cause more emissions','They cause none','They are always cheaper'],'She says they generally cause fewer emissions.'],['“Gradual” means…',['Happening slowly, step by step','Sudden','Loud','Expensive'],'A gradual approach moves step by step.'],['What is the main idea?',['EVs offer important benefits but face challenges, so a balanced, step-by-step approach is wise','EVs are bad','EVs are perfect','Jeepneys are old'],'The passage weighs both sides.'],['Why are the environmental gains smaller where most electricity comes from coal?',['Producing the electricity creates more pollution','Coal is cheap','Batteries are small','EVs are quiet'],'The power source adds emissions.'],['Why might Mang Ben fear losing his livelihood?',['He may not afford a new electric vehicle','He dislikes driving','He is retiring','He owns a charging station'],'He worries about the cost.'],['What can you infer about charging stations outside big cities?',['They are limited, making EVs harder to use there','They are everywhere','They are free','They are unnecessary'],'The text says they are limited.'],['Why does the author mention better public transport and cycling lanes?',['To show EVs are not the only solution','To criticize EVs','To advertise bikes','To end the passage'],'Other solutions matter too.'],['What is the author’s purpose?',['To present benefits and challenges so readers can weigh them','To ban cars','To advertise EVs','To scare readers'],'The author stays balanced.'],['Which detail best supports the claim that EVs can improve city air?',['They produce no tailpipe smoke','They are quiet','They cost more','They use batteries'],'No tailpipe smoke means cleaner air.'],['How do supporters and critics differ?',['Supporters stress cleaner air and lower running costs; critics stress cost, mining, and limited charging','They agree','Supporters are drivers','Critics are engineers'],'They focus on different aspects.'],['Which is the strongest reason to help drivers like Mang Ben when promoting EVs?',['A fair change should not leave workers behind','EVs are fast','Jeepneys are old','Batteries are heavy'],'Fairness requires supporting those affected.']],'Write a plan that would help a jeepney driver switch to an electric vehicle fairly.'),
RA('adv-en-9','en','Grade 6','Seeing Is Not Always Believing',['A photo of a famous singer holding a giant fish goes viral overnight. Thousands share it, and many comment that it is amazing. Later, an expert explains that the image was created with artificial intelligence and never happened. This is not a rare story. As image editing tools become more powerful, fake pictures and videos are becoming harder to recognize.','Some people argue that these tools are harmless creativity. Artists use them to imagine new worlds, teachers use them to create classroom illustrations, and friends use them for jokes. Designer Jun Ocampo says that technology is not the problem; what matters is how honestly we use it.','Others warn about real dangers. A fake image or video can spread false news, damage someone’s reputation, or trick people into sending money. During disasters, false pictures can cause panic or distract rescue efforts. Media researcher Dr. Ines Cabrera explains that people tend to believe what they see, so a convincing fake can travel faster than the correction that follows.','How can readers protect themselves? Experts recommend checking who posted the image, searching for the original source, and looking for odd details such as strange hands, blurry text, or shadows that do not match. When unsure, wait before sharing. Many platforms are also beginning to label AI-made images, but labels alone cannot replace careful thinking.'],[['viral','spreading quickly online'],['reputation','what people think about someone'],['panic','sudden, strong fear'],['convincing','able to make you believe it'],['correction','a statement that fixes a mistake'],['platforms','websites and apps where people share content']],[['What was true about the photo of the singer with a giant fish?',['It was created with AI and never happened','It was real','It was a painting','It was from an old movie'],'An expert explained it was AI-made.'],['What does Designer Jun Ocampo say matters most?',['How honestly we use technology','The price','The speed','The size'],'He says honesty in use is what matters.'],['“Viral” means…',['Spreading quickly online','Very quiet','Very old','Very small'],'The photo spread overnight.'],['What is the main idea?',['Convincing fake images are a growing problem, so people must check before they believe or share','AI is always bad','Photos are expensive','Singers are famous'],'The passage warns and gives advice.'],['Why can a fake image travel faster than its correction?',['People tend to believe what they see and share it quickly','Corrections are secret','Fakes are cheaper','Experts are slow'],'Seeing feels like proof.'],['What can you infer about people who share fake images without checking?',['They may spread false information without meaning to','They are experts','They are the creators','They are always lying'],'They may simply believe it.'],['Why might false pictures during disasters be especially harmful?',['They can cause panic and distract rescue efforts','They make photos prettier','They make news shorter','They help rescuers'],'The passage names panic and distraction.'],['What does the author suggest by saying labels “cannot replace careful thinking”?',['Readers still need to check information themselves','Labels are useless','Labels are illegal','Thinking is bad'],'Labels help, but thinking is still needed.'],['What is the author’s purpose?',['To warn readers and teach them to check images before believing or sharing','To sell AI tools','To make readers laugh','To ban artists'],'The passage informs and advises.'],['Which detail best supports the claim that fake images can cause harm?',['They can spread false news, damage reputations, or trick people into sending money','They are colorful','They are shared','They are new'],'These are real harms named in the passage.'],['How do the creative-use argument and the danger argument differ?',['One stresses imagination and fun; the other stresses harm from deception','They agree','One is about cameras','One is about paper'],'They focus on different effects.'],['Which is the strongest reason to wait before sharing a shocking image?',['It gives time to confirm that it is real','It saves data','It looks better','It makes friends'],'Checking prevents spreading falsehoods.']],'Make a checklist of five questions to ask before sharing a picture online.'),
RA('adv-en-10','en','Grade 6','Should Everyone Learn to Code?',['In many schools around the world, coding lessons are becoming as common as math and reading. Governments and companies say that software skills open doors to well-paying jobs. A growing movement even claims that every child should learn how to write computer programs. But not everyone agrees.','Supporters argue that coding teaches problem-solving. To write a program, a student must break a big task into small steps, test ideas, and fix mistakes. These habits can help in subjects like science and even daily life. Teacher Rina Dela Cruz says her students become more patient after debugging a program. She explains that they learn that failing is part of finding the answer. Supporters also point out that many jobs, even in farming and healthcare, now use software.','Critics respond that not every child needs to become a programmer. Some schools lack computers or reliable internet, so adding coding may widen the gap between rich and poor students. Others worry that time spent on coding might reduce time for reading, arts, or play. Education researcher Dr. Paulo Ramos believes digital literacy, meaning knowing how to use technology safely and wisely, should come first for everyone.','A middle ground is emerging: teach the basics of how computers work to all students, offer coding as an option for those interested, and make sure schools have the equipment to support it. In this view, the goal is not to turn every child into a programmer, but to ensure no child is left out of the digital world.'],[['debugging','finding and fixing mistakes in a program'],['literacy','the ability to understand and use something well'],['widen','make bigger'],['equipment','tools and machines needed for a job'],['emerging','starting to appear'],['option','a choice']],[['What does coding teach, according to supporters?',['Problem-solving by breaking tasks into steps and fixing mistakes','Drawing','Singing','Cooking'],'They say it builds problem-solving habits.'],['What does Dr. Ramos believe should come first?',['Digital literacy for everyone','Advanced programming','Robotics contests','Game design'],'He puts digital literacy first.'],['“Emerging” means…',['Starting to appear','Disappearing','Very old','Very loud'],'A middle ground is beginning to appear.'],['What is the main idea?',['Coding has benefits, but schools should balance it with digital literacy and fair access','Coding is useless','Everyone must be a programmer','Computers are fast'],'The passage weighs both sides and suggests balance.'],['Why might adding coding widen the gap between rich and poor students?',['Some schools lack computers or reliable internet','Coding is easy','Rich students dislike it','Poor students are lazy'],'Access to equipment is unequal.'],['What can you infer from students becoming more patient after debugging?',['Fixing mistakes can build persistence','Computers are slow','Students dislike school','Teachers are strict'],'Debugging teaches patience.'],['Why does the author mention that farming and healthcare use software?',['To show digital skills matter beyond tech jobs','To criticize farming','To advertise software','To change the topic'],'Software is used in many fields.'],['What does “no child is left out of the digital world” suggest?',['Everyone should have the chance to understand and use technology','Everyone must code','Schools should ban computers','Only some should learn'],'The goal is fair access.'],['What is the author’s purpose?',['To present both sides and suggest a middle ground','To ban coding','To sell computers','To teach programming'],'The passage is balanced.'],['Which detail best supports the claim that coding builds problem-solving?',['Students break big tasks into steps, test ideas, and fix mistakes','Coding is modern','Computers are fast','Jobs pay well'],'It describes the process of solving problems.'],['How do supporters and critics differ?',['Supporters stress skills and opportunity; critics stress access, time, and priorities','They agree','Supporters are students','Critics are programmers'],'They emphasize different concerns.'],['Which is the strongest reason to offer coding as an option rather than a requirement?',['It respects different interests while still providing access for those who want it','It is cheaper','It is easier','It is popular'],'It balances choice and access.']],'Write your opinion: should every student learn to code? Give two reasons and respond to one opposing view.')];

 var p=pid(id),c=cat(p.category),n=p.questions.length,pr=S.prog[id]||(S.prog[id]={i:0,a:[]});cur=id;
 if(pr.i>=n)return finish(id);
 if(brk)return show('<div class="k'+c.k+' bx rd" style="text-align:center"><div class="big">⭐⭐</div><h2>Bahagi '+(pr.i/4)+' ng 3 tapos na!</h2><p>Napakahusay mo. Magpahinga sandali, uminom ng tubig, tapos tuloy tayo.</p><button class="btn go" data-a="quiz" data-v="'+id+'">Magpatuloy</button></div>');
 var q=p.questions[pr.i],a=pr.a[pr.i],ans=a!==undefined,st='';
 for(var i=0;i<n;i++)st+='<span>'+(i<pr.i||(i===pr.i&&ans)?'⭐':'☆')+'</span>';
 var h='<div class="k'+c.k+'"><div class="bx rd"><div class="row"><button class="btn" data-a="read" data-v="'+id+'">← Teksto</button></div><b>Tanong '+(pr.i+1)+' sa '+n+'</b><div class="stars" aria-hidden="true">'+st+'</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+pr.i+'"><i style="width:'+(pr.i/n*100)+'%"></i></div>';
 if(p.category==="enr"||p.category==="adv")h+='<details><summary>Balikan ang teksto</summary><div class="txt" lang="'+p.lang+'" style="--fs:1.05rem">'+p.paragraphs.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div></details>';
 h+='<h2 style="font-size:1.5rem;margin:14px 0" lang="'+p.lang+'">'+esc(q.q)+'</h2><div class="opts" lang="'+p.lang+'">';
 q.options.forEach(function(o,i){var cl=ans?(i===q.answer?" ok":i===a?" no":""):"";h+='<button class="opt'+cl+'" data-a="opt" data-v="'+i+'"'+(ans?' disabled':'')+'>'+esc(o)+(cl===" ok"?" ✓":"")+'</button>'});
 h+='</div>';
 if(ans)h+='<div class="fb" role="status">'+(a===q.answer?'<b>Tama! 🎉</b> ':'<b>Halos tama ka na! Subukan ulit sa susunod. 💪</b> ')+esc(q.why)+'</div><button class="btn go" data-a="next">'+(pr.i+1<n?'Susunod':'Tingnan ang resulta')+'</button>';
 show(h+'</div></div>');
}
function finish(id){
 var p=pid(id),c=cat(p.category),pr=S.prog[id],n=p.questions.length,r=0;
 if(!pr.fin){p.questions.forEach(function(q,i){var t=S.stats[q.type]||(S.stats[q.type]=[0,0]);t[1]++;if(pr.a[i]===q.answer){r++;t[0]++}});
  pr.r=r;pr.fin=1;var pct=Math.round(r/n*100),o=S.done[id];S.done[id]={pct:pct,best:Math.max(pct,o?o.best:0),stars:Math.max(starsOf(pct),o?o.stars:0)};S.last={pct:pct};
  var d=new Date(),t=d.toISOString().slice(0,10),y=new Date(d-864e5).toISOString().slice(0,10);if(S.streak.last!==t){S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t}save()}
 r=pr.r;var pct=Math.round(r/n*100),rc=recommend(),wk=weakest();
 show('<div class="k'+c.k+' bx rd" style="text-align:center"><div class="big" aria-label="'+starsOf(pct)+' bituin">'+'⭐'.repeat(starsOf(pct))+'</div><h2>'+r+' sa '+n+' ('+pct+'%)</h2><p>'+(pct>=90?'Wow, ang galing mo!':pct>=70?'Magaling! Konting practice pa.':pct>=50?'Maganda ang simula. Kaya mo ito!':'Subukan ulit. Ipinagmamalaki kita sa pagsisikap mo!')+'</p><p>Susunod na hakbang: <b>'+rc.n+'</b>.'+(wk?' Magsanay pa sa: '+wk+'.':'')+'</p><div class="fb" style="text-align:left"><b>Gawain:</b> '+esc(p.task)+'</div><div class="row" style="justify-content:center"><button class="btn go" data-a="cat" data-v="'+rc.id+'">Pumunta sa '+rc.n+'</button><button class="btn" data-a="retry" data-v="'+id+'">Ulitin</button><button class="btn" data-a="home">Tahanan</button></div></div>');
}
function badges(){
 var b=[["Unang Passage",Object.keys(S.done).length>=1]];
 CATS.forEach(function(c){b.push(["Bituin ng "+c.n,P.some(function(p){return p.category===c.id&&S.done[p.id]})])});
 b.push(["3 Araw na Streak",S.streak.n>=3],["10 Bituin",totStars()>=10]);return b;
}
function prog(){
 var h='<button class="btn" data-a="home">← Bumalik</button><div class="bx rd k2" style="margin-top:12px"><h2>Progreso ni '+esc(S.name||"Kaibigan")+'</h2><p>⭐ '+totStars()+' bituin · 🔥 '+S.streak.n+' araw na streak</p>';
 CATS.forEach(function(c){var ps=P.filter(function(p){return p.category===c.id}),d=ps.filter(function(p){return S.done[p.id]}).length;h+='<div class="k'+c.k+'"><b>'+c.n+'</b> '+d+' sa '+ps.length+'<div class="bar"><i style="width:'+(ps.length?d/ps.length*100:0)+'%"></i></div></div><br>'});
 h+='<h3>Mga Badge</h3>'+badges().map(function(x){return '<span class="bd'+(x[1]?'':' off')+'">'+(x[1]?'🏅 ':'🔒 ')+x[0]+'</span>'}).join("")+'</div>';
 show(h);
}
function teach(){
 var h='<button class="btn" data-a="home">← Bumalik</button><div class="bx rd k1" style="margin-top:12px"><h2>Para sa guro at magulang</h2><h3 style="margin-top:14px">Tamang sagot ayon sa uri ng tanong</h3><table>';
 var any=0;for(var t in S.stats){any=1;var s=S.stats[t],pc=Math.round(s[0]/s[1]*100);h+='<tr><td>'+TY[t]+'</td><td style="width:45%"><div class="bar"><i style="width:'+pc+'%"></i></div></td><td>'+pc+'% ('+s[0]+'/'+s[1]+')</td></tr>'}
 if(!any)h+='<tr><td>Wala pang datos.</td></tr>';
 h+='</table><h3 style="margin-top:14px">Mga natapos na passage</h3><table>';
 P.forEach(function(p){var d=S.done[p.id];if(d)h+='<tr><td>'+esc(p.title)+'</td><td>'+cat(p.category).n+'</td><td>'+d.pct+'% (best '+d.best+'%)</td></tr>'});
 h+='</table><div class="row"><button class="btn" data-a="lock" aria-pressed="'+S.lock+'">I-lock ang susunod na passage</button><button class="btn" data-a="reset">Burahin ang progreso</button></div></div>';
 show(h);
}
function speak(){
 if(!window.speechSynthesis)return;if(spk)return stopSp();
 var p=pid(cur),sp=[].slice.call(document.querySelectorAll(".s")),k=0;spk=1;$("#sp").textContent="⏹ Itigil";
 (function nx(){sp.forEach(function(x){x.classList.remove("hl")});if(!spk||k>=sp.length)return stopSp();
  var u=new SpeechSynthesisUtterance(sp[k].textContent);u.lang=p.lang==="fil"?"fil-PH":"en-US";u.rate=.85;sp[k].classList.add("hl");u.onend=function(){k++;nx()};u.onerror=function(){stopSp()};speechSynthesis.speak(u)})();
}
function stopSp(){if(!spk)return;spk=0;try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll(".hl").forEach(function(x){x.classList.remove("hl")});var b=$("#sp");if(b)b.textContent="🔊 Pakinggan"}
$("#app").onclick=function(e){
 var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(a==="home")home();else if(a==="cat"){S.cat=v;list(v)}
 else if(a==="lang"){S.lang=v;save();b.dataset.r?list(b.dataset.r):home()}
 else if(a==="read")reader(v);else if(a==="quiz")quiz(v);
 else if(a==="opt"){var pr=S.prog[cur];pr.a[pr.i]=+v;save();quiz(cur)}
 else if(a==="next"){var pr2=S.prog[cur];pr2.i++;save();var n=pid(cur).questions.length;quiz(cur,pid(cur).category==="adv"&&pr2.i%4===0&&pr2.i<n)}
 else if(a==="retry"){delete S.prog[v];save();quiz(v)}
 else if(a==="prog")prog();else if(a==="teach")teach();
 else if(a==="word"){var w=pid(cur).vocab[+v];$("#tip").innerHTML="<b>"+esc(w.word)+(w.syllables?" ("+w.syllables+")":"")+"</b>: "+esc(w.meaning)}
 else if(a==="size"){S.size=Math.max(1,Math.min(2,S.size+.1*v));save();$(".rd").style.setProperty("--fs",S.size+"rem")}
 else if(a==="easy"){S.easy=!S.easy;save();$(".rd").classList.toggle("easy",S.easy);b.setAttribute("aria-pressed",S.easy)}
 else if(a==="speak")speak();
 else if(a==="lock"){S.lock=!S.lock;save();b.setAttribute("aria-pressed",S.lock)}
 else if(a==="reset"){if(confirm("Buburahin ang lahat ng progreso sa device na ito. Itutuloy?")){S.done={};S.stats={};S.prog={};S.streak={n:0,last:""};S.last=null;save();home()}}
};
$("#top").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
 if(a==="home")home();else if(a==="av"){S.av=AV[(AV.indexOf(S.av)+1)%AV.length];save();hdr();if(!$(".rd"))home()}
 else if(a==="theme"){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"}};
hdr();home();
</script></body></html>
