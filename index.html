RE('enr-fil-6','fil','Grade 5','Ang Tubbataha Reefs',['Sa gitna ng Dagat Sulu, malayo sa baybayin ng Palawan, matatagpuan ang Tubbataha Reefs. Ito ay isang pambansang liwasang pandagat na kinilala ng UNESCO bilang World Heritage Site dahil sa taglay nitong kagandahan at yaman ng buhay-dagat.','Dito nakatira ang daan-daang uri ng koral at isda, pati ang mga pawikan at pating. Dahil malayo ito at mahirap puntahan, nanatiling malinis at masagana ang mga bahura. Ngunit hindi ito ligtas sa panganib. Ang pangingisda gamit ang dinamita, pagtatapon ng basura, at mga barkong sumasadsad ay maaaring makasira rito.','Kaya mahigpit ang pagbabantay. Ipinagbabawal ang pangingisda sa loob ng liwasan, at may mga ranger na nagmamasid araw at gabi. Ang mga bisita ay maaari lamang pumunta sa ilang buwan ng taon, kung kalmado ang dagat, at kailangang sumunod sa mga patakaran.'],[['liwasang pandagat','protektadong lugar sa dagat'],['bahura','hanay ng koral sa ilalim ng dagat'],['sumasadsad','tumatama at napapaupo sa ilalim o bato'],['ipinagbabawal','hindi pinahihintulutan']],[['Saang dagat matatagpuan ang Tubbataha Reefs?',['Dagat Bisayas','Dagat Sulu','Dagat Celebes','Dagat Pasipiko'],1,'Nasa Dagat Sulu ito.'],['Ano ang kinilala ng UNESCO sa Tubbataha?',['Paliparan','Palengke','World Heritage Site','Bayan'],2,'Kinilala itong World Heritage Site.'],['Ano ang ibig sabihin ng “ipinagbabawal”?',['Hindi pinahihintulutan','Hinihikayat','Pinapasalamatan','Pinaghahandaan'],0,'Hindi ito puwedeng gawin.'],['Ano ang pangunahing kaisipan?',['Malayo ang Palawan','Maraming barko','Ang Tubbataha ay yaman ng dagat na kailangang bantayan','Masarap ang isda'],2,'Binibigyang-diin ang halaga at proteksyon nito.'],['Bakit nanatiling masagana ang mga bahura?',['Madalas ang bagyo','Maraming turista','May pabrika','Malayo ito at mahigpit ang pagbabantay'],3,'Kaunti ang nakakagambala rito.'],['Ano ang maaaring mangyari kung hindi ipagbabawal ang pangingisda sa liwasan?',['Dadami ang koral','Maaaring masira ang bahura at mawala ang mga hayop','Hihinto ang alon','Lalaki ang isla'],1,'Mauubos at masisira ang yaman nito.'],['Bakit kaya limitado ang pagbisita sa ilang buwan lamang?',['Para mahirapan ang turista','Dahil bawal maligo','Dahil kalmado ang dagat sa mga buwang iyon','Dahil walang bangka'],2,'Mas ligtas ang biyahe kapag kalmado ang dagat.'],['Paano ka makakatulong sa dagat kahit malayo ka sa baybayin?',['Magtapon sa kanal','Magtapon ng basura sa tamang lalagyan at bawasan ang plastik','Manghuli ng koral','Wala akong magagawa'],1,'Napupunta sa dagat ang basurang itinapon kung saan-saan.']],'Gumawa ng poster para sa Tubbataha: “Ingatan ang Ating Dagat.”'),
RE('enr-fil-7','fil','Grade 5','Ang Kuwento ng Pandesal',['Bago pa sumikat ang araw, naaamoy na sa maraming kalye ang bagong lutong pandesal. Sa harap ng panaderya, nakapila na ang mga tao dala ang kanilang supot at barya. Mainit pa at malambot ang tinapay na ito, kaya madalas itong isawsaw sa kape o palamanan ng mantikilya.','Ang pangalang pandesal ay hango sa Espanyol na pan de sal, na ang ibig sabihin ay tinapay na may asin. Ngunit ang pandesal na kinagisnan ng mga Pilipino ay bahagyang matamis at binalutan ng pinong mumo ng tinapay. Natutunan itong gawin ng mga panadero noong panahon ng mga Kastila at unti-unting nakabagay sa panlasang Pilipino.','Hindi lamang ito pagkain; bahagi ito ng araw-araw na buhay. Para sa maraming pamilya, ang pagbili ng pandesal ay pagkakataon ding makipagkuwentuhan sa mga kapitbahay at sa panadero. Sa murang halaga, nabubusog ang mag-anak at nabubuhay ang maliliit na negosyo.'],[['panaderya','tindahang gumagawa at nagbebenta ng tinapay'],['hango','halaw o galing sa'],['kinagisnan','nakasanayan mula pagkabata'],['mumo','maliliit na piraso ng tinapay']],[['Kailan naaamoy ang bagong lutong pandesal?',['Sa gabi','Bago sumikat ang araw','Sa tanghali','Sa hatinggabi'],1,'Maaga pa, bago sumikat ang araw.'],['Ano ang ibig sabihin ng pan de sal sa Espanyol?',['Matamis na tinapay','Mainit na kape','Tinapay na may asin','Harina'],2,'Tinapay na may asin.'],['Ano ang ibig sabihin ng “hango”?',['Itinapon','Binili','Halaw o galing sa','Kinain'],2,'Ang pangalan ay galing sa Espanyol.'],['Ano ang pangunahing kaisipan?',['Ang pandesal ay higit pa sa pagkain; bahagi ito ng buhay ng mga Pilipino','Mahal ang kape','Maraming panaderya','Madaling lutuin ang pandesal'],0,'Ipinapakita ang papel nito sa araw-araw na buhay.'],['Paano nabubuhay ang maliliit na negosyo dahil sa pandesal?',['Ibinebenta nang mahal','Bihira itong bilhin','Bawal itong ibenta','Araw-araw itong binibili sa murang halaga'],3,'Regular ang mga mamimili.'],['Bakit kaya mabilis maubos ang pandesal sa umaga?',['Sariwa at murang pang-almusal ito','Walang ibang pagkain','Maliit ang tindahan','Bawal bumili sa hapon'],0,'Gusto ito ng marami sa almusal.'],['Ano ang ipinahihiwatig ng “nakabagay sa panlasang Pilipino”?',['Ipinagbawal ang lasa','Kinopya nang buo','Binago ang lasa para magustuhan ng mga Pilipino','Hindi ito nagbago'],2,'Inangkop ito sa gusto ng mga Pilipino.'],['Ano ang tamang gawin kapag bumibili sa maliit na negosyo?',['Humingi nang libre','Magbayad nang tama at magpasalamat','Magreklamo agad','Umalis nang walang paalam'],1,'Iginagalang ang paghihirap ng nagtitinda.']],'Isulat ang pagkaing hindi mo malilimutan at ang kuwento sa likod nito.'),
RE('enr-fil-8','fil','Grade 6','Bakit Bumabaha Tuwing Tag-ulan?',['Tuwing tag-ulan, maraming lugar ang binabaha kahit sandali lamang ang buhos ng ulan. Maraming dahilan ito. Una, barado ang mga kanal at estero dahil sa basurang itinapon ng mga tao. Kapag walang madaluyan, bumabalik ang tubig sa kalsada at pumapasok sa mga bahay.','Pangalawa, kaunti na ang mga punong sumisipsip ng tubig-ulan dahil napalitan na ng semento ang maraming lupa. Pangatlo, tumataas ang lebel ng dagat sa ilang baybayin, kaya mas mabagal na bumababa ang tubig-baha. Kapag pinagsama-sama, lumalala ang problema.','Ngunit may magagawa ang bawat isa. Ang tamang pagtatapon ng basura ay nakapagbubukas ng daluyan ng tubig. Ang pagtatanim ng puno at paggawa ng maliliit na hardin ay nakatutulong sumipsip ng ulan. Higit sa lahat, ang paghahanda at pakikinig sa babala ay nakapagliligtas ng buhay. Kapag nagtulungan ang pamahalaan at mamamayan, mas ligtas ang bawat pamilya.'],[['barado','sarado at hindi madaanan'],['estero','makitid na daluyan ng tubig sa lungsod'],['sumisipsip','humihigop ng likido'],['lebel','taas o antas']],[['Ano ang unang dahilan ng pagbaha?',['Kakulangan ng ulan','Barado ang kanal at estero dahil sa basura','Kakulangan ng ilaw','Dami ng bangka'],1,'Barado ang mga daluyan ng tubig.'],['Ano ang pumalit sa maraming lupa?',['Palayan','Dagat','Semento','Kagubatan'],2,'Napalitan ito ng semento.'],['Ano ang ibig sabihin ng “barado”?',['Malinis','Malalim','Mabilis','Sarado at hindi madaanan'],3,'Hindi makadaan ang tubig.'],['Ano ang pangunahing kaisipan?',['Bawal ang ulan','Maraming sanhi ang pagbaha at may magagawa ang bawat isa','Mahal ang semento','Maraming estero'],1,'Ipinapakita ang sanhi at solusyon.'],['Bakit bumabalik ang tubig sa kalsada?',['Maliit ang ulan','Mataas ang tulay','Walang madaluyan kapag barado ang kanal','Malamig ang panahon'],2,'Kapag barado, walang daanan ang tubig.'],['Bakit nakatutulong ang pagtatanim ng puno?',['Sumisipsip ito ng tubig-ulan','Nagpapainit ito','Nagpapabilis ito ng baha','Nagpapalakas ito ng ulan'],0,'Sinisipsip ng puno ang tubig.'],['Ano ang ipinahihiwatig ng “lumalala ang problema kapag pinagsama-sama”?',['Walang epekto ang mga ito','Madali itong lutasin','Mas malala ang epekto kapag magkakasabay ang mga sanhi','Iisa lang ang sanhi'],2,'Nagpapalala ang pagsasama ng mga sanhi.'],['Ano ang magagawa mo para makaiwas sa pagbaha sa komunidad?',['Itapon ang basura sa kanal','Sunugin ang basura','Maghintay lang','Itapon ang basura sa tamang lalagyan'],3,'Naiiwasan nitong mabara ang daluyan.']],'Gumawa ng plano ng inyong pamilya kapag may babala ng baha.'),
RE('enr-fil-9','fil','Grade 6','Ang Liham ni Kuya Andoy',['Limang taon nang nagtatrabaho bilang marinero si Kuya Andoy sa malayong bansa. Tuwing ikatlong buwan lamang siya nakakauwi, at kung minsan ay isang beses lang sa isang taon. Si Lita, ang kanyang kapatid na labing-isang taong gulang, ay laging naghihintay ng mga liham niya.','Sa isang liham, isinulat ni Kuya: “Kapag nalulungkot ako, tinitingnan ko ang litrato ninyo ni Nanay. Alam kong mahirap ang malayo, pero ginagawa ko ito para makapag-aral ka at hindi ka na kailangang magpakahirap tulad ko.” Napaiyak si Lita. Naalala niya ang mga pagkakataong nagtampo siya dahil wala si Kuya sa kaniyang kaarawan.','Kinabukasan, gumawa si Lita ng sagot sa liham. Ikinuwento niya ang matataas niyang marka at ang paborito niyang aklat. Sa dulo, isinulat niya: “Hindi ka man nandito, ramdam ko ang pagmamahal mo.” Ipinadala niya ito kasama ng isang guhit ng kanilang bahay.'],[['marinero','taong nagtatrabaho sa barko'],['liham','sulat'],['nagtampo','nagdamdam nang bahagya dahil kulang ang atensyon'],['magpakahirap','magtiis ng matinding hirap']],[['Ano ang trabaho ni Kuya Andoy?',['Guro','Marinero','Magsasaka','Doktor'],1,'Marinero siya sa malayong bansa.'],['Ilang taong gulang si Lita?',['Labing-isa','Siyam','Labinlima','Pito'],0,'Labing-isang taong gulang siya.'],['Ano ang ibig sabihin ng “nagtampo”?',['Nagalit nang todo','Natuwa','Nagdamdam nang bahagya dahil kulang ang atensyon','Natulog'],2,'Nagdamdam siya dahil wala si Kuya.'],['Ano ang pangunahing kaisipan?',['Maganda ang barko','Nagtitiis ang pamilyang magkakalayo dahil sa pagmamahal at pangarap','Maraming liham','Mahirap ang aralin'],1,'Ipinapakita ang sakripisyo at pagmamahalan.'],['Bakit nagtatrabaho sa malayo si Kuya Andoy?',['Para magbakasyon','Para magtago','Para maglaro','Para makapag-aral si Lita at gumanda ang buhay nila'],3,'Ginagawa niya ito para sa pag-aaral ni Lita.'],['Ano ang ipinahihiwatig ng pagguhit ni Lita ng kanilang bahay?',['Gusto niyang maramdaman ni Kuya na nasa tahanan pa rin siya','Gusto niyang magpagawa ng bahay','Ayaw niya ng liham','Galit pa rin siya'],0,'Gusto niyang malapit sa kanya ang pamilya.'],['Paano nagbago ang damdamin ni Lita pagkabasa ng liham?',['Mula saya ay naging galit','Hindi nagbago','Mula tampo ay naging pag-unawa','Naging takot'],2,'Naunawaan niya ang sakripisyo ni Kuya.'],['Paano ka makapagpapakita ng pagmamahal sa kapamilyang malayo?',['Hindi magpaalam','Magtampo palagi','Kalimutan sila','Sumulat, tumawag, at magpasalamat'],3,'Pinapalapit nito ang mga puso.']],'Sumulat ng maikling liham para sa kapamilyang malayo sa iyo.'),
RE('enr-fil-10','fil','Grade 6','Ang Sinaunang Ukit sa Angono',['Sa Angono, Rizal, may isang rock shelter na naglalaman ng pinakamatandang kilalang sining sa Pilipinas. Sa pader nito, may mahigit isandaang ukit na hugis tao at hayop na tinatayang tatlong libong taong gulang na.','Tinatawag itong petroglyph, ang ukit sa bato. Ginawa ito ng mga sinaunang tao gamit ang matutulis na bato. Hindi tiyak ng mga siyentipiko ang eksaktong kahulugan ng mga larawan; maaaring ito ay ritwal, kuwento, o tala ng kanilang pamumuhay. Dahil walang nakasulat na paliwanag, kailangang pag-aralan ang bawat guhit nang maingat.','Mahalaga ang pangangalaga nito. Ang hangin, ulan, at hawak ng mga bisita ay maaaring magpabura sa mga ukit. Kaya may mga patakaran at bantay ang lugar, at ang mga mag-aaral ay tinuturuan kung bakit dapat igalang ang ating pamanang kultura. Ang mga ukit ay parang mga pahina ng aklat na hindi pa natin lubos na nababasa.'],[['sinaunang','mula pa sa napakatagal na panahon'],['ukit','disenyo na hinukay sa ibabaw ng bato'],['ritwal','seremonya'],['pamanang kultura','yaman ng nakaraan na ipinasa sa atin']],[['Saan matatagpuan ang mga petroglyph na tinalakay?',['Vigan','Angono, Rizal','Bohol','Sagada'],1,'Nasa Angono, Rizal ang mga ito.'],['Gaano na katanda ang mga ukit?',['Sampung taon','Limampung taon','Tinatayang tatlong libong taon','Isang daang taon'],2,'Tinatayang tatlong libong taong gulang.'],['Ano ang ibig sabihin ng “sinaunang”?',['Bago pa lang','Mabilis','Mula pa sa napakatagal na panahon','Malayo'],2,'Napakatagal na panahon na ang nakalipas.'],['Ano ang pangunahing kaisipan?',['Malaki ang kuweba','Ang mga petroglyph ay mahalagang pamana na dapat pangalagaan','Mahirap puntahan ang lugar','Mahal ang tiket'],1,'Binibigyang-diin ang pangangalaga.'],['Bakit kailangang ingatan ang mga ukit?',['Dahil mabigat','Dahil mahal','Dahil malayo','Maaaring mabura ang mga ito ng hangin, ulan, at paghawak'],3,'Madaling masira ang mga ito.'],['Ano ang ipinahihiwatig ng pagiging “mga pahina ng aklat na hindi pa nababasa”?',['Marami pang hindi natin alam tungkol sa kahulugan nito','Aklat ito','Madali itong basahin','Walang saysay ito'],0,'May hindi pa nauunawaan ang mga siyentipiko.'],['Bakit kaya mahirap malaman ang eksaktong kahulugan ng mga ukit?',['Sira ang kuweba','Walang gustong mag-aral','Walang nakasulat na paliwanag mula sa gumawa','Madilim sa loob'],2,'Walang tala ng paliwanag.'],['Ano ang dapat gawin sa makasaysayang lugar?',['Magsulat sa pader','Sumunod sa patakaran at huwag hawakan ang mga bagay','Magtapon ng basura','Kumuha ng bato'],1,'Iginagalang nito ang pamana.']],'Gumawa ng sariling simbolo na parang ukit sa bato at ipaliwanag ang kahulugan nito.'),
RE('enr-en-6','en','Grade 5','How Volcanoes Build Islands',['The Philippines sits along the Pacific Ring of Fire, a curved zone where many volcanoes and earthquakes occur. This is no coincidence. Earth’s outer layer is broken into giant slabs called plates, and in this region several plates push against each other.','When one plate slides under another, it sinks into the hot mantle and melts. The melted rock, called magma, is lighter than the rock around it, so it rises and collects in underground chambers. If pressure builds, the magma bursts out as lava, ash, and gas. Over thousands of years, layers of cooled lava and ash pile up, forming cones such as Mayon Volcano.','Some volcanoes grow on the seafloor until they rise above the waves, giving birth to new islands. Although eruptions can be dangerous, volcanic soil is rich in minerals, which is why farms near volcanoes are often very productive. Scientists monitor volcanoes closely so that families can leave before danger arrives.'],[['plates','giant slabs that make up Earth’s outer layer'],['magma','melted rock under the ground'],['pressure','a strong pushing force'],['monitor','watch and check carefully']],[['What is the Ring of Fire?',['A kind of volcano','A zone with many volcanoes and earthquakes','A fire festival','A sea'],1,'It is a curved zone of volcanoes and earthquakes.'],['What is melted rock under the ground called?',['Magma','Ash','Soil','Ice'],0,'It is called magma.'],['To “monitor” means to…',['Ignore','Break','Watch and check carefully','Build'],2,'Scientists watch volcanoes closely.'],['What is the main idea?',['Ash is gray','Volcanoes in the Philippines form because plates move, and they shape land and life','Islands float','All volcanoes are cones'],1,'The passage explains how and why.'],['Why does magma rise?',['It is cold','It is heavy','It is dry','It is lighter than the rock around it'],3,'Lighter material rises.'],['Why do farmers often like land near volcanoes?',['Volcanic soil is rich in minerals','It is always cool','It has no rain','It has no people'],0,'Rich soil helps crops grow.'],['Why do scientists monitor volcanoes?',['To make eruptions bigger','To warn families so they can leave before danger','To sell ash','To name them'],1,'Early warning saves lives.'],['What should you do if officials announce an evacuation near a volcano?',['Go sightseeing','Hide at home','Follow instructions and move to a safe place','Ignore it'],2,'Quick action keeps you safe.']],'Draw a cross-section of a volcano and label the magma and the crater.'),
RE('enr-en-7','en','Grade 5','The Boy Who Fixed Radios',['Tomas lived in a village where the radio was the main way to hear news and music. When Mang Dado’s old radio stopped working, Tomas, only twelve, asked if he could look inside. Mang Dado laughed but handed it over. Tomas opened the back and found a loose wire.','He tried to fix it with a pin, then with tape, but the radio stayed silent. Instead of giving up, he borrowed a book from the library about simple circuits. For three evenings he studied the diagrams and tested each part until, at last, he discovered a broken fuse. The next morning, music filled the room.','Soon neighbors brought their broken radios, fans, and flashlights. Tomas never asked for payment, only to keep the old parts. Years later, as an engineer, he told reporters that his first lesson was learned on Mang Dado’s porch: “Every problem is a puzzle, and puzzles can be solved.”'],[['loose','not firmly attached'],['circuits','paths along which electricity flows'],['diagrams','drawings that explain how something works'],['engineer','a person who designs and builds machines or structures']],[['What did Tomas find when he opened the radio?',['A broken speaker','A loose wire','A mouse','Nothing'],1,'He found a loose wire.'],['What did Tomas borrow from the library?',['A book about simple circuits','A radio','Tools','A fuse'],0,'He borrowed a book on circuits.'],['“Diagrams” are…',['Loud sounds','Types of batteries','Drawings that explain how something works','Kinds of wires'],2,'Tomas studied the diagrams.'],['What is the best main idea?',['Radios are old','Neighbors are kind','Libraries are quiet','Curiosity and patience can solve problems'],3,'Tomas kept learning until he fixed it.'],['Why did Tomas study the book?',['He was bored','His first repairs did not work','He was told to','He wanted to sell it'],1,'The pin and tape failed.'],['What does Tomas’s refusal of payment suggest?',['He was rich','He disliked money','He enjoyed learning and helping','He was scared'],2,'He wanted the experience.'],['What can you infer from Tomas’s later career as an engineer?',['Early curiosity shaped his future','He was only lucky','He never studied','He hated radios'],0,'His first lesson led to his career.'],['How can you handle a problem you cannot solve right away?',['Give up','Blame others','Break it','Keep trying, ask for help, and look for information'],3,'Persistence and learning work.']],'Describe a problem you solved and the steps you took.'),
RE('enr-en-8','en','Grade 6','Where Does Our Garbage Go?',['When the garbage truck rolls away, most of us stop thinking about our trash. But the journey is only beginning. In many cities, waste is carried to a landfill, a large area where garbage is buried under layers of soil. A well-managed landfill is lined at the bottom to prevent harmful liquids from seeping into the ground.','However, landfills fill up, and finding new land is difficult. Some garbage never reaches them. Plastic that is carelessly thrown away can clog canals, wash into rivers, and eventually reach the sea, where it harms marine animals. In contrast, food scraps and dried leaves can be composted, turning into natural fertilizer for gardens.','Experts suggest a simple order of actions known as the three Rs: reduce what you use, reuse what you can, and recycle the rest. Even small choices, like bringing a reusable bag or sorting trash at home, lower the amount of waste that ends up in landfills and waterways.'],[['landfill','a place where garbage is buried'],['seeping','flowing slowly through small openings'],['composted','turned into natural plant food'],['reduce','make less']],[['What is a landfill?',['A river','A place where garbage is buried under soil','A recycling machine','A garden'],1,'Garbage is buried in layers of soil.'],['What can food scraps become?',['Plastic','Metal','Natural fertilizer','Glass'],2,'They can be composted.'],['To “reduce” means to…',['Make less','Make more','Break','Hide'],0,'Reduce means to use less.'],['What is the main idea?',['Trucks are loud','Gardens are useful','Plastic is light','Waste has a journey, and our choices can reduce its harm'],3,'The passage follows waste and offers solutions.'],['Why is the bottom of a landfill lined?',['To make it pretty','To stop harmful liquids from seeping into the ground','To make it deeper','To attract birds'],1,'It protects the soil and water.'],['What might happen if everyone threw plastic carelessly?',['Streets would be cleaner','Rivers would shrink','Canals could clog and the sea could be polluted','Nothing would change'],2,'Plastic travels through canals to the sea.'],['Why does the author mention small choices like a reusable bag?',['To show that individuals can make a difference','To advertise bags','To confuse readers','To end the story'],0,'Small actions add up.'],['Which daily action follows the three Rs?',['Buying more single-use cups','Burning trash','Using a refillable water bottle','Ignoring sorting'],2,'It reduces waste.']],'Track how much trash your family throws away in one day and suggest two ways to reduce it.'),
RE('enr-en-9','en','Grade 6','The Sound of the Kulintang',['At weddings, festivals, and welcome ceremonies among the Maguindanao and Maranao peoples of Mindanao, a bright, rippling sound rises into the air. It comes from the kulintang, a row of eight small gongs laid horizontally on a wooden frame.','The player sits on the floor and strikes the gongs with two wooden mallets. The main melody travels across the smaller gongs, while larger gongs and drums keep a steady beat underneath. Because there is no written music, young players learn by watching and listening to elders for many years.','The kulintang is more than entertainment. Its music marks important moments, welcomes guests, and keeps stories alive. Today, some musicians mix it with modern instruments, hoping to introduce the sound to new listeners without losing its roots. Some schools now include kulintang lessons so children can inherit this living tradition.'],[['gongs','round metal instruments that ring when struck'],['mallets','light hammers used to strike instruments'],['melody','a series of musical notes that form a tune'],['elders','older, respected members of a community']],[['How many gongs are in the kulintang described?',['Three','Eight','Twelve','Twenty'],1,'It has eight small gongs.'],['What do players use to strike the gongs?',['Fingers','Metal sticks','Bows','Wooden mallets'],3,'They use two wooden mallets.'],['A “melody” is…',['A drum','A frame','A series of musical notes that form a tune','A festival'],2,'The main melody travels across the gongs.'],['What is the main idea?',['The kulintang is a living tradition that carries culture and stories','Gongs are metal','Mindanao is far','Weddings are fun'],0,'The passage shows its cultural importance.'],['Why do young players learn by watching and listening?',['They dislike books','There is no written music','The gongs are quiet','Elders are busy'],1,'Music is passed down by example.'],['What does it suggest that some schools teach kulintang?',['It is easy','It is cheap','People want to pass the tradition to the next generation','It is trendy'],2,'Teaching keeps it alive.'],['Why might musicians mix kulintang with modern instruments?',['To hide it','To replace it','To make it quieter','To reach new listeners while keeping its roots'],3,'It introduces the sound to new audiences.'],['How can you show respect when you hear music from another culture?',['Laugh','Listen with attention and ask to learn','Walk away','Copy it mockingly'],1,'Respect begins with listening.']],'Tap out a steady beat and a melody on objects at home, then describe your music.'),
RE('enr-en-10','en','Grade 6','The Tireless Heart',['Make a fist: your heart is about that size. Yet this small muscle works harder than any other in your body. In an adult, it beats roughly one hundred thousand times a day, pumping blood through a network of tubes called blood vessels.','Blood carries oxygen from the lungs to every part of the body and brings back waste gas to be breathed out. The heart has four chambers, and small valves inside work like doors that open one way, keeping blood moving in the right direction. When you run or play, your muscles need more oxygen, so your heart beats faster to deliver it.','To keep your heart strong, doctors recommend regular exercise, enough sleep, and a diet rich in fruits and vegetables. Avoiding cigarettes and too much salty or oily food also lowers the risk of heart problems later in life. A healthy heart is built through everyday habits.'],[['vessels','tubes that carry blood'],['chambers','rooms or spaces inside the heart'],['valves','small flaps that control the flow of blood'],['recommend','suggest as a good idea']],[['About how big is your heart?',['A football','A coin','About the size of your fist','A watermelon'],2,'It is about the size of a fist.'],['How many chambers does the heart have?',['Four','Two','Six','Eight'],0,'It has four chambers.'],['“Valves” work like…',['Windows','Walls','Doors that open one way','Ropes'],2,'They keep blood moving one way.'],['What is the main idea?',['Hearts beat','Doctors are busy','Blood is red','The heart is a hardworking organ that we protect with healthy habits'],3,'The passage explains how the heart works and how to care for it.'],['Why does your heart beat faster when you run?',['It is tired','Your muscles need more oxygen','It is cold','It is bored'],1,'It delivers more oxygen.'],['What can you infer about someone who exercises regularly?',['Their heart is likely healthier','They cannot sleep','They are always hungry','They never get sick'],0,'Exercise lowers the risk of heart problems.'],['Why do small valves matter?',['They make sound','They store food','They keep blood flowing the right way','They cool the heart'],2,'They prevent backward flow.'],['Which daily habit helps your heart most?',['Skipping sleep','Eating only chips','Sitting all day','Playing outdoors and eating vegetables'],3,'Exercise and good food strengthen the heart.']],'Make a weekly plan of healthy habits for your heart.'),
{id:"adv-en-1",category:"adv",lang:"en",level:"Grade 6",title:"Phones in the Classroom: Helper or Distraction?",
paragraphs:["Last month, the school board of a small town discussed a new rule: students must leave their phones in a locked box during class. The idea quickly split the community.","Ms. Reyes, a Grade 6 teacher, supports the rule. After a similar trial in her room, fewer students looked down during lessons, and quiz scores rose from an average of 72 to 78. “A buzzing notification can break a child’s focus for several minutes,” she said.","Mr. Dela Cruz, a parent, disagrees. His daughter uses her phone to check her homework app and to call him when her jeepney is late. “A phone is also a safety tool,” he argued. He suggested allowing phones in bags, set to silent, with teachers choosing when to use them for research.","The board has not yet decided. Meanwhile, a student survey found that most children admit to checking their phones during lessons, but also say they would feel nervous without them."],
vocab:[{word:"split",meaning:"divided into groups with opposite opinions"},{word:"trial",meaning:"a test period to see if something works"},{word:"notification",meaning:"a message alert on a device"},{word:"average",meaning:"the typical number found by adding and dividing"},{word:"argued",meaning:"gave reasons to support a view"}],
questions:[Q("lit","What did the school board discuss?",["Longer recess","Leaving phones in a locked box during class","Banning homework","Buying new phones"],1,"They discussed a locked box for phones."),Q("lit","How did the quiz average change in Ms. Reyes’s trial?",["From 72 to 78","From 78 to 72","From 60 to 90","It did not change"],0,"It rose from 72 to 78."),Q("voc","In the first paragraph, “split” most nearly means…",["Broke into pieces","Divided opinions","Shared equally","Ended"],1,"The community had opposite opinions."),Q("main","Which is the best main idea?",["Phones should be banned everywhere","A town is debating how to balance focus and safety with phones in class","Teachers dislike technology","Students never use phones wisely"],1,"The text compares both sides of a debate."),Q("cause","Why does Ms. Reyes support the rule?",["Phones are expensive","Notifications break focus and scores improved in her trial","She dislikes parents","Students asked for it"],1,"She links fewer distractions to higher scores."),Q("inf","Why might Mr. Dela Cruz worry about a locked box?",["He wants his daughter to play games","He may not be able to reach his daughter when needed","He dislikes teachers","He sells phones"],1,"He values the phone as a safety tool."),Q("inf","What can you infer from the survey?",["Students feel both distracted and dependent on phones","Students hate phones","Students want more homework","Parents agree with the rule"],0,"They admit checking phones yet feel nervous without them."),Q("inf","What does the ending, “The board has not yet decided,” suggest?",["The issue is still open and both sides matter","Ms. Reyes lost","The rule is in place","The author is angry"],0,"No final choice has been made."),Q("purp","What is the author’s purpose?",["To persuade readers to ban phones","To present both sides so readers can think for themselves","To tell a funny story","To advertise a phone"],1,"The author stays balanced."),Q("evid","Which detail is the strongest evidence for Ms. Reyes’s view?",["She teaches Grade 6","Quiz scores rose after the trial","Phones buzz","The box is locked"],1,"It is a measurable result."),Q("comp","How do the two views differ?",["She focuses on learning, he focuses on safety and flexibility","She likes phones, he does not","He is a teacher, she is a parent","They agree completely"],0,"Each stresses a different priority."),Q("opin","Which is the best reason to allow phones in bags on silent?",["Phones are fun","Students could reach family when needed while teachers control phone use","Phones never distract","Lockers are expensive"],1,"It addresses both safety and focus.")],
task:"Write 3 sentences: what rule would YOU suggest for phones in class, and why?"},
RA('adv-fil-1','fil','Grade 6','Palayan o Subdibisyon?',['Sa isang bayan sa Bulacan, umabot sa konseho ang usapin tungkol sa pitong ektaryang palayan na planong gawing subdibisyon. Ayon sa kompanya ng real estate, makapagbibigay ito ng tatlong daang bahay at trabaho para sa mga manggagawa at tindero sa paligid. “Dumarami ang tao at kailangan nila ng matitirhan,” wika ng kinatawan nito.','Tutol dito si Mang Estong, isang magsasaka na pangatlong henerasyon na sa lupa. Ayon sa kanya, bumababa ang suplay ng bigas kapag nawawala ang mga palayan, at kapag nagtayo ng mga bahay, mas madalas ang baha dahil wala nang lupang sumisipsip ng tubig. Dagdag pa niya, hindi pangmatagalan ang mga trabahong ipinangako; matatapos ang konstruksyon, ngunit ang palay ay nagbibigay ng pagkain taon-taon.','Nagmungkahi ang isang konsehal ng gitnang landas: panatilihin ang mga palayang may patubig, at ilaan ang mga hindi gaanong matabang lupa para sa pabahay. Hiniling din niyang magsagawa muna ng pag-aaral sa epekto ng proyekto sa kapaligiran bago magdesisyon.','Wala pang pinal na desisyon ang konseho. Samantala, nakatakdang magkaroon ng pagdinig kung saan maaaring magsalita ang mga residente. Para sa maraming mamamayan, ang tanong ay hindi lamang kung saan titira ang tao, kundi kung ano ang mawawala kapalit nito.'],[['subdibisyon','lupaing hinati at pinaunlad para sa mga bahay'],['Tutol','hindi sang-ayon'],['suplay','dami ng makukuhang bagay'],['pangmatagalan','tumatagal nang mahabang panahon'],['pagdinig','pagpupulong kung saan pinakikinggan ang mga tao']],[['Ilang ektaryang palayan ang planong gawing subdibisyon?',['Pito','Tatlo','Sampu','Limampu'],'Pitong ektarya ang nabanggit.'],['Ilang bahay ang ipinangako ng kompanya?',['Tatlong daan','Isang daan','Isang libo','Limampu'],'Tatlong daang bahay.'],['Ano ang ibig sabihin ng “tutol”?',['Hindi sang-ayon','Sang-ayon','Gutom','Pagod'],'Hindi sumasang-ayon si Mang Estong.'],['Ano ang pangunahing kaisipan?',['Kailangang timbangin ang pabahay at ang pagkain at kapaligiran bago magpasya sa lupang sakahan','Mahal ang bahay','Marami ang magsasaka','Maganda ang Bulacan'],'Ipinakita ang magkabilang panig ng usapin.'],['Bakit sinabi ni Mang Estong na mas madalas ang baha kapag nagtayo ng bahay?',['Wala nang lupang sumisipsip ng tubig','Mas malakas ang ulan','Maraming ilog','Walang kanal'],'Pinalitan ng bahay ang lupang sumisipsip ng tubig.'],['Ano ang ipinahihiwatig ng kompanya sa pagsasabing dumarami ang tao?',['Kailangan ng mas maraming matitirhan','Walang gusto ng bahay','Mahal ang lupa','Ayaw ng trabaho ng mga tao'],'Ito ang dahilan ng kanilang proyekto.'],['Bakit binigyang-diin ni Mang Estong na ang palay ay nagbibigay ng pagkain taon-taon?',['Ipakitang mas pangmatagalan ang pakinabang ng palayan kaysa sa konstruksyon','Magbenta ng palay','Pagalitin ang kompanya','Matulog nang maaga'],'Inihambing niya ang tagal ng pakinabang.'],['Ano ang layunin ng mungkahing pag-aaral sa kapaligiran ng konsehal?',['Matiyak na hindi makasasama ang proyekto bago magdesisyon','Pigilan lahat ng proyekto','Bilisan ang konstruksyon','Magpatayo ng palengke'],'Nais niyang may batayan ang desisyon.'],['Ano ang layunin ng may-akda?',['Ilahad ang magkabilang panig upang makapag-isip ang mambabasa','Hikayatin ang lahat na tutulan ang pabahay','Magbenta ng bahay','Libangin lamang ang mambabasa'],'Walang kinampihan ang teksto.'],['Alin ang pinakamatibay na ebidensiya laban sa proyekto ayon kay Mang Estong?',['Bababa ang suplay ng bigas at mas madalas ang baha','Maganda ang palayan','Matanda na siya','Mahal ang bigas'],'Konkretong epekto ang binanggit niya.'],['Paano naiiba ang pananaw ng kompanya at ni Mang Estong?',['Pabahay at trabaho ang tinitingnan ng kompanya; pagkain at kapaligiran ang kay Mang Estong','Pareho ang gusto nila','Magsasaka ang kompanya','Konsehal si Mang Estong'],'Magkaiba ang kanilang prayoridad.'],['Alin ang pinakamahusay na dahilan para sa gitnang landas ng konsehal?',['Napapangalagaan ang palayan habang natutugunan ang pangangailangan sa bahay','Mas mura ang semento','Walang kailangang magbago','Para matapos agad ang usapan'],'Sinisikap nitong pagbigyan ang magkabilang panig.']],'Isulat ang sarili mong pasya at dalawang dahilan. Tumugon din sa isang katwiran ng kabilang panig.'),
RA('adv-fil-2','fil','Grade 6','Katotohanan o Opinyon?',['Sa panahon ng social media, napakabilis kumalat ng impormasyon. Sa loob ng ilang minuto, maaaring umabot sa libo-libong tao ang isang post. Ngunit hindi lahat ng ibinabahagi ay totoo. Kaya mahalagang matutong sumuri bago maniwala o mag-share.','Ang katotohanan ay pahayag na mapapatunayan sa pamamagitan ng ebidensiya, tulad ng “Umulan sa Maynila kahapon, ayon sa ulat ng PAGASA.” Ang opinyon naman ay paniniwala o damdamin ng isang tao, tulad ng “Ang tag-ulan ang pinakamagandang panahon.” Maaaring magkaiba ang opinyon ng dalawang tao, ngunit ang katotohanan ay maaaring suriin.','Mayroon ding mga pahayag na nagpapanggap na katotohanan. Halimbawa, “Lahat ng kabataan ay nalululong sa cellphone.” Walang binanggit na bilang o pinagmulan, at ang salitang “lahat” ay masyadong malawak. Dapat nating itanong: Sino ang nagsabi? Saan niya ito nakuha? May iba pa bang mapagkakatiwalaang sanggunian?','Mainam ding tingnan ang layunin ng nagsulat. Ang ilan ay nais lamang magbigay ng impormasyon, ngunit may mga nagnanais ding manghikayat, magpaniwala, o kumita sa dami ng pindot sa kanilang post. Kapag natutuhan nating sumuri, hindi tayo basta nalilinlang, at nakatutulong pa tayong pigilan ang pagkalat ng maling balita.'],[['sumuri','tingnan nang mabuti kung totoo o hindi'],['ebidensiya','patunay'],['nagpapanggap','nagkukunwari'],['sanggunian','pinagkukunan ng impormasyon'],['nalilinlang','napapaniwala sa mali']],[['Ano ang katotohanan ayon sa teksto?',['Pahayag na mapapatunayan sa pamamagitan ng ebidensiya','Damdamin ng isang tao','Pangarap','Alamat'],'Mapapatunayan ang katotohanan.'],['Alin ang halimbawa ng opinyon sa teksto?',['Ang tag-ulan ang pinakamagandang panahon','Umulan sa Maynila kahapon','Ayon sa ulat ng PAGASA','May bagyo ngayon'],'Paniniwala lamang ito ng isang tao.'],['Ano ang ibig sabihin ng “nagpapanggap”?',['Nagkukunwari','Tunay','Natutulog','Nagtatago ng pera'],'Kunwari lang na totoo ang pahayag.'],['Ano ang pangunahing kaisipan?',['Mahalagang sumuri bago maniwala at mag-share','Mabilis ang internet','Maraming opinyon sa mundo','Masama ang social media'],'Ito ang paulit-ulit na paalala ng teksto.'],['Bakit hindi dapat agad paniwalaan ang “Lahat ng kabataan ay nalululong sa cellphone”?',['Walang bilang o pinagmulan at masyadong malawak ang “lahat”','Maikli ito','Nakakatawa ito','Luma na ito'],'Hindi ito napatutunayan.'],['Ano ang ipinahihiwatig ng pagbanggit sa PAGASA?',['Mapagkakatiwalaang sanggunian ito tungkol sa panahon','Mahilig sa ulan ang PAGASA','Walang tiwala sa kanila','Pamahalaan lang ang sumusulat'],'Opisyal na ahensiya ito.'],['Bakit maaaring magkaiba ang opinyon ng dalawang tao ngunit hindi ang katotohanan?',['Nakabatay ang opinyon sa damdamin; ang katotohanan sa ebidensiya','Parehong nagbabago','Parehong sinungaling ang tao','Walang pagkakaiba'],'Magkaiba ang batayan ng dalawa.'],['Ano ang maaaring mangyari kapag maraming nag-share ng maling balita?',['Maaaring maniwala ang maraming tao sa mali','Magiging totoo ito','Mawawala ito','Magiging opinyon ito'],'Mabilis kumalat ang mali.'],['Ano ang layunin ng may-akda?',['Turuan ang mambabasa na sumuri ng impormasyon','Magbenta ng cellphone','Magpatawa','Magsalaysay ng kuwento'],'Nagbibigay ito ng gabay sa pagsusuri.'],['Alin ang pinakamahusay na paraan para patunayan ang isang balita?',['Maghanap ng ibang mapagkakatiwalaang sanggunian','Basahin ang bilang ng like','Magtiwala sa unang nakita','Tanungin kung sino ang sikat'],'Hinahanap ang ebidensiya mula sa iba.'],['Paano naiiba ang katotohanan sa opinyon?',['Masusuri ang katotohanan; ang opinyon ay paniniwala','Pareho lang sila','Laging mali ang opinyon','Laging mahaba ang katotohanan'],'Ito ang pangunahing pagkakaiba.'],['Alin ang pinakamahusay na dahilan para huminto muna bago mag-share?',['Para hindi makatulong sa pagkalat ng maling balita','Para magmukhang abala','Para magtago','Para magalit'],'Responsibilidad ng bawat gumagamit.']],'Pumili ng isang pahayag na nabasa mo kamakailan at sabihin kung katotohanan o opinyon ito, at bakit.'),
RA('adv-fil-3','fil','Grade 6','Mabuti Ba ang Takdang-Aralin?',['Maraming mag-aaral ang uuwi na may bitbit na takdang-aralin tuwing hapon. Para sa ilan, nakatutulong ito upang maulit ang aralin at masanay sa pananagutan. Para naman sa iba, nauubos ang oras nila para sa laro, pamilya, at pahinga. Kaya patuloy ang debate: mabuti ba o masama ang takdang-aralin?','Ayon kay Gng. Salazar, guro sa ikaanim na baitang, nakatulong ang maikling gawain araw-araw upang tumaas ang average ng klase mula 76 patungong 82 sa loob ng isang markahan. Aniya, mahalaga ang pagsasanay, ngunit dapat maikli at may malinaw na layunin.','Samantala, nag-aalala si Ginoong Ramos, isang ama, dahil madalas umaabot ng alas-nuwebe ng gabi bago matapos ang gawain ng anak niyang si Paolo. Napansin niyang inaantok na ito sa klase at ayaw nang magbasa. “Hindi dapat maging parusa ang pag-aaral,” wika niya. Iminungkahi niyang bawasan ang dami at palitan ng mga proyektong mas masaya, tulad ng pagsasaliksik o pag-eeksperimento sa bahay.','May ilang pag-aaral na nagpapakitang mas epektibo ang takdang-aralin kapag hindi lalampas sa isang oras at may sapat na pahinga ang bata. Hindi pa rin nagkakaisa ang paaralan, ngunit nagkasundo ang guro at ang magulang sa isang bagay: ang layunin ay matuto, hindi lamang matapos.'],[['pananagutan','responsibilidad'],['markahan','bahagi ng taong pampaaralan'],['parusa','hirap na ipinataw dahil sa pagkakamali'],['pagsasaliksik','paghahanap ng impormasyon'],['epektibo','nagbubunga ng magandang resulta']],[['Gaano ang itinaas ng average ng klase ni Gng. Salazar?',['Mula 76 patungong 82','Mula 82 patungong 76','Mula 60 patungong 70','Walang pagbabago'],'Mula 76 patungong 82.'],['Anong oras karaniwang natatapos ang gawain ni Paolo?',['Alas-nuwebe ng gabi','Alas-singko ng hapon','Alas-tres ng hapon','Hatinggabi'],'Umaabot ng alas-nuwebe ng gabi.'],['Ano ang ibig sabihin ng “epektibo”?',['Nagbubunga ng magandang resulta','Mahirap','Mura','Mabagal'],'Nagbubunga ng mabuting epekto.'],['Ano ang pangunahing kaisipan?',['May magkaibang pananaw sa takdang-aralin; mahalaga ang tamang dami at layunin','Masama ang takdang-aralin','Mahal ang aklat','Marami ang guro'],'Ipinakita ang dalawang panig at ang pinagkasunduan.'],['Bakit nag-aalala si Ginoong Ramos?',['Napapagod at ayaw nang magbasa ang anak niya dahil sa dami ng gawain','Mahal ang papel','Maliit ang bahay','Wala siyang oras'],'Apektado ang pahinga at gana ni Paolo.'],['Ano ang ipinahihiwatig ng “Hindi dapat maging parusa ang pag-aaral”?',['Dapat masaya at makabuluhan ang pagkatuto','Dapat bawal ang pag-aaral','Dapat walang guro','Dapat laging mahirap'],'Gusto niyang makabuluhan ang pagkatuto.'],['Bakit kaya iminungkahi ni Ginoong Ramos ang pagsasaliksik at eksperimento?',['Mas kawili-wili ito at nakatutulong sa pagkatuto','Mas mura','Mas madali','Mas mabilis tapusin'],'Gusto niya ng mas makabuluhang gawain.'],['Ano ang ibig sabihin ng pagkakasundo ng guro at magulang sa isang bagay?',['Pareho nilang layunin ang tunay na pagkatuto ng bata','Pareho silang galit','Pareho silang tutol','Pareho silang abala'],'Pareho nilang pinahahalagahan ang pagkatuto.'],['Ano ang layunin ng may-akda?',['Ipakita ang magkabilang panig upang makapagpasya ang mambabasa','Ipagbawal ang takdang-aralin','Purihin ang guro','Pagalitan ang magulang'],'Patas ang paglalahad.'],['Alin ang pinakamatibay na ebidensiya para sa kapakinabangan ng takdang-aralin?',['Tumaas ang average ng klase mula 76 patungong 82','Mahaba ang gawain','Maganda ang papel','Marami ang estudyante'],'May tiyak na bilang na nagpapakita ng pag-angat.'],['Ano ang magkaibang pokus nina Gng. Salazar at Ginoong Ramos?',['Pagsasanay at marka laban sa pahinga at sigla ng bata','Pera laban sa oras','Laro laban sa pagtulog','Aklat laban sa gamit'],'Magkaiba ang kanilang prayoridad.'],['Alin ang pinakamahusay na solusyon?',['Maikli, may layunin, at may sapat na pahinga','Dagdagan ang gawain','Alisin ang paaralan','Ipasa sa iba ang gawain'],'Pinagsasama nito ang mabuting punto ng dalawa.']],'Ano ang magiging patakaran mo sa takdang-aralin? Isulat ito at ipaliwanag.'),
RA('adv-en-2','en','Grade 6','Should Zoos Exist?',['Every weekend, thousands of families visit zoos to see lions, elephants, and monkeys up close. For many children, it is the first time they meet a wild animal. Yet the question of whether zoos should exist has divided scientists, teachers, and animal lovers for years.','Supporters argue that modern zoos protect species that are disappearing in the wild. Through breeding programs, some animals once close to extinction have been returned to forests. Zoos also fund research, treat injured wildlife, and teach visitors why conservation matters. Dr. Villanueva, a wildlife veterinarian, says, “Many people only care about animals they have seen with their own eyes.”','Critics respond that wild animals often suffer in captivity. Elephants, for example, naturally walk many kilometers a day, but zoo enclosures may allow only a few hundred meters. Some animals show signs of stress, such as pacing in circles. Activist Marco Lim argues that money used to build exhibits could protect more habitat in the wild. “You cannot save a forest by locking up its animals,” he says.','Some experts suggest a compromise: zoos should focus on rescuing and breeding endangered species, build larger and more natural habitats, and stop keeping animals that cannot thrive in captivity. Whether or not zoos exist in the future, most agree on one point: the welfare of the animals must come first.'],[['extinction','the complete disappearance of a kind of living thing'],['conservation','protecting nature and wildlife'],['captivity','being kept in a place and not free'],['enclosures','fenced areas where animals are kept'],['compromise','an agreement where each side gives up something'],['welfare','health, safety, and well-being']],[['What have breeding programs done for some animals?',['Returned animals once close to extinction to forests','Made them bigger','Sold them to cities','Moved them to farms'],'Some species were returned to the wild.'],['What does Marco Lim say money for exhibits could do instead?',['Protect more habitat in the wild','Buy more food','Hire more guards','Build bigger shops'],'He wants to protect forests.'],['“Captivity” means…',['Being kept in a place and not free','Living freely','Traveling far','Being very happy'],'Animals in captivity cannot roam freely.'],['What is the best main idea?',['People disagree about zoos, and a balance that puts animal welfare first may be possible','Zoos are always good','Zoos are always bad','Elephants walk far'],'The passage presents both sides and a compromise.'],['According to critics, why might zoo animals show stress?',['Their enclosures are much smaller than the space they naturally use','They are fed too much','They sleep too long','They hear music'],'Elephants walk far but zoos give little room.'],['Why does Dr. Villanueva say people care about animals they have seen?',['Seeing animals can create a personal connection that inspires protection','People love zoos','Animals are famous','Tickets are cheap'],'Experience builds care.'],['What can you infer from the example of pacing in circles?',['The animal may be unhappy or stressed','The animal is exercising happily','It is playing','It is sleeping'],'The text calls it a sign of stress.'],['Why might experts suggest zoos stop keeping animals that cannot thrive in captivity?',['Some species suffer in zoos and cannot live well there','Those animals are boring','They are expensive','They are loud'],'Animal welfare comes first.'],['What is the author’s purpose?',['To present both sides so readers can weigh them','To close all zoos','To advertise zoos','To tell animal jokes'],'The author stays balanced.'],['Which detail best supports the claim that zoos help conservation?',['Some endangered animals were returned to forests','Zoos have many visitors','Zoos sell food','Zoos have lions'],'It shows a real conservation result.'],['How do supporters and critics differ?',['Supporters stress education and species rescue; critics stress animal suffering and wasted money','They agree','Supporters are children','Critics are zookeepers'],'They emphasize different priorities.'],['Which is the strongest reason for the compromise?',['It tries to protect species while reducing animal suffering','It is cheaper','It is popular','It is easy'],'It balances both concerns.']],'Write a short paragraph stating your view on zoos and one reason that answers the other side.'),
RA('adv-en-3','en','Grade 6','The True Cost of Fast Fashion',['Walk into a mall and you will see racks of T-shirts priced lower than a meal. This style of cheap, fast-changing clothing is called fast fashion. Brands release new designs almost every week, encouraging shoppers to buy more and wear items only a few times before throwing them away.','But low prices hide other costs. Producing clothes uses huge amounts of water and energy. A single cotton T-shirt can require thousands of liters of water to make. Many garments are made from polyester, a plastic-based fabric that sheds tiny fibers when washed, and these fibers end up in rivers and seas. Meanwhile, discarded clothes pile up in landfills, where they may take years to break down.','There is also a human cost. To keep prices low, some factories pay workers very little and ask them to work long hours in unsafe conditions. Consumers rarely see these stories because they are not printed on the price tag.','Fortunately, alternatives exist. In the Philippines, many people buy ukay-ukay, secondhand clothes sold in bazaars, which extends the life of garments and costs less. Others repair, swap, or donate clothes. Experts suggest a simple rule: before buying, ask whether you will wear the item at least thirty times. Small choices by many shoppers can encourage companies to make clothes more fairly and sustainably.'],[['garments','pieces of clothing'],['polyester','a plastic-based fabric'],['discarded','thrown away'],['consumers','people who buy and use products'],['secondhand','already used by someone else'],['sustainably','in a way that does not use up or harm resources']],[['What is fast fashion?',['Cheap clothing with designs that change very quickly','Expensive clothes','Clothes for sports','Clothes made slowly by hand'],'Brands release new designs almost weekly.'],['What is ukay-ukay?',['Secondhand clothes sold in bazaars','New designer clothes','Cloth bags','Sewing machines'],'The passage defines it as secondhand clothes.'],['“Discarded” clothes are…',['Thrown away','Washed','Sold','Repaired'],'Discarded means thrown away.'],['What is the main idea?',['Fast fashion has hidden costs, but people can make better choices','Clothes are cheap','Cotton needs water','Malls are big'],'The passage shows costs and alternatives.'],['Why do fibers from polyester clothes end up in rivers and seas?',['They shed when the clothes are washed','Workers throw them','Fish eat them','They float up from landfills'],'Washing releases tiny fibers.'],['Why does the author say the human cost is “not printed on the price tag”?',['Shoppers cannot see how workers were treated from the price','Tags are small','Workers write the tags','Prices are secret'],'Price tags hide working conditions.'],['What can you infer about a shopper who buys a shirt and wears it only twice?',['They add to more waste','They are saving money','They help the planet','They are a designer'],'Rarely worn clothes become waste.'],['Why might the thirty-wears rule help?',['It makes shoppers think before buying things they will rarely use','It makes clothes cheaper','It makes stores closer','It makes clothes bigger'],'It encourages careful buying.'],['What is the author’s purpose?',['To inform readers and encourage thoughtful shopping','To sell clothes','To tell a story','To mock shoppers'],'The passage informs and gives advice.'],['Which detail best supports the claim that fast fashion harms the environment?',['A cotton T-shirt can need thousands of liters of water','Brands release designs weekly','Clothes are cheap','People love sales'],'It gives a measurable environmental cost.'],['How is buying ukay-ukay different from buying fast fashion?',['It extends the life of clothes instead of adding new production','It is always more expensive','It uses more water','It creates more waste'],'Reusing reduces demand for new clothes.'],['Which is the strongest reason to repair or swap clothes?',['It reduces waste and saves money','It is a trend','It is faster','It impresses friends'],'It addresses both the environment and cost.']],'List three ways you can make your clothes last longer.'),
RA('adv-fil-4','fil','Grade 6','Ang Saradong Panahon sa Pangingisda',['Sa bayan ng San Rafael, tatlong buwan bawat taon ay ipinagbabawal ang panghuhuli ng galunggong sa karagatan nito. Tinatawag itong saradong panahon. Layunin nitong bigyan ng pagkakataong mangitlog at lumaki ang mga isda upang hindi maubos ang mga ito. Ngunit mainit ang usapan sa baybayin.','Sang-ayon si Gng. Perla, biyologo ng lokal na pamahalaan. Ayon sa kanya, bumaba ang dami ng nahuhuling isda sa nakalipas na sampung taon, at mas maliit na ang karaniwang nahuhuli. “Kapag hinuli natin ang mga isda bago sila lumaki, wala nang matitira para sa kinabukasan,” paliwanag niya. Pagkatapos ng dalawang taon ng pagpapatupad, tumaas ang bilang ng nahuhuli kapag bukas na ang pangingisda.','Tutol naman si Mang Ruben, mangingisdang apat na henerasyon na sa dagat. Wala siyang ibang hanapbuhay, at sa loob ng tatlong buwang iyon, napipilitan siyang umutang para may pambili ng bigas. “Maganda ang layunin, pero sino ang magpapakain sa pamilya ko habang bawal pumalaot?” tanong niya. Iminungkahi niyang bigyan ng ayuda o pansamantalang trabaho ang mga mangingisda habang umiiral ang pagbabawal.','Nagpasya ang pamahalaang bayan na ipagpatuloy ang saradong panahon ngunit magbigay ng ayudang bigas at pagsasanay sa alternatibong kabuhayan, tulad ng pagpoproseso ng isda at paggawa ng bangka. Para sa marami, ang tunay na tanong ay kung paano pagsasabayin ang pangangalaga at kabuhayan. Nagtapos ang pulong na may dalawang aral: kailangan ng kalikasan ang pahinga, at kailangan din ng tao ang tulong habang naghihintay ng bunga.'],[['biyologo','siyentipikong nag-aaral ng mga buhay na bagay'],['mangitlog','maglabas ng itlog'],['pumalaot','pumunta sa laot o malalim na bahagi ng dagat'],['ayuda','tulong'],['kabuhayan','paraan ng pagkakakitaan']],[['Gaano katagal ang saradong panahon sa San Rafael?',['Tatlong buwan','Isang linggo','Isang taon','Dalawang araw'],'Tatlong buwan bawat taon.'],['Anong isda ang ipinagbabawal hulihin sa saradong panahon?',['Galunggong','Tilapia','Bangus','Tuna'],'Galunggong ang nabanggit.'],['Ano ang ibig sabihin ng “pumalaot”?',['Pumunta sa laot o malalim na bahagi ng dagat','Umuwi','Matulog','Magbenta'],'Pumalaot ang mangingisda para manghuli.'],['Ano ang pangunahing kaisipan?',['Kailangang pagbalansehin ang pangangalaga sa dagat at ang kabuhayan ng mga mangingisda','Masama ang pangingisda','Mahal ang bigas','Marami ang isda'],'Ipinakita ang pangangailangan ng kalikasan at ng tao.'],['Bakit ipinatutupad ang saradong panahon?',['Para makapangitlog at lumaki ang isda upang hindi maubos','Para magpahinga ang bangka','Para mag-ipon ng pera','Para sa mga turista'],'Layunin nitong hindi maubos ang isda.'],['Ano ang ipinahihiwatig ng pagliit ng karaniwang nahuhuling isda?',['Hinuhuli ang isda bago pa sila lumaki','Lumalaki ang dagat','Dumarami ang mangingisda','Lumalamig ang tubig'],'Maliliit pa ang nahuhuli kaya may problema sa dami.'],['Bakit nagtatanong si Mang Ruben kung sino ang magpapakain sa pamilya niya?',['Nawawalan siya ng kita habang bawal mangisda at wala siyang ibang hanapbuhay','Ayaw niyang kumain','Mayaman siya','Ayaw niya ng isda'],'Apektado ang kita niya.'],['Ano ang ipinahihiwatig ng desisyong magbigay ng ayuda at pagsasanay?',['Kinikilala nilang may epekto sa tao ang patakaran at gusto itong tugunan','Gusto nilang ihinto ang patakaran','Wala silang pakialam','Gusto nilang magpabili ng bigas'],'Binabalanse nila ang pangangailangan ng dagat at tao.'],['Ano ang layunin ng may-akda?',['Ilahad ang magkabilang panig at ang naging kompromiso','Ipagbawal ang pangingisda','Magbenta ng isda','Magpatawa'],'Patas ang paglalahad.'],['Alin ang pinakamahusay na ebidensiya na nakatutulong ang saradong panahon?',['Tumaas ang bilang ng nahuhuli pagkatapos ng dalawang taon','Mahaba ang panahon','Maraming bangka','Mahal ang isda'],'May nasukat na pag-angat.'],['Paano naiiba ang pananaw ni Gng. Perla at ni Mang Ruben?',['Kinabukasan ng isda ang pokus ng una; agarang pangangailangan ng pamilya ang pokus ng ikalawa','Pareho ang pananaw nila','Mangingisda ang una','Biyologo ang ikalawa'],'Magkaiba ang kanilang prayoridad.'],['Alin ang pinakamahusay na dahilan para sa pinagpasyahang solusyon?',['Pinoprotektahan nito ang dagat habang natutulungan ang pamilya ng mangingisda','Mas mura ito','Madali ito','Walang kailangang gawin'],'Pinagsasama nito ang pangangalaga at pagtulong.']],'Magmungkahi ng isa pang paraan para matulungan ang mangingisda habang sarado ang panahon.'),
RA('adv-fil-5','fil','Grade 6','Matalinong Makina sa Silid-Aralan',['Sa maraming paaralan ngayon, ginagamit ng mga mag-aaral ang artipisyal na katalinuhan o AI upang sumagot ng tanong, magbuod ng teksto, at magpaliwanag ng mahihirap na paksa. Para sa ilan, parang isang tagapagturong laging handang tumulong. Para sa iba, isa itong panganib sa tunay na pagkatuto.','Ayon kay Gng. Dizon, guro sa Filipino, nakatutulong ang AI sa mga batang nahihirapan. Nagagamit nila ito upang magpaliwanag ng salita sa mas simpleng paraan o upang maghanap ng ideya bago sumulat. “Kung gagamitin bilang gabay, makatutulong ito,” wika niya. Dagdag niya, kailangang sanayin ang mga bata na suriin ang sagot, dahil maaaring magkamali ang AI.','Nababahala naman si Ginoong Valdez, punong-guro, na baka umasa na lamang ang mga bata at hindi na mag-isip. May mga mag-aaral na ipinasa ang sagot ng AI bilang sariling gawa. Ito ay pandaraya, at nawawalan sila ng pagkakataong hasain ang sariling kakayahan. “Ang utak ay parang kalamnan,” aniya. “Hindi ito lalakas kung ibang tao ang nag-eehersisyo para sa iyo.”','Nagkasundo ang dalawa sa ilang patakaran: maaaring gumamit ng AI para sa paliwanag at mungkahi, ngunit dapat isulat ng bata ang sariling sagot, sabihin kung saan ito tumulong, at suriin ang impormasyon sa ibang sanggunian. Sa ganitong paraan, nagiging katuwang ang teknolohiya at hindi kapalit ng pag-iisip.'],[['magbuod','magbigay ng maikling lagom'],['Nababahala','nag-aalala'],['pandaraya','paggawa ng hindi tapat'],['hasain','paunlarin sa pamamagitan ng pagsasanay'],['katuwang','kasama o katulong']],[['Para saan ginagamit ng mga mag-aaral ang AI ayon sa teksto?',['Sumagot ng tanong, magbuod ng teksto, at magpaliwanag ng paksa','Magluto','Maglaro ng basketball','Magtanim'],'Ito ang mga nabanggit na gamit.'],['Sino ang punong-guro sa teksto?',['Ginoong Valdez','Gng. Dizon','Mang Estong','Gng. Salazar'],'Si Ginoong Valdez ang punong-guro.'],['Ano ang ibig sabihin ng “pandaraya”?',['Paggawa ng hindi tapat','Pagtulong','Pagbabasa','Pagguhit'],'Hindi tapat na pagpasa ng gawa ng iba bilang sarili.'],['Ano ang pangunahing kaisipan?',['Maaaring makatulong ang AI kung gagamitin nang tapat at kasabay ng sariling pag-iisip','Masama ang AI','Walang silbi ang guro','Mahirap ang Filipino'],'Ipinakita ang tulong at panganib nito.'],['Bakit nababahala si Ginoong Valdez?',['Baka umasa na lamang ang mga bata at hindi na mag-isip','Mahal ang AI','Maliit ang paaralan','Wala siyang oras'],'Natatakot siyang hindi na hahasain ng mga bata ang sarili nilang isip.'],['Ano ang ipinahihiwatig ng paghahambing ng utak sa kalamnan?',['Kailangang gamitin at ensayuhin ang utak para lumakas','Malaki ang utak','Masakit ang ehersisyo','Mabigat ang aklat'],'Lumalakas ang isip sa pagsasanay.'],['Bakit kailangang suriin ang sagot ng AI?',['Maaaring magkamali ang AI','Laging tama ito','Mahaba ang sagot nito','Mura ito'],'Binanggit ni Gng. Dizon na maaari itong magkamali.'],['Ano ang ipinahihiwatig ng patakarang sabihin kung saan tumulong ang AI?',['Mahalaga ang katapatan sa paggamit ng tulong','Gusto nilang pagbawalan ang AI','Gusto nilang magbayad ang bata','Walang halaga ang AI'],'Ipinapakita nito ang pagiging tapat.'],['Ano ang layunin ng may-akda?',['Ilahad ang magkabilang panig at magmungkahi ng makatwirang gabay','Ipagbawal ang AI','Ipagbili ang AI','Magpatawa'],'Patas at may mungkahi ang teksto.'],['Alin ang pinakamatibay na ebidensiya ng panganib ng labis na pag-asa sa AI?',['May mga mag-aaral na ipinasa ang sagot ng AI bilang sariling gawa','Mabilis ang AI','Maraming app','Maraming paaralan'],'Tunay na pangyayari ang nabanggit.'],['Paano naiiba ang pananaw ni Gng. Dizon at ni Ginoong Valdez?',['Nakikita ng una ang tulong ng AI; nababahala ang ikalawa sa labis na pag-asa','Pareho ang pananaw nila','Mag-aaral ang una','Magulang ang ikalawa'],'Magkaiba ang kanilang pokus.'],['Alin ang pinakamahusay na dahilan para sa napagkasunduang patakaran?',['Napapakinabangan ang AI nang hindi nawawala ang sariling pag-iisip at katapatan','Mas mabilis matapos ang gawain','Mas mura ito','Walang kailangang pag-aralan'],'Pinagsasama nito ang tulong at pananagutan.']],'Sumulat ng tatlong patakaran sa matalinong paggamit ng AI sa pag-aaral.'),
RA('adv-en-4','en','Grade 6','Is Space Exploration Worth the Cost?',['When a rocket lifts off, it carries more than astronauts and equipment. It also carries a question: is spending billions of dollars on space worth it when problems like hunger, disease, and poor schools remain on Earth? People have debated this for decades.','Supporters point out that space programs have led to practical inventions. Technologies developed for spacecraft improved satellite weather forecasting, GPS navigation, water filters, and medical imaging. Satellites also help Filipino scientists track typhoons and monitor forests, giving communities time to prepare. Dr. Ramos, an astronomer, argues that exploring space inspires young people to study science. “A single launch can create thousands of future engineers,” he says.','Critics reply that the same money could be used for urgent needs. Teacher Mara Cruz notes that building one rocket can cost as much as building hundreds of classrooms. She does not oppose science, but says governments should first make sure every child has a school, a teacher, and a meal. “Reaching Mars is exciting,” she says, “but reaching every student is essential.”','Some economists observe that space budgets are only a small fraction of national spending and often create jobs and new industries. Still, they admit that the benefits are uneven and sometimes slow. Perhaps the wiser question is not whether to explore, but how to balance dreams of the future with the needs of today.'],[['satellites','machines that orbit Earth and send information'],['navigation','finding the way from one place to another'],['inspires','makes someone want to do something good'],['urgent','needing quick action'],['economists','experts who study money and trade'],['uneven','not equal']],[['What do satellites help Filipino scientists do?',['Track typhoons and monitor forests','Grow crops','Build roads','Teach classes'],'The passage says they track typhoons and monitor forests.'],['What does Mara Cruz say building one rocket can cost as much as?',['Hundreds of classrooms','One school bus','A single book','A small house'],'She compares it to hundreds of classrooms.'],['“Urgent” means…',['Needing quick action','Very old','Very small','Very quiet'],'Urgent needs cannot wait.'],['What is the best main idea?',['People disagree about whether space spending is worth it, and balance may be the wiser question','Rockets are expensive','Mars is far','Astronauts are brave'],'The passage ends by asking how to balance.'],['Why do supporters say space programs matter for education?',['They inspire young people to study science','They give free books','They build schools','They end hunger'],'Dr. Ramos says launches inspire future engineers.'],['What can you infer from “reaching every student is essential”?',['Teacher Cruz thinks education for all children must come first','She dislikes science','She wants more rockets','She wants to go to Mars'],'She puts basic needs first.'],['Why might economists say the benefits of space spending are “uneven”?',['Some people and places benefit more than others, and sometimes slowly','Everyone benefits equally','There are no benefits','Rockets are uneven'],'The text says benefits are uneven and sometimes slow.'],['What does the author suggest by saying the wiser question is how to balance?',['Both exploration and urgent needs matter','Space should be ignored','Earth should be ignored','Only money matters'],'Neither side is dismissed.'],['What is the author’s purpose?',['To present both sides and encourage readers to think about balance','To sell rockets','To scare readers','To teach astronomy'],'The author stays balanced.'],['Which detail best supports the claim that space research has practical benefits?',['Technology from spacecraft improved GPS and weather forecasting','Rockets are tall','Astronauts wear suits','Mars is red'],'It names real, practical results.'],['How do Dr. Ramos and Teacher Cruz differ?',['He stresses inspiration and innovation; she stresses urgent needs on Earth','They agree','He is a student','She is an astronaut'],'They emphasize different priorities.'],['Which is the strongest reason to support a balanced approach?',['It values discovery without ignoring urgent needs','It is cheaper','It is faster','It is popular'],'It respects both concerns.']],'Write a short argument for how a country should split money between space science and schools.'),
RA('adv-en-5','en','Grade 6','Should School Start Later?',['At 6:30 every morning, thousands of students drag themselves out of bed, eat a rushed breakfast, and head to school. In recent years, some schools have asked a bold question: would students learn better if classes started later?','Sleep researchers say yes. During adolescence, the body’s internal clock shifts, making young people naturally sleepy later at night and slower to wake up in the morning. Studies in several countries have found that when schools moved start times by about an hour, students reported feeling more alert and missed fewer classes. Some schools also saw small improvements in test scores.','However, others warn that changing schedules is not simple. Parents who leave for work early may have no one to supervise their children in the morning. Bus routes and after-school activities would have to be rearranged, and later dismissal might mean traveling home in the dark or in evening traffic. In a country like the Philippines, where heat and flooding can already disrupt school days, some argue that morning hours are the coolest and safest for learning.','A middle path may exist. Some schools are testing flexible schedules, keeping early classes for subjects that need less concentration and placing harder lessons later in the morning. Others combine later start times with better sleep habits at home, such as limiting screens at night. The best solution may depend on the needs and conditions of each community.'],[['adolescence','the stage between childhood and adulthood'],['alert','awake and paying attention'],['supervise','watch over and guide'],['dismissal','the end of the school day'],['flexible','able to change easily'],['concentration','careful attention']],[['What happens to young people’s internal clocks during adolescence?',['They shift, making them sleepy later at night','They stop','They speed up','They break'],'The body clock shifts later.'],['What did some students report when start times moved about an hour later?',['They felt more alert and missed fewer classes','They felt more tired','They studied less','They slept in class'],'They felt more alert and missed fewer classes.'],['“Dismissal” means…',['The end of the school day','A new class','A holiday','A test'],'Dismissal is when school ends.'],['What is the main idea?',['Later start times may help students, but the change has challenges that communities must weigh','Mornings are cold','Schools are strict','Sleep is boring'],'The passage weighs benefits and difficulties.'],['Why might later start times be hard for working parents?',['They may leave early and have no one to supervise children in the morning','They dislike school','Buses are free','Schools are close'],'Children may be unsupervised.'],['Why might the author mention heat and flooding?',['To show that conditions in the Philippines affect which school hours work best','To scare readers','To advertise rain gear','To end the passage'],'Local conditions matter.'],['What can you infer about students who sleep too little?',['They may find it harder to concentrate','They learn faster','They run faster','They never get tired'],'Sleepiness affects attention.'],['What does the “middle path” suggest?',['Schools can adjust schedules without changing everything','Schools should close','Schools should never change','Students should stay home'],'It offers a flexible compromise.'],['What is the author’s purpose?',['To explain both sides of the school start time debate','To demand later start times','To sell alarm clocks','To tell a story'],'The passage is balanced and informative.'],['Which detail best supports the claim that later starts help students?',['Students reported feeling more alert and missed fewer classes','Buses are long','Mornings are cool','Parents work early'],'It is a result of actual trials.'],['How do sleep researchers and worried parents differ?',['Researchers focus on student health and alertness; parents focus on supervision and practical schedules','They agree','Researchers are students','Parents are teachers'],'Their priorities differ.'],['Which is the strongest reason to try flexible schedules?',['They address student needs while respecting community conditions','They are cheaper','They are easier','They remove all problems'],'They balance both concerns.']],'Design the ideal school schedule for your class and explain why it works.'),
RA('adv-fil-6','fil','Grade 6','Libreng Sakay para sa mga Estudyante?',['Tuwing umaga, nakapila na sa kanto ang mga estudyanteng sasakay ng dyip papunta sa paaralan. Para sa maraming pamilya, malaking bahagi ng baon ang inilalaan sa pamasahe. Kaya iminungkahi ng isang konsehal na gawing libre ang sakay ng mga estudyante sa mga pampublikong dyip at bus sa kanilang lungsod.','Sang-ayon si Gng. Linda Reyes, ina ng tatlong mag-aaral. Aniya, halos isandaang piso kada araw ang nagagastos niya sa pamasahe ng mga anak niya, at madalas ay napipilitan siyang umutang. Naniniwala rin siya na mas dadalas ang pagpasok ng mga bata kapag hindi na problema ang pamasahe.','Ngunit may alalahanin si Ginoong Carlos Mercado, tagapamahala ng kooperatiba ng mga tsuper. Ayon sa kanya, kailangang may pambayad ang pamahalaan sa mga tsuper para sa bawat estudyanteng sumasakay; kung hindi, malulugi sila. Dagdag pa niya, baka ang pondo ay kunin sa ibang serbisyo, tulad ng pagkukumpuni ng kalsada o pagbili ng gamot sa mga health center.','Iminungkahi ng isang ekonomista na simulan muna ang programa sa mga pamilyang pinakamahihirap at suriin ang resulta pagkalipas ng isang taon. Kung tataas ang bilang ng pumapasok at hindi mapapabayaan ang ibang serbisyo, saka palawakin. Para sa marami, ang tanong ay kung kaya ng lungsod ang gastos at kung sino ang pinakanangangailangan.'],[['pamasahe','bayad sa sasakyan'],['kooperatiba','samahang pinamumunuan ng mga kasapi para sa kanilang kapakanan'],['malulugi','mawawalan ng pera sa negosyo'],['pondo','salaping inilaan para sa isang layunin'],['ekonomista','dalubhasa sa pera at kalakalan']],[['Gaano kalaki ang nagagastos ni Gng. Reyes sa pamasahe araw-araw ayon sa teksto?',['Halos isandaang piso','Dalawampung piso','Limang daang piso','Sampung piso'],'Halos isandaang piso kada araw.'],['Sino ang tagapamahala ng kooperatiba ng mga tsuper?',['Ginoong Carlos Mercado','Gng. Linda Reyes','Ang konsehal','Ang ekonomista'],'Si Ginoong Mercado ang tagapamahala.'],['Ano ang ibig sabihin ng “malulugi”?',['Mawawalan ng pera sa negosyo','Kikita nang malaki','Magpapahinga','Maglalakbay'],'Mababawasan ang puhunan.'],['Ano ang pangunahing kaisipan?',['May magandang layunin ang libreng sakay ngunit kailangang pag-isipan ang gastos at kung sino ang unang makikinabang','Masama ang dyip','Mahal ang gasolina','Marami ang estudyante'],'Ipinakita ang pakinabang at hamon.'],['Bakit nag-aalala si Ginoong Mercado?',['Baka malugi ang mga tsuper kung walang pambayad ang pamahalaan','Ayaw niya ng estudyante','Maliit ang dyip','Maraming trapik'],'Kailangang may bayad ang tsuper.'],['Ano ang ipinahihiwatig ng pag-utang ni Gng. Reyes para sa pamasahe?',['Mabigat sa ilang pamilya ang gastos sa pamasahe','Mayaman ang pamilya','Ayaw ng mga bata sa paaralan','Libre na ang sakay'],'Napipilitan siyang umutang.'],['Bakit kaya iminungkahing simulan muna sa pinakamahihirap na pamilya?',['Para masuri ang epekto at unahin ang pinakanangangailangan','Para pagbawalan ang iba','Para makatipid ng papel','Para magalit ang mga tsuper'],'Maingat at makatarungang pagsisimula ito.'],['Ano ang ipinahihiwatig ng babalang baka kunin ang pondo sa ibang serbisyo?',['May kapalit ang pagpili ng isang programa','Walang kapalit','Libre ang pondo','Marami ang pera ng lungsod'],'Limitado ang pondo.'],['Ano ang layunin ng may-akda?',['Ilahad ang magkabilang panig at ang makatwirang hakbang bago magpasya','Ipagbawal ang dyip','Ipagbili ang bus','Magpatawa'],'Patas ang paglalahad.'],['Alin ang pinakamagandang ebidensiyang susuri kung epektibo ang programa?',['Pagbabago sa bilang ng pumapasok pagkalipas ng isang taon','Dami ng dyip','Kulay ng bus','Haba ng pila'],'Masusukat ang epekto sa pagpasok.'],['Paano naiiba ang alalahanin ni Gng. Reyes at ni Ginoong Mercado?',['Gastos ng pamilya ang kay Gng. Reyes; pananalapi ng tsuper at pondo ang kay Ginoong Mercado','Pareho sila','Tsuper si Gng. Reyes','Estudyante si Ginoong Mercado'],'Magkaiba ang kanilang pinanggagalingan.'],['Alin ang pinakamahusay na dahilan para sa unti-unting pagsisimula?',['Nasusuri ang bunga at naiiwasang masayang ang pondo','Mas mabilis ito','Mas maingay ito','Mas mura ang dyip'],'Mas ligtas itong paraan.']],'Magmungkahi ng patas na paraan para pondohan ang libreng sakay.'),
RA('adv-fil-7','fil','Grade 6','Katutubong Puno o Mabilis Tumubong Puno?',['Pagkatapos ng isang malaking pagguho ng lupa sa bundok ng Sitio Bagong Pag-asa, nagsimula ang proyektong pagtatanim ng puno. Ngunit nagkaroon ng hindi pagkakasundo kung anong uri ng puno ang itatanim: mga katutubong puno tulad ng narra at molave, o mabilis tumubong puno gaya ng gmelina at akasya.','Ayon kay G. Arnel, forester ng pamahalaan, mabilis tumubo ang gmelina at akasya, kaya agad nilang natatakpan ang hubad na lupa at napipigilan ang pagguho. May kita rin ang mga pamilya dahil nabebenta ang kahoy pagkaraan ng ilang taon. “Kailangan nating makita agad ang resulta,” wika niya.','Hindi sumasang-ayon si Dr. Celia Montes, biyologo. Ayon sa kanya, mas angkop sa lupa at klima ng bansa ang mga katutubong puno, at nagbibigay ito ng tirahan at pagkain sa mga ibon at hayop. Ang ilang dayuhang puno naman ay maaaring sumipsip ng maraming tubig at pumigil sa paglago ng ibang halaman sa ilalim nito. Mabagal tumubo ang katutubong puno, ngunit mas tumatagal ang pakinabang nito sa kagubatan.','Nagkasundo ang komunidad sa pinaghalong plano: magtanim muna ng ilang mabilis tumubong puno bilang pansamantalang panangga, at unti-unting patubuin sa ilalim nito ang mga katutubong puno. Sa ganitong paraan, may agarang proteksiyon at may pangmatagalang kagubatan. Susubaybayan ng paaralan at barangay ang paglaki ng mga puno bawat taon.'],[['pagguho','pagbagsak ng lupa o bato mula sa bundok'],['katutubong','likas na mula sa isang lugar'],['dayuhang','galing sa ibang bansa'],['panangga','pangharang o proteksiyon'],['susubaybayan','babantayan at lalagyan ng tala']],[['Ano ang nangyari bago nagsimula ang proyektong pagtatanim?',['Nagkaroon ng malaking pagguho ng lupa','Bumaha sa bayan','Nasunog ang bundok','Umulan ng yelo'],'Isang pagguho ng lupa ang naganap.'],['Anong mga puno ang mabilis tumubo ayon sa teksto?',['Gmelina at akasya','Narra at molave','Mangga at saging','Niyog at bakawan'],'Gmelina at akasya ang mabilis tumubo.'],['Ano ang ibig sabihin ng “dayuhang”?',['Galing sa ibang bansa','Lokal','Matanda','Malaki'],'Ang dayuhan ay mula sa ibang bansa.'],['Ano ang pangunahing kaisipan?',['Maaaring pagsamahin ang mabilis tumubong puno at katutubong puno para sa agarang proteksiyon at pangmatagalang kagubatan','Masama ang akasya','Mahal ang kahoy','Maganda ang bundok'],'Ito ang kompromiso ng komunidad.'],['Bakit gusto ni G. Arnel ang mabilis tumubong puno?',['Agad nilang natatakpan ang lupa at napipigilan ang pagguho','Mas maganda ang mga ito','Mas mabigat ang kahoy','Mas bihira ang mga ito'],'Kailangan ng agarang resulta.'],['Ano ang ipinahihiwatig ng pagkakaroon ng kita ng mga pamilya mula sa gmelina?',['May pang-ekonomiyang benepisyo ang mabilis tumubong puno','Walang halaga ang kahoy','Bawal magbenta','Walang gustong magtanim'],'Nakatutulong ito sa kabuhayan.'],['Bakit maaaring mas makabuti sa mga ibon ang katutubong puno?',['Nagbibigay ito ng tirahan at pagkain na angkop sa kanila','Mas mataas ito','Mas malaki ang dahon nito','Mas mabilis ang hangin dito'],'Angkop ang katutubo sa lokal na hayop.'],['Bakit itinanim ang mabilis tumubong puno bilang pansamantalang panangga lamang?',['Para may agarang proteksiyon habang lumalaki ang mga katutubong puno','Para putulin agad','Para ibenta lahat','Para magpasikat'],'Pansamantala lamang ang tungkulin nito.'],['Ano ang layunin ng may-akda?',['Ipakita ang magkabilang panig at ang kompromiso ng komunidad','Ipagbawal ang akasya','Magbenta ng kahoy','Magpatawa'],'Patas ang paglalahad.'],['Alin ang pinakamatibay na ebidensiya ng benepisyo ng katutubong puno sa kalikasan?',['Nagbibigay ito ng tirahan at pagkain sa mga ibon at hayop','Mataas ang kahoy','Mura ang punla','Mabilis ang ugat'],'Direktang benepisyo sa ekosistema.'],['Paano naiiba ang pananaw ni G. Arnel at ni Dr. Montes?',['Bilis at kita ang diin ng una; pangmatagalang kalusugan ng kagubatan ang diin ng ikalawa','Pareho ang pananaw nila','Magsasaka ang una','Guro ang ikalawa'],'Magkaiba ang kanilang prayoridad.'],['Alin ang pinakamahusay na dahilan para sa pinaghalong plano?',['May agarang proteksiyon at nabubuo rin ang pangmatagalang kagubatan','Mas mura ito','Mas madali ito','Walang kailangang bantayan'],'Natutugunan nito ang parehong pangangailangan.']],'Gumawa ng plano kung paano mo susubaybayan ang mga itinanim na puno sa loob ng isang taon.'),
RA('adv-fil-8','fil','Grade 6','Online na Klase o Harapang Klase?',['Noong panahon ng pandemya, napilitang mag-aral online ang maraming mag-aaral sa Pilipinas. Ngayong bumalik na sa silid-aralan ang karamihan, patuloy ang tanong: mas mabuti ba ang harapang klase o ang online na pagkatuto?','Para kay Gng. Beth Ocampo, guro sa Matematika, mas epektibo ang harapang klase. Nakikita niya agad kung sino ang nalilito at natutulungan niya ito sa mismong sandali. Napapansin din niyang mas natututong makisama at makipag-usap ang mga bata kapag magkasama sila sa iisang silid. “Hindi lahat ng natutuhan ay nasa libro,” wika niya.','Ngunit may mga pamilyang pabor sa online. Ayon kay Ginoong Dante Flores, na nakatira sa isang malayong baryo, tatlong oras ang binabyahe ng anak niya papunta sa paaralan. Sa online, nakakatipid sila ng oras at pamasahe, at nakakapag-aral ang bata kahit may bagyo. Gayunman, aminado siyang mahina ang signal sa kanilang lugar at wala silang laptop, kaya madalas na naiiwan ang kanyang anak.','Ipinapakita ng ilang pag-aaral na epektibo ang pinaghalong paraan o blended learning, kung saan may harapang klase at online na gawain, basta may maaasahang internet at gamit ang lahat ng bata. Sa ngayon, patuloy na tinutuklas ng mga paaralan kung paano pagsasabayin ang dalawa upang walang batang maiwan. Mahalaga ring pakinggan ang mga guro, magulang, at mag-aaral bago magpasya ang paaralan.'],[['pandemya','malawakang pagkalat ng sakit sa maraming bansa'],['nalilito','hindi tiyak o hindi maintindihan'],['aminado','inaamin ang totoo'],['maaasahang','mapagkakatiwalaan'],['pinaghalong','pinagsamang dalawa o higit pa']],[['Ilang oras ang biyahe ng anak ni Ginoong Flores papunta sa paaralan?',['Tatlong oras','Isang oras','Limang minuto','Sampung oras'],'Tatlong oras ang binabyahe.'],['Anong asignatura ang itinuturo ni Gng. Ocampo?',['Matematika','Filipino','Agham','Sining'],'Guro siya sa Matematika.'],['Ano ang ibig sabihin ng “aminado”?',['Inaamin ang totoo','Itinatanggi
