<html lang="fil">
<head>

<title>TALA+</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3ff;--sf:#fff;--ink:#2b2358;--mut:#5d5a82;--ok:#14803c;--bad:#c0392b;--c1:#0f9d8a;--c2:#3b6fe0;--c3:#8b4fd8;--c4:#f2a900;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151236;--sf:#231e52;--ink:#f1eeff;--mut:#b9b4e6;--ok:#6fe39a;--bad:#ff958a;--c1:#33cdb9;--c2:#7ea3ff;--c3:#b98cff;--c4:#ffc83d}}
:root[data-theme="dark"]{--bg:#151236;--sf:#231e52;--ink:#f1eeff;--mut:#b9b4e6;--ok:#6fe39a;--bad:#ff958a;--c1:#33cdb9;--c2:#7ea3ff;--c3:#b98cff;--c4:#ffc83d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 18px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.1}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:4px solid var(--c2);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 60px}
.k1{--c:var(--c1);--cf:#fff}.k2{--c:var(--c2);--cf:#fff}.k3{--c:var(--c3);--cf:#fff}.k4{--c:var(--c4);--cf:#2b2358}
.bx{background:var(--sf);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.btn{background:var(--sf);border:3px solid var(--ink);border-radius:16px;padding:8px 16px;box-shadow:0 4px 0 var(--ink);font-weight:800;min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--c,var(--c2));color:var(--cf,#fff)}
.btn[aria-pressed="true"]{background:var(--c,var(--c2));color:var(--cf,#fff)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo{display:flex;gap:8px;align-items:center;background:none;border:0;padding:0}
.logo h1{font-size:2.4rem;font-weight:800}
.who{display:flex;gap:8px;align-items:center}
.who input{border:3px solid var(--ink);border-radius:14px;padding:6px 12px;background:var(--sf);width:150px}
.tala{display:flex;gap:12px;align-items:center;padding:12px 16px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stairs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;margin-top:26px}
.st{text-align:left;background:var(--c);color:var(--cf);border:3px solid var(--ink);border-radius:22px 22px 0 0;box-shadow:0 5px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.st:nth-child(1){min-height:190px}.st:nth-child(2){min-height:240px}.st:nth-child(3){min-height:290px}.st:nth-child(4){min-height:340px}
.st h2{font-size:1.5rem}.st p{margin:0;font-size:.95rem}
.pb{height:12px;border-radius:9px;border:2px solid currentColor;margin-top:auto;overflow:hidden}.pb i{display:block;height:100%;background:currentColor}
.me{position:absolute;top:-22px;right:8px;font-size:2rem;animation:hop 1.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
@media (max-width:720px){.stairs{grid-template-columns:1fr}.st:nth-child(n){min-height:0}.pb{margin-top:6px}}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border-left:12px solid var(--c)}
.item:disabled{opacity:.55}
.rd{border-top:12px solid var(--c);padding:18px clamp(14px,4vw,32px) 26px;margin-top:10px}
.txt{font-size:var(--fs,1.2rem);line-height:1.85;max-width:62ch;font-weight:600}.txt p{margin:0 0 .9em}
.easy .txt{letter-spacing:.06em;word-spacing:.2em;line-height:2.2}
.w{background:none;border:0;border-bottom:3px dotted var(--c);padding:0;font:inherit;color:inherit}
.s.hl{background:#ffe27a;color:#2b2358;border-radius:6px}
#tip{min-height:2.8em;margin:6px 0 14px;padding:8px 12px;border-radius:14px;border:2px dashed var(--c);max-width:62ch}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{text-align:left;background:var(--sf);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--ink)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ink)}.opt.no{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.stars{display:flex;flex-wrap:wrap;gap:4px;font-size:1.5rem;margin:8px 0}
.fb{padding:10px 14px;border-radius:14px;border:3px solid var(--ink);margin:8px 0}
details{margin:10px 0}summary{cursor:pointer;font-weight:800}
.big{font-size:3rem;letter-spacing:.1em}
.bar{height:14px;background:var(--bg);border:2px solid var(--ink);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:2px solid var(--bg)}
.bd{display:inline-block;margin:4px;padding:6px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--sf)}.bd.off{opacity:.4}
@media (prefers-reduced-motion:reduce){.me{animation:none}*{transition:none!important}}
</style>
</head>

var RA=function(id,l,lv,t,ps,v,q,k){var ty=['lit','lit','voc','main','cause','inf','inf','inf','purp','evid','comp','opin'],h=0;for(var c=0;c<id.length;c++)h=(h*31+id.charCodeAt(c))|0;return{id:id,category:'adv',lang:l,level:lv,title:t,paragraphs:ps,vocab:v.map(function(x){return{word:x[0],meaning:x[1]}}),questions:q.map(function(a,i){var z=sh(a[1],h+i*7919);return Q(ty[i],a[0],z[0],z[1],a[2])}),task:k}};

{id:"rem-fil-1",category:"rem",lang:"fil",level:"Grade 1",title:"Ang Saging ni Ben",
paragraphs:["May saging si Ben. Dilaw ang saging.","Ibinigay niya ito kay Aling Rosa. Ngumiti si Aling Rosa at nagsabing, “Salamat, Ben!”"],

questions:[Q("lit","Ano ang kulay ng saging?",["Pula","Dilaw","Berde"],1,"Dilaw ang saging."),Q("lit","Kanino ibinigay ni Ben ang saging?",["Kay Aling Rosa","Kay Lola","Kay Muning"],0,"Ibinigay niya ito kay Aling Rosa."),Q("voc","Ano ang ibig sabihin ng “ngumiti”?",["Umiyak","Nagpakita ng ngiti","Tumakbo"],1,"Ang ngumiti ay nagpakita ng ngiti.")],

R("rem-fil-2","fil","Grade 1","Ang Aso ni Tito",["May aso si Tito. Malaki ang aso. Ang pangalan niya ay Bantay.","Tumatahol si Bantay kapag may dumarating. Tuwing hapon, magkasama silang naglalakad sa kalsada. Mahal ni Tito ang kanyang aso."],[["aso","a-so","hayop na tumatahol"],["Tumatahol","tu-ma-ta-hol","gumagawa ng tunog na aw-aw"],["dumarating","du-ma-ra-ting","papalapit o nagpupunta rito"]],[["Ano ang pangalan ng aso?",["Bantay","Muning","Bimbo"],0,"Bantay ang pangalan ng aso."],["Kailan magkasamang naglalakad sina Tito at Bantay?",["Tuwing umaga","Tuwing hapon","Tuwing gabi"],1,"Tuwing hapon silang naglalakad."],["Ano ang ibig sabihin ng “tumatahol”?",["Kumakain","Tumatalon","Gumagawa ng tunog na aw-aw"],2,"Ang tumatahol ay umaaw-aw."]],"Gumuhit ng alagang hayop at pangalanan ito."),
R("rem-fil-3","fil","Grade 1","Sa Palengke",["Sumama si Nena kay Nanay sa palengke. Bumili sila ng isda at gulay.","Pula ang kamatis. Berde ang sitaw. Nagbitbit si Nena ng maliit na bayong. Masaya siya."],[["palengke","pa-leng-ke","lugar na bilihan ng pagkain"],["isda","is-da","hayop na nakatira sa tubig"],["sitaw","si-taw","mahabang berdeng gulay"]],[["Sino ang kasama ni Nena?",["Si Nanay","Si Tatay","Si Lola"],0,"Sumama siya kay Nanay."],["Anong kulay ang kamatis?",["Berde","Pula","Dilaw"],1,"Pula ang kamatis."],["Ano ang palengke?",["Paaralan","Simbahan","Lugar na bilihan ng pagkain"],2,"Doon bumibili ng isda at gulay."]],"Ilista ang tatlong pagkaing gusto mong bilhin sa palengke."),
R("rem-fil-4","fil","Grade 1","Ang Ulan",["Madilim ang langit. Umuulan na! Kumuha ng payong si Ana.","Basa ang daan. Gumawa si Ana ng bangka na papel. Pinalutang niya ito sa tubig. Tuwang-tuwa siya."],[["langit","la-ngit","itaas na nakikita natin sa labas"],["payong","pa-yong","pantakip sa ulan"],["bangka","bang-ka","sasakyang lumulutang sa tubig"]],[["Ano ang kinuha ni Ana?",["Bola","Payong","Sapatos"],1,"Kumuha siya ng payong."],["Ano ang pinalutang ni Ana sa tubig?",["Bangka na papel","Dahon","Bola"],0,"Pinalutang niya ang bangka na papel."],["Para saan ang payong?",["Pantakip sa ulan","Pagkain","Laruan"],0,"Ginagamit ito kapag umuulan."]],"Gumawa ng bangkang papel at isulat kung saan mo ito palulutangin."),
R("rem-fil-5","fil","Grade 2","Ang Paaralan",["Maaga pumasok si Lito sa paaralan. Binati niya ang kanyang guro. Umupo siya sa tabi ni Maya.","Nagbasa sila ng aklat tungkol sa mga ibon. Natuwa sila sa mga larawan."],[["guro","gu-ro","nagtuturo sa klase"],["aklat","ak-lat","libro"],["larawan","la-ra-wan","drawing o litrato"]],[["Sino ang binati ni Lito?",["Ang kanyang guro","Si Nanay","Si Maya"],0,"Binati niya ang kanyang guro."],["Ano ang binasa nila?",["Liham","Aklat tungkol sa mga ibon","Dyaryo"],1,"Aklat tungkol sa mga ibon ang binasa nila."],["Ano ang guro?",["Nagluluto","Nagtitinda","Nagtuturo sa klase"],2,"Ang guro ay nagtuturo."]],"Isulat ang pangalan ng paborito mong guro."),
R("rem-fil-6","fil","Grade 2","Ang Bahay Kubo",["Maliit ang bahay kubo ni Lolo Ben. Gawa ito sa kawayan at pawid.","Malamig sa loob kahit mainit ang araw. Sa tabi nito, may tanim na talong at ampalaya."],[["kawayan","ka-wa-yan","mataas at matibay na halamang guwang"],["pawid","pa-wid","dahong ginagawang bubong"],["ampalaya","am-pa-la-ya","gulay na mapait"]],[["Saan gawa ang bahay kubo?",["Bato","Kawayan at pawid","Bakal"],1,"Gawa ito sa kawayan at pawid."],["Anong mga gulay ang nasa tabi nito?",["Talong at ampalaya","Sitaw at kamatis","Repolyo at carrot"],0,"Talong at ampalaya ang tanim."],["Ano ang pawid?",["Tubig","Dahong ginagawang bubong","Pako"],1,"Ito ang pang-bubong na dahon."]],"Gumuhit ng bahay kubo at ang mga tanim sa paligid nito."),
R("rem-fil-7","fil","Grade 2","Ang Kaibigan Kong Langgam",["Nakakita si Dino ng maliit na langgam sa sahig. May dala itong butil ng kanin.","Hindi ito pinatay ni Dino. Sinundan niya ang langgam hanggang sa lungga. Doon nakatira ang marami nitong kasama."],[["langgam","lang-gam","maliit na insektong masipag"],["butil","bu-til","maliit na piraso o buto"],["Sinundan","si-nun-dan","sumunod sa likod"]],[["Ano ang dala ng langgam?",["Dahon","Butil ng kanin","Bato"],1,"May dala itong butil ng kanin."],["Ano ang ginawa ni Dino sa langgam?",["Hindi niya ito pinatay","Pinalo niya ito","Hinuli niya ito"],0,"Hindi ito pinatay ni Dino."],["Ano ang ibig sabihin ng “sinundan”?",["Sumunod sa likod","Tumakbo palayo","Natulog"],0,"Sumunod siya sa langgam."]],"Isulat ang isang bagay na natutunan mo sa langgam."),
R("rem-fil-8","fil","Grade 2","Mabuting Bata si Rey",["Nakita ni Rey ang pitaka sa bangketa. May laman itong pera. Dinala niya ito sa guwardiya.","Hinanap ng guwardiya ang may-ari. Nagpasalamat ang may-ari kay Rey dahil siya ay matapat."],[["pitaka","pi-ta-ka","lagayan ng pera"],["guwardiya","gu-war-di-ya","nagbabantay ng lugar"],["matapat","ma-ta-pat","hindi nagsisinungaling o nangunguha ng hindi kanya"]],[["Saan nakita ni Rey ang pitaka?",["Sa bangketa","Sa bahay","Sa paaralan"],0,"Nakita niya ito sa bangketa."],["Kanino niya dinala ang pitaka?",["Sa guro","Sa guwardiya","Sa kapitbahay"],1,"Dinala niya ito sa guwardiya."],["Ano ang ibig sabihin ng “matapat”?",["Mapagbiro","Hindi nagsisinungaling o nangunguha ng hindi kanya","Mabilis tumakbo"],1,"Matapat si Rey dahil ibinalik niya ang pitaka."]],"Ano ang gagawin mo kapag nakakita ka ng nawalang gamit? Isulat ito."),
R("rem-fil-9","fil","Grade 3","Ang Pagtatanim",["Tuwing Sabado, nagtatanim ng gulay ang pamilya Cruz. Una, hinuhukay ni Tatay ang lupa.","Pagkatapos, inilalagay ni Ate ang mga buto. Panghuli, dinidiligan ni Bunso ang tanim. Makalipas ang ilang linggo, aanihin na nila ang gulay."],[["hinuhukay","hi-nu-hu-kay","binubutasan ang lupa"],["dinidiligan","di-ni-di-li-gan","binubuhusan ng tubig"],["aanihin","a-a-ni-hin","pipitasin kapag hinog na"]],[["Sino ang naglalagay ng buto?",["Tatay","Ate","Bunso"],1,"Si Ate ang naglalagay ng buto."],["Ano ang ginagawa ni Bunso?",["Dinidiligan ang tanim","Hinuhukay ang lupa","Nagbebenta ng gulay"],0,"Dinidiligan niya ang tanim."],["Ano ang ibig sabihin ng “dinidiligan”?",["Hinuhukay","Inaani","Binubuhusan ng tubig"],2,"Binubuhusan ito ng tubig."]],"Pumili ng gulay na gusto mong itanim at isulat kung bakit."),
R("rem-fil-10","fil","Grade 3","Ang Munting Ibon",["May ibong nahulog sa puno sa harap ng bahay ni Carla. Basa ang pakpak nito at nanginginig sa ginaw.","Maingat itong binalot ni Carla sa tuwalya. Nang tumila ang ulan at gumaling ang ibon, pinakawalan niya ito. Lumipad ito pabalik sa langit."],[["pakpak","pak-pak","bahagi ng ibon na pinanglilipad"],["nanginginig","na-ngi-ngi-nig","yumayanig dahil sa lamig"],["pinakawalan","pi-na-ka-wa-lan","pinalaya"]],[["Ano ang nangyari sa ibon?",["Nawala sa gubat","Nahulog sa puno","Kumain ng palay"],1,"Nahulog ito sa puno."],["Ano ang ginawa ni Carla?",["Binalot ang ibon sa tuwalya","Ibinenta ang ibon","Isinara sa kulungan"],0,"Binalot niya ito sa tuwalya."],["Ano ang ibig sabihin ng “pinakawalan”?",["Hinuli","Pinakain","Pinalaya"],2,"Pinalaya niya ang ibon."]],"Sumulat ng isang paraan para makatulong sa hayop na nangangailangan."),
R("rem-en-1","en","Grade 1","My Red Hat",["I have a red hat. The hat is big. I wear it in the sun.","My dog sits on my hat! I say, “Get off, Bantay!” Then we both laugh. It is my favorite hat."],[["hat","hat","something you wear on your head"],["sun","sun","the bright star in the sky"],["sits","sits","rests on a seat or on something"]],[["What color is the hat?",["Blue","Red","Green"],1,"It is a red hat."],["Who sits on the hat?",["A dog","A cat","A bird"],0,"The dog sits on it."],["A hat is something you…",["wear on your head","eat","read"],0,"You wear a hat on your head."]],"Draw your favorite hat."),
R("rem-en-2","en","Grade 1","The Little Cat",["Mimi is a little cat. She likes to nap on the mat.","When it is time to eat, she says, “Meow!” Mama gives her fish and milk. Mimi is happy."],[["nap","nap","a short sleep"],["mat","mat","a small rug on the floor"],["milk","milk","a white drink"]],[["Where does Mimi nap?",["In a box","On the bed","On the mat"],2,"She naps on the mat."],["What does Mimi say?",["Woof","Meow","Moo"],1,"Cats say meow."],["A nap is…",["a short sleep","a loud noise","a big meal"],0,"A nap is a short sleep."]],"Write one sentence about a pet you like."),
R("rem-en-3","en","Grade 1","At the Beach",["We go to the beach on Sunday. The sand is warm. The waves are blue.","Kuya builds a sand castle. I find a pink shell. I put it in my pail."],[["beach","beach","a sandy place by the sea"],["waves","waves","water that moves up and down in the sea"],["shell","shell","the hard home of a sea animal"]],[["When do they go to the beach?",["On Sunday","On Monday","On Friday"],0,"They go on Sunday."],["What does Kuya build?",["A boat","A sand castle","A kite"],1,"Kuya builds a sand castle."],["A shell is…",["a kind of fish","a cold drink","the hard home of a sea animal"],2,"A shell protects a sea animal."]],"Draw what you would do at the beach."),
R("rem-en-4","en","Grade 1","The Rain",["Dark clouds fill the sky. Drip, drop! The rain begins. Ana takes her umbrella.","She jumps over a puddle. Splash! Her shoes are wet, but she is laughing."],[["umbrella","um-brel-la","a cover that keeps you dry in the rain"],["puddle","pud-dle","a small pool of water on the ground"],["laughing","laugh-ing","making happy sounds"]],[["What does Ana take?",["A hat","An umbrella","A bag"],1,"Ana takes her umbrella."],["What does she jump over?",["A puddle","A fence","A log"],0,"She jumps over a puddle."],["A puddle is…",["a kind of shoe","a rain cloud","a small pool of water on the ground"],2,"Rain makes puddles on the ground."]],"Write two words that describe rain."),
R("rem-en-5","en","Grade 2","My School Bag",["I pack my school bag every night. I put in my notebook, my pencil, and my lunch box.","I also add a bottle of water. In the morning, I am ready. I walk to school with my friend Lito."],[["pack","pack","put things inside a bag"],["notebook","note-book","a book with empty pages for writing"],["bottle","bot-tle","a container for water or milk"]],[["When does the child pack the bag?",["Every morning","Every night","Every Sunday"],1,"The child packs every night."],["Who walks to school with the child?",["Lito","Maya","Mama"],0,"The child walks with Lito."],["To “pack” means to…",["throw away","put things inside a bag","cut paper"],1,"Packing is putting things in a bag."]],"List three things in your school bag."),
R("rem-en-6","en","Grade 2","Lola’s Garden",["Lola has a small garden behind her house. She grows tomatoes, beans, and bright orange flowers.","Every afternoon, she waters the plants. Butterflies visit the flowers. Lola smiles and says, “My garden is full of friends.”"],[["garden","gar-den","a place where plants are grown"],["waters","wa-ters","pours water on"],["Butterflies","but-ter-flies","insects with colorful wings"]],[["Where is Lola’s garden?",["Behind her house","At school","At the beach"],0,"It is behind her house."],["What visits the flowers?",["Birds","Butterflies","Bees"],1,"Butterflies visit the flowers."],["“Waters” means…",["cuts down","picks","pours water on"],2,"Lola pours water on her plants."]],"Draw a garden and the visitors you want in it."),
R("rem-en-7","en","Grade 2","The Sari-Sari Store",["Aling Nena owns a sari-sari store near our house. She sells candy, soap, and rice.","A boy buys chips with a coin. Aling Nena gives him change. “Thank you, come again!” she says."],[["owns","owns","has something that belongs to you"],["coin","coin","a small round piece of money"],["change","change","money given back when you pay too much"]],[["What does Aling Nena sell?",["Candy, soap, and rice","Shoes and hats","Books and pens"],0,"She sells candy, soap, and rice."],["What does the boy use to pay?",["A card","A shell","A coin"],2,"He pays with a coin."],["“Change” is…",["money given back","a kind of candy","a new house"],0,"It is money returned to you."]],"Write what you would buy at a sari-sari store."),
R("rem-en-8","en","Grade 2","The Lost Kite",["Tomas flew his kite in the field. A strong wind pulled the string from his hand. The kite floated over the trees and out of sight.","Tomas felt sad. The next day, his neighbor found it on a roof and returned it. Tomas said thank you with a big smile."],[["kite","kite","a toy that flies in the wind on a string"],["strong","strong","powerful, not weak"],["neighbor","neigh-bor","a person who lives near you"]],[["What pulled the string from Tomas’s hand?",["A bird","A strong wind","His friend"],1,"A strong wind pulled it."],["Who found the kite?",["His neighbor","His teacher","His sister"],0,"His neighbor found it on a roof."],["A neighbor is a person who…",["sells kites","lives near you","teaches you"],1,"Neighbors live close to each other."]],"Write a thank-you note to a neighbor."),
R("rem-en-9","en","Grade 3","A Day at the Market",["On Saturday, Papa takes Rosa to the market. First, they buy fresh fish from a seller. Next, they choose ripe mangoes and green beans.","Rosa carries the light bag. At the end, Papa buys her a cold buko juice. They walk home happy."],[["market","mar-ket","a place where people buy and sell food"],["ripe","ripe","ready to eat"],["seller","sell-er","a person who sells things"]],[["What do they buy first?",["Fish","Mangoes","Beans"],0,"“First” tells us they buy fish."],["What does Papa buy Rosa at the end?",["Ice cream","Buko juice","Candy"],1,"He buys her cold buko juice."],["A ripe mango is…",["spoiled","not ready","ready to eat"],2,"Ripe fruit is ready to eat."]],"List the steps of Rosa’s day at the market in order."),
R("rem-en-10","en","Grade 3","The Brave Little Turtle",["A little turtle named Pagong lived near a slow river. One day, the river rose after a heavy rain. His friends, the frogs, could not cross to dry land.","Pagong carried them on his shell, one by one. He was slow, but he did not give up. By sunset, every frog was safe."],[["heavy","hea-vy","very strong or large in amount"],["cross","cross","go from one side to the other"],["safe","safe","away from danger"]],[["Why could the frogs not cross?",["The river rose after heavy rain","They were afraid of Pagong","They were tired"],0,"The river became too high."],["How did Pagong help?",["He built a bridge","He carried them on his shell","He called the farmer"],1,"He carried them one by one."],["“Safe” means…",["lost","hungry","away from danger"],2,"The frogs were away from danger."]],"Write about a time you helped a friend, even if it was hard."),
{id:"rei-en-1",category:"rei",lang:"en",level:"Grade 3",title:"Mang Tonyo and Bantay",
paragraphs:["Every morning, Mang Tonyo wakes up before the sun. First, he feeds his carabao, Bantay, with fresh grass. Next, he leads Bantay to the rice field.","The carabao pulls a plow through the wet soil so seeds can be planted. When the sun gets too hot, they rest under a mango tree.","By afternoon, the field is ready. Mang Tonyo pats Bantay and says, “We did well today, my friend.” A carabao is a strong helper for many Filipino farmers."],
vocab:[{word:"plow",meaning:"a tool pulled to turn over the soil"},{word:"soil",meaning:"the earth where plants grow"},{word:"seeds",meaning:"tiny parts that grow into new plants"}],
questions:[Q("lit","What does Mang Tonyo feed Bantay?",["Fresh grass","Rice","Mangoes","Corn"],0,"He feeds Bantay fresh grass."),Q("lit","Where do they rest when the sun is hot?",["In the barn","Under a mango tree","By the river","At home"],1,"They rest under a mango tree."),Q("main","What is the best main idea?",["Mornings are cold on the farm","A carabao helps a farmer prepare the rice field","Mango trees give shade","Seeds grow fast"],1,"The whole passage shows how Bantay helps with the field."),Q("cause","What does Mang Tonyo do right after feeding Bantay?",["Rests under a tree","Pats Bantay","Leads Bantay to the rice field","Plants seeds by hand"],2,"“Next” shows he leads Bantay to the field."),Q("voc","In this passage, a “plow” is a tool that…",["Cuts grass","Turns over the soil","Carries water","Counts seeds"],1,"The carabao pulls it through the soil.")],
task:"Draw Bantay and Mang Tonyo working in the field. Write one sentence about your picture."},
RR('rei-fil-1','fil','Grade 2','Bakit Tayo Naghuhugas ng Kamay',['Maraming bagay ang nahahawakan ng ating mga kamay sa buong araw. Humahawak tayo ng laruan, pera, at pinto. Hindi natin nakikita, pero maraming mikrobyo ang nakakapit sa mga ito.','Kapag hindi tayo naghugas ng kamay, maaaring mapunta ang mikrobyo sa ating bibig at magkasakit tayo. Kaya maghugas gamit ang sabon at tubig bago kumain at pagkatapos gumamit ng banyo. Kuskusin ang kamay habang bumibilang hanggang dalawampu. Madali itong gawin at nakatutulong sa buong pamilya.'],[['mikrobyo','napakaliit na bagay na maaaring magdulot ng sakit'],['nakakapit','nakadikit'],['Kuskusin','ikiskis nang paulit-ulit']],[['Anong mga bagay ang nahahawakan ng ating kamay?',['Laruan, pera, at pinto','Ulap at bituin','Hangin at araw','Buwan at ulan'],0,'Binanggit ang laruan, pera, at pinto.'],['Hanggang ilan ang bibilangin habang kinukuskos ang kamay?',['Lima','Sampu','Dalawampu','Isandaan'],2,'Bumibilang hanggang dalawampu.'],['Ano ang pangunahing kaisipan?',['Masaya ang maglaro','Mahalagang maghugas ng kamay para hindi magkasakit','Marami ang pinto sa bahay','Mahal ang sabon'],1,'Ang buong teksto ay tungkol sa halaga ng paghuhugas ng kamay.'],['Bakit maaaring magkasakit kapag hindi naghugas ng kamay?',['Lalamig ang tubig','Mapupunta ang mikrobyo sa ating bibig','Mawawala ang sabon','Mapapagod ang kamay'],1,'Maaaring mapunta ang mikrobyo sa bibig.'],['Ano ang ibig sabihin ng “kuskusin”?',['Itapon','Putulin','Ikiskis nang paulit-ulit','Ipunin'],2,'Ang kuskusin ay ikiskis nang paulit-ulit.']],'Gumawa ng poster na nagpapaalala sa mga kaklase na maghugas ng kamay.'),
RR('rei-fil-2','fil','Grade 2','Ang Alkansiya ni Mara',['Gustong bumili ni Mara ng bagong aklat. Mahal ito, kaya nagpasya siyang mag-ipon. Una, nilagyan niya ng sampung piso ang kanyang alkansiya tuwing Lunes. Pagkatapos, itinabi niya ang barya mula sa kanyang baon.','Makalipas ang isang buwan, binuksan ni Mara ang alkansiya. Binilang niya ang lahat ng pera. Sapat na ito! Panghuli, pumunta siya sa tindahan ng aklat at binili ang gusto niya. Tuwang-tuwa si Mara dahil galing sa sarili niyang ipon ang pambili.'],[['alkansiya','lalagyan ng ipon na pera'],['mag-ipon','magtabi ng pera para sa hinaharap'],['barya','maliit na halaga ng pera'],['Sapat','kasya at hindi kulang']],[['Ano ang gustong bilhin ni Mara?',['Laruan','Bagong aklat','Sapatos','Payong'],1,'Gusto niyang bumili ng bagong aklat.'],['Magkano ang inilalagay ni Mara tuwing Lunes?',['Limang piso','Sampung piso','Dalawampung piso','Isandaang piso'],1,'Sampung piso ang nilalagay niya.'],['Ano ang pangunahing kaisipan?',['Dapat mag-ipon para makabili ng gusto','Mahal ang aklat','Masarap ang baon','Mabilis ang isang buwan'],0,'Nakabili si Mara dahil nag-ipon siya.'],['Ano ang ginawa ni Mara pagkatapos niyang buksan ang alkansiya?',['Natulog','Binilang ang pera','Ibinigay ito kay Nanay','Itinapon ito'],1,'Binilang niya ang lahat ng pera.'],['Ano ang alkansiya?',['Uri ng aklat','Tindahan','Lalagyan ng ipon na pera','Laruan'],2,'Dito inilalagay ang naipong pera.']],'Isulat kung ano ang gusto mong ipunan at paano ka mag-iipon.'),
RR('rei-fil-3','fil','Grade 3','Ang Piyesta sa Aming Bayan',['Tuwing Mayo, may piyesta sa aming bayan. Maaga pa lang, gumigising na ang lahat para maghanda. Una, ang prusisyon: dala ng mga tao ang imahen ng patron habang umaawit sa kalsada. Pagkatapos, nagbubukas ang mga bahay at inaanyayahan ang mga bisita sa handaan.','Sa hapon, may paligsahan sa palo-sebo at sayawan sa plaza. Sa gabi, nagliliwanag ang langit sa makukulay na paputok. Pagod man, masaya kaming lahat dahil nagkakasama-sama ang mga kamag-anak at magkakapitbahay.'],[['prusisyon','sama-samang paglalakad bilang pagpaparangal sa santo'],['inaanyayahan','iniimbitahan'],['palo-sebo','paligsahan sa pag-akyat sa madulas na poste'],['kamag-anak','mga kapamilya sa malawak na pamilya']],[['Kailan ginaganap ang piyesta sa bayan?',['Disyembre','Mayo','Enero','Hunyo'],1,'Tuwing Mayo ang piyesta.'],['Ano ang nangyayari sa plaza sa hapon?',['Palo-sebo at sayawan','Pagtatanim','Klase','Palengke'],0,'May paligsahan sa palo-sebo at sayawan.'],['Ano ang pangunahing kaisipan?',['Ang piyesta ay masayang pagsasama-sama ng pamilya at komunidad','Mahal ang paputok','Maagang gumigising ang mga tao','Marami ang imahen sa bayan'],0,'Ipinapakita ng teksto ang saya ng pagsasama-sama.'],['Ano ang unang nangyayari sa piyesta?',['Paputok','Prusisyon','Sayawan','Paligsahan'],1,'“Una” ang prusisyon.'],['Ano ang ibig sabihin ng “inaanyayahan”?',['Pinaaalis','Iniimbitahan','Tinatakot','Pinagbibili'],1,'Iniimbitahan ang mga bisita sa handaan.']],'Ilarawan ang piyesta sa inyong lugar sa tatlong pangungusap.'),
RR('rei-fil-4','fil','Grade 3','Bakit Kailangan Natin ng Sapat na Tulog',['Ang mga batang edad anim hanggang labindalawa ay nangangailangan ng siyam hanggang labindalawang oras ng tulog bawat gabi. Habang natutulog tayo, nagpapahinga ang katawan at inaayos ng utak ang mga natutunan natin sa araw.','Kapag kulang sa tulog, madaling mapagod at mainis ang bata. Mahirap ding makinig at matandaan ang aralin sa klase. Para makatulog nang maayos, patayin ang telebisyon at cellphone bago matulog, at matulog sa parehong oras gabi-gabi.'],[['nangangailangan','kailangan'],['inaayos','inilalagay sa tamang ayos'],['mainis','magalit nang kaunti']],[['Ilang oras ng tulog ang kailangan ng batang anim hanggang labindalawang taong gulang?',['Tatlo hanggang lima','Anim hanggang pito','Siyam hanggang labindalawa','Labinlima'],2,'Siyam hanggang labindalawang oras.'],['Ano ang ginagawa ng utak habang tulog?',['Inaayos ang mga natutunan','Naglalaro','Humihinto nang tuluyan','Nagugutom'],0,'Inaayos nito ang mga natutunan sa araw.'],['Ano ang pangunahing kaisipan?',['Masarap ang telebisyon','Gabi ang pinakamahabang oras','Mahalaga ang sapat na tulog sa kalusugan at pag-aaral','Walang oras ang cellphone'],2,'Ipinapaliwanag kung bakit kailangan ang tulog.'],['Ano ang nangyayari kapag kulang sa tulog?',['Lalaki agad ang bata','Madaling mapagod at mainis ang bata','Gagaling ang sakit','Titigil ang klase'],1,'Madaling mapagod at mainis ang kulang sa tulog.'],['Ano ang ibig sabihin ng “nangangailangan”?',['Ayaw','Kailangan','Nakalimutan','Pinag-aawayan'],1,'Ang nangangailangan ay kailangan ng isang bagay.']],'Gumawa ng iskedyul ng iyong oras ng pagtulog at paggising.'),
RR('rei-fil-5','fil','Grade 4','Ang Bulkang Mayon',['Sa lalawigan ng Albay matatagpuan ang Bulkang Mayon. Kilala ito sa halos perpektong hugis kono, kaya dinarayo ito ng maraming turista. Ngunit isa rin ito sa mga pinakaaktibong bulkan sa Pilipinas.','Dahil dito, mahigpit na binabantayan ng mga eksperto ang galaw nito. Kapag may senyales ng panganib, naglalabas sila ng babala at inililikas ang mga pamilyang nakatira malapit sa bulkan. Mahalaga ang paghahanda upang maiwasang masaktan ang mga tao.','Kaya sa mga lugar sa paligid ng Mayon, tinuturuan ang mga bata kung ano ang gagawin sa oras ng emergency.'],[['kono','hugis na patulis paitaas, gaya ng cone ng sorbetes'],['eksperto','taong dalubhasa sa isang larangan'],['inililikas','inililipat sa ligtas na lugar'],['senyales','palatandaan']],[['Saang lalawigan matatagpuan ang Bulkang Mayon?',['Cebu','Albay','Bohol','Davao'],1,'Sa Albay ito matatagpuan.'],['Ano ang hugis ng Mayon?',['Halos perpektong kono','Parisukat','Bilog na bola','Mahabang tulay'],0,'Kilala ito sa halos perpektong hugis kono.'],['Ano ang pangunahing kaisipan?',['Maganda ang bulkan kaya dapat itong akyatin','Kailangang maging handa dahil aktibo ang Mayon','Maraming turista sa Albay','Maraming eksperto sa Pilipinas'],1,'Binibigyang-diin ng teksto ang paghahanda.'],['Bakit binabantayan ng mga eksperto ang galaw ng bulkan?',['Para magpaputok','Para magtayo ng bahay','Para makita ang panganib at makapagbigay ng babala','Para magbenta ng tiket'],2,'Upang maprotektahan ang mga tao.'],['Ano ang ibig sabihin ng “inililikas”?',['Inililipat sa ligtas na lugar','Inaanyayahan','Itinatago','Binabayaran'],0,'Inililipat ang mga pamilya sa ligtas na lugar.']],'Gumawa ng listahan ng mga dapat dalhin sa evacuation center.'),
RR('rei-en-2','en','Grade 3','How Bees Make Honey',['Honey starts as nectar, a sweet liquid inside flowers. A worker bee sips the nectar and stores it in a special stomach. She then flies back to the hive.','In the hive, she passes the nectar to other bees. They chew it and spread it into wax cells. Next, many bees fan their wings to dry the nectar. When it turns thick and sticky, the bees seal the cell with wax. The honey is now ready to be eaten later.'],[['nectar','a sweet liquid inside flowers'],['hive','a home for bees'],['wax','a soft, sticky material made by bees'],['seal','close tightly']],[['Where does a worker bee carry the nectar?',['To the river','To the hive','To a farm','To a school'],1,'She flies back to the hive.'],['What do bees use to close the cell?',['Wax','Mud','Leaves','Water'],0,'They seal the cell with wax.'],['What is the best main idea?',['Bees sleep in hives','Bees turn nectar into honey in several steps','Flowers are sweet','Wax is made from honey'],1,'The passage explains the steps of making honey.'],['Why do bees fan their wings over the nectar?',['To cool the hive','To dry the nectar so it becomes thick','To scare other bees','To make noise'],1,'Fanning helps the nectar dry and thicken.'],['A “hive” is…',['A flower','A home for bees','A kind of honey','A sweet drink'],1,'Bees live and store honey in the hive.']],'Draw the steps of how honey is made.'),
RR('rei-en-3','en','Grade 3','Recycling Day at School',['Every Friday, Grade 4 holds Recycling Day. First, students bring clean plastic bottles, paper, and cans from home. Next, they sort the items into three boxes: paper, plastic, and metal.','After sorting, the class leader weighs each box and writes the numbers on a chart. Finally, a junk shop owner picks up the boxes and pays the school. Last month, the class used the money to buy new books for the library. Students say it feels good to turn trash into something useful.'],[['sort','put things into groups'],['weighs','finds out how heavy something is'],['chart','a table or drawing that shows information'],['useful','helpful']],[['When is Recycling Day?',['Every Monday','Every Friday','Every Sunday','Every Wednesday'],1,'Grade 4 holds it every Friday.'],['What did the class buy with the money?',['Toys','Uniforms','New books for the library','Snacks'],2,'They bought new library books.'],['What is the best main idea?',['Students sort and recycle trash to help their school','Plastic is bad','Libraries are big','Fridays are busy'],0,'Recycling Day helps the school and the environment.'],['What do students do right after sorting the items?',['They sell them','The class leader weighs each box','They throw them away','They go home'],1,'“After sorting,” the leader weighs each box.'],['To “sort” means to…',['Break things','Hide things','Buy things','Put things into groups'],3,'They put items into paper, plastic, and metal groups.']],'List three things in your home that can be recycled.'),
RR('rei-en-4','en','Grade 4','Why Trees Matter',['Trees do much more than stand tall. First, they clean the air. Leaves take in carbon dioxide and give out oxygen, the gas we need to breathe. Second, trees give shade, which keeps streets and houses cooler on hot days.','Trees also protect the soil. Their roots hold the earth in place, so heavy rain is less likely to wash it away and cause floods or landslides. Finally, trees are homes for birds, insects, and many other animals. A town with many trees is healthier and safer for everyone.'],[['oxygen','the gas people and animals need to breathe'],['shade','a cool area blocked from the sun'],['roots','parts of a plant that grow underground'],['landslides','when soil and rocks slide down a slope']],[['What gas do leaves give out?',['Carbon dioxide','Oxygen','Smoke','Steam'],1,'Leaves give out oxygen.'],['What do tree roots do?',['Make shade','Hold the earth in place','Attract rain','Make leaves'],1,'Roots hold the soil.'],['What is the main idea?',['Trees help people, soil, and animals in many ways','Trees are tall','Birds are noisy','Hot days are long'],0,'The passage lists several benefits of trees.'],['Why can trees help prevent landslides?',['Their leaves are green','Their shade is cool','Their roots hold the soil','They make wind'],2,'Roots keep the soil from washing away.'],['“Shade” is…',['A bright light','A cool area blocked from the sun','A kind of leaf','A type of soil'],1,'Trees block the sun and make shade.']],'Plan where you would plant a tree in your school and why.'),
RR('rei-en-5','en','Grade 4','The Jeepney',['The jeepney is one of the most famous ways to travel in the Philippines. After World War II, many leftover army jeeps were left on the roads. Filipinos stretched them to make room for more passengers and added long benches inside.','Over time, drivers began decorating their jeepneys with bright paint, shiny metal, and funny sayings. Each jeepney became a small work of art. Today, jeepneys still carry many people to school and work, although the government is slowly replacing old ones with newer, cleaner models.'],[['leftover','still remaining after the main use'],['passengers','people who ride in a vehicle'],['decorating','making something look more beautiful'],['models','types or versions of a product']],[['After which event did jeepneys begin?',['World War II','A typhoon','A festival','A school year'],0,'They were made from army jeeps left after World War II.'],['What did Filipinos add inside the jeeps?',['Beds','Long benches','Kitchens','Televisions'],1,'They added long benches.'],['What is the best main idea?',['Jeeps are fast','The jeepney grew from army jeeps into a colorful part of Filipino travel','Paint is expensive','Schools are far'],1,'The passage tells how jeepneys began and changed.'],['Why did Filipinos stretch the army jeeps?',['To sell them','To hide them','To make room for more passengers','To race them'],2,'They wanted space for more riders.'],['“Leftover” means…',['Brand new','Still remaining after the main use','Broken','Borrowed'],1,'The jeeps remained after the war.']],'Design your own jeepney and give it a name.'),
RR('rei-en-6','en','Grade 5','The Water Cycle',['Water on Earth is always moving in a cycle. It begins when the sun heats water in oceans, rivers, and lakes. The warm water turns into vapor, an invisible gas, and rises into the air. This step is called evaporation.','High in the sky, the air is cold. The vapor cools and turns back into tiny drops of water that gather to form clouds. This is condensation. When the drops become heavy, they fall as rain, hail, or snow, which is called precipitation. Finally, the water flows into rivers and seas, and the cycle starts again.'],[['vapor','water in the form of an invisible gas'],['evaporation','water turning into vapor'],['condensation','vapor cooling into tiny drops of water'],['precipitation','water falling as rain, hail, or snow']],[['What heats the water to start the cycle?',['The moon','The wind','The sun','The clouds'],2,'The sun heats the water.'],['What do the tiny drops of water form in the sky?',['Rivers','Clouds','Mountains','Ice'],1,'They gather to form clouds.'],['What is the best main idea?',['Water moves in a repeating cycle through the air and back to Earth','Rain is cold','Clouds are heavy','Oceans are big'],0,'The passage describes a repeating cycle.'],['What happens right after vapor cools in the sky?',['It evaporates','It condenses into tiny drops that form clouds','It falls as snow at once','It disappears'],1,'Cooling vapor turns into tiny drops.'],['“Vapor” is…',['A heavy rain','An invisible gas made from water','A kind of cloud','A cold wind'],1,'Vapor is water as an invisible gas.']],'Draw and label the four steps of the water cycle.'),
RR('rei-fil-6','fil','Grade 4','Ang Hagdan-hagdang Palayan ng Banaue',['Sa Banaue, Ifugao, makikita ang hagdan-hagdang palayan na inukit sa gilid ng mga bundok. Ang mga ninuno ng mga Ifugao ang gumawa nito gamit ang simpleng kagamitan at lakas ng kamay. Dahil matarik ang bundok, ginawa nilang patag na hagdan ang lupa upang makapagtanim ng palay.','Ang tubig mula sa kagubatan sa itaas ay dumadaloy sa mga kanal hanggang sa bawat palayan. Hanggang ngayon, nagtatanim pa rin ang mga pamilya roon. Mahalagang pangalagaan ang kagubatan at ang mga palayan upang manatili ito para sa mga susunod na henerasyon.'],[['ninuno','mga naunang kamag-anak na nabuhay noon'],['matarik','halos patayo at mahirap akyatin'],['kanal','makitid na daluyan ng tubig'],['henerasyon','pangkat ng mga taong magkasingtanda o magkakasunod na lahi']],[['Saan matatagpuan ang mga hagdan-hagdang palayan?',['Banaue, Ifugao','Albay','Bohol','Palawan'],0,'Nasa Banaue, Ifugao ang mga ito.'],['Ano ang ginamit ng mga ninuno sa paggawa nito?',['Malalaking makina','Simpleng kagamitan at lakas ng kamay','Pampasabog','Bulldozer'],1,'Simpleng kagamitan at lakas ng kamay ang ginamit.'],['Ano ang pangunahing kaisipan?',['Ang hagdan-hagdang palayan ay yamang dapat pangalagaan','Marami ang bundok','Mataas ang presyo ng palay','Malamig sa Ifugao'],0,'Binibigyang-diin ang pag-aalaga rito para sa susunod na henerasyon.'],['Bakit ginawang hagdan ang gilid ng bundok?',['Para maganda sa litrato','Para makapagtanim ng palay sa matarik na lupa','Para umulan','Para mangisda'],1,'Matarik ang bundok kaya ginawang patag na hagdan.'],['Ano ang ibig sabihin ng “matarik”?',['Patag','Malalim','Halos patayo at mahirap akyatin','Mabaho'],2,'Ang matarik ay halos patayo.']],'Gumuhit ng hagdan-hagdang palayan at lagyan ng arrow ang daloy ng tubig.'),
RR('rei-fil-7','fil','Grade 4','Paghahanda Bago, Habang, at Pagkatapos ng Bagyo',['Kapag may paparating na bagyo, mahalaga ang maagang paghahanda. Una, ihanda ang emergency kit na may tubig, de-lata, flashlight, at gamot. Pagkatapos, ayusin ang mga bintana at alamin kung saan ang pinakamalapit na evacuation center.','Habang humahagupit ang bagyo, manatili sa loob ng bahay at makinig sa balita sa radyo. Kapag payapa na, huwag agad lumabas. Tiyaking ligtas na ang paligid at iwasan ang mga nakalaylay na kable. Sa ganitong paraan, mababawasan ang pinsala at maiiwasan ang disgrasya.'],[['humahagupit','malakas na humahampas'],['payapa','tahimik at hindi na mapanganib'],['nakalaylay','nakabitin at maluwag'],['disgrasya','aksidente']],[['Ano ang laman ng emergency kit?',['Tubig, de-lata, flashlight, at gamot','Laruan at kendi','Damit lang','Aklat at lapis'],0,'Ito ang mga nakalista sa teksto.'],['Saan dapat manatili habang humahagupit ang bagyo?',['Sa labas','Sa loob ng bahay','Sa dagat','Sa kalsada'],1,'Manatili sa loob ng bahay.'],['Ano ang pangunahing kaisipan?',['Maganda ang radyo','Ang paghahanda bago, habang, at pagkatapos ng bagyo ay nagliligtas sa tao','Mahal ang flashlight','Madalas ang bagyo'],1,'Ang buong teksto ay tungkol sa ligtas na paghahanda.'],['Ano ang dapat gawin pagkatapos ihanda ang emergency kit?',['Lumabas agad','Ayusin ang bintana at alamin ang evacuation center','Maligo sa ulan','Matulog'],1,'“Pagkatapos” ang susunod na hakbang.'],['Ano ang ibig sabihin ng “nakalaylay”?',['Nakatayo nang tuwid','Nakabaon','Nakabitin at maluwag','Nakatago'],2,'Mapanganib ang nakalaylay na kable.']],'Gumawa ng checklist ng emergency kit para sa pamilya ninyo.'),
RR('rei-fil-8','fil','Grade 5','Ang Diwa ng Bayanihan',['Noong unang panahon, kapag lilipat ng bahay ang isang pamilya, hindi ito ginagawa ng iisang tao lamang. Nagtitipon ang mga kapitbahay, nagpapasan ng mga kawayan sa kanilang balikat, at sama-samang binubuhat ang buong bahay kubo patungo sa bagong lugar. Tinatawag itong bayanihan.','Walang sahod ang mga tumutulong. Ang kapalit lamang nila ay masarap na pagkain at pasasalamat ng may-ari. Hanggang ngayon, makikita pa rin ang diwa ng bayanihan kapag nagtutulungan ang mga tao sa paglilinis ng komunidad o sa pagtulong sa mga nasalanta ng sakuna.'],[['nagpapasan','nagdadala sa balikat'],['bayanihan','sama-samang pagtutulungan'],['sahod','bayad sa trabaho'],['nasalanta','naapektuhan ng sakuna']],[['Ano ang binubuhat ng mga kapitbahay?',['Bahay kubo','Bangka','Puno','Tulay'],0,'Binubuhat nila ang buong bahay kubo.'],['Ano ang kapalit ng pagtulong?',['Pera','Masarap na pagkain at pasasalamat','Lupa','Damit'],1,'Pagkain at pasasalamat lamang ang kapalit.'],['Ano ang pangunahing kaisipan?',['Ang bayanihan ay pagtutulungan nang walang hinihinging bayad','Mahirap lumipat ng bahay','Marami ang kawayan','Masarap ang pagkain'],0,'Ipinapakita ng teksto ang diwa ng pagtutulungan.'],['Bakit sama-samang binubuhat ang bahay?',['Dahil bawal mag-isa','Dahil may paligsahan','Dahil mabigat ito at hindi kaya ng iisang tao','Dahil umuulan'],2,'Mabigat ang bahay kaya kailangan ng marami.'],['Ano ang ibig sabihin ng “sahod”?',['Gamit','Bayad sa trabaho','Pagkain','Lupa'],1,'Walang bayad ang mga tumutulong.']],'Isulat ang isang paraan ng bayanihan na magagawa ninyo sa paaralan.'),
RR('rei-fil-9','fil','Grade 5','Ligtas na Paggamit ng Internet',['Malaki ang naitutulong ng internet sa pag-aaral. Mabilis tayong nakakahanap ng impormasyon at nakakausap ang mga kamag-aral. Ngunit may mga panganib din. Huwag ibigay ang iyong password o address sa taong hindi mo kilala.','Kapag may nagpadala ng kahina-hinala o nakakatakot na mensahe, sabihin agad sa magulang o guro. Bago maniwala sa nabasa, tingnan kung mapagkakatiwalaan ang pinanggalingan. Kapag may pananagutan tayo sa ginagamit natin, magiging ligtas at kapaki-pakinabang ang internet.'],[['impormasyon','mga datos o kaalaman'],['kahina-hinala','parang may masamang balak'],['mapagkakatiwalaan','maaaring pagkatiwalaan'],['pananagutan','responsibilidad']],[['Ano ang naitutulong ng internet sa pag-aaral?',['Mabilis na paghahanap ng impormasyon','Pagluluto','Pagtulog','Pagtatanim'],0,'Mabilis tayong nakakahanap ng impormasyon.'],['Kanino dapat sabihin ang nakakatakot na mensahe?',['Sa kaibigan lang','Sa magulang o guro','Sa hindi kilala','Sa walang pinagsabihan'],1,'Sabihin agad sa magulang o guro.'],['Ano ang pangunahing kaisipan?',['Bawal ang internet','Kapaki-pakinabang ang internet kung may pag-iingat at pananagutan','Mahal ang internet','Masakit sa mata ang internet'],1,'Ligtas ang internet kapag responsable ang gumagamit.'],['Bakit hindi dapat ibigay ang password sa hindi kilala?',['Mabagal ang internet','Mahaba ang password','Maaari itong magamit sa masama','Bawal magsulat'],2,'Mapanganib ito at maaaring abusuhin.'],['Ano ang ibig sabihin ng “kahina-hinala”?',['Napakasaya','Parang may masamang balak','Napakadali','Napakalayo'],1,'Ang kahina-hinala ay nagdududa.']],'Gumawa ng tatlong patakaran para sa ligtas na paggamit ng internet sa bahay.'),
RR('rei-fil-10','fil','Grade 6','Ang Ilog Pasig Noon at Ngayon',['Noong unang panahon, ang Ilog Pasig ay mahalagang daan ng kalakalan at paglalakbay. Dito dumadaan ang mga bangkang may dalang pagkain at paninda. Habang dumarami ang tao at pabrika sa paligid, dumami rin ang basura at maruming tubig na itinatapon sa ilog.','Dahil dito, naging madumi at mabaho ito, at halos wala nang isdang nabubuhay. Sa mga nagdaang taon, naglunsad ng mga programa ang pamahalaan at mga mamamayan upang linisin ito. Nagtanim ng halaman sa pampang at nagtulungan ang mga tao na huwag magtapon ng basura. Unti-unti, may mga isda at ibon nang bumabalik.'],[['kalakalan','pagbili at pagbebenta ng paninda'],['pabrika','lugar na gumagawa ng produkto'],['pampang','gilid ng ilog'],['mamamayan','mga taong naninirahan sa isang bansa o lugar']],[['Ano ang dating gamit ng Ilog Pasig?',['Daan ng kalakalan at paglalakbay','Palaruan','Sakahan','Paliparan'],0,'Dito dumaraan ang mga bangkang may paninda.'],['Ano ang itinanim sa pampang?',['Palengke','Gusali','Halaman','Bakod'],2,'Nagtanim sila ng halaman sa pampang.'],['Ano ang pangunahing kaisipan?',['Ang ilog ay maaaring gumaling kapag nagtulungan ang mga tao','Mabaho ang ilog','Maraming pabrika','Maraming bangka'],0,'Ipinapakita ng teksto ang pagbabago dahil sa pagtutulungan.'],['Bakit naging madumi ang Ilog Pasig?',['Dahil umulan nang malakas','Dahil dumami ang basura at maruming tubig mula sa tao at pabrika','Dahil malalim ito','Dahil maraming isda'],1,'Dumami ang itinapon na basura at maruming tubig.'],['Ano ang ibig sabihin ng “pampang”?',['Gitna ng ilog','Gilid ng ilog','Ilalim ng ilog','Tulay'],1,'Ang pampang ay gilid ng ilog.']],'Magmungkahi ng dalawang paraan para mapanatiling malinis ang ilog sa inyong lugar.'),
RR('rei-en-7','en','Grade 5','How a Seed Becomes a Plant',['A seed may look small and still, but it holds a tiny plant inside. When a seed lands in soil that is warm and wet, it begins to germinate. First, it absorbs water and swells until its outer coat splits.','Next, a root grows downward to anchor the plant and drink water. Then, a shoot pushes up toward the light. Once the first leaves open, the plant can use sunlight to make its own food. With time and care, it grows into a strong plant that may produce flowers and new seeds.'],[['germinate','begin to grow'],['absorbs','soaks up'],['anchor','hold firmly in place'],['shoot','a young stem that grows upward']],[['What does a seed hold inside?',['A tiny plant','A rock','Water only','A flower'],0,'It holds a tiny plant.'],['Which part grows downward?',['The leaf','The flower','The root','The fruit'],2,'A root grows downward.'],['What is the best main idea?',['A seed grows into a plant through a series of steps','Seeds are small','Soil is wet','Flowers make food'],0,'The passage shows the steps of growth.'],['What happens right after the root grows downward?',['The seed splits','A shoot pushes up toward the light','Flowers appear','The plant dies'],1,'“Then, a shoot pushes up.”'],['To “germinate” means to…',['Dry out','Fall apart','Be eaten','Begin to grow'],3,'A seed germinates when it starts to grow.']],'Plant a bean in a cup and draw what you see each day.'),
RR('rei-en-8','en','Grade 5','The Philippine Eagle',['The Philippine eagle is the national bird of the Philippines and one of the largest eagles in the world. It has a shaggy crest of feathers and bright blue eyes. This eagle lives in thick forests on islands such as Mindanao and Luzon, where it hunts monkeys, flying lemurs, and snakes.','Sadly, the number of eagles has dropped because forests are being cut down. A pair of eagles needs a large forest to raise a single chick, which takes many months. Today, rangers and scientists protect nests and teach communities that saving forests also means saving the eagle.'],[['crest','a group of feathers on top of a bird’s head'],['thick','growing close together'],['rangers','people who guard forests and wildlife'],['communities','groups of people who live in the same area']],[['What is special about the Philippine eagle’s title?',['It is the national bird of the Philippines','It is a farm bird','It is a sea bird','It is a pet'],0,'It is the national bird.'],['What does the eagle hunt?',['Fruits','Monkeys, flying lemurs, and snakes','Fish only','Insects'],1,'It hunts monkeys, flying lemurs, and snakes.'],['What is the main idea?',['The Philippine eagle is special and needs protected forests','Eagles are blue','Forests are thick','Rangers are strong'],0,'The passage explains why the eagle needs saving.'],['Why has the number of eagles dropped?',['They moved abroad','Too much rain','Forests are being cut down','They hunt too much'],2,'Their forest homes are disappearing.'],['A “crest” is…',['A kind of nest','A group of feathers on a bird’s head','A type of food','A loud call'],1,'The eagle has a shaggy crest of feathers.']],'Write a slogan that asks people to protect the Philippine eagle.'),
RR('rei-en-9','en','Grade 6','Mika’s Science Fair Project',['Mika spent three weeks preparing for the school science fair. Her project asked a simple question: which kind of soil helps beans grow fastest? First, she planted beans in sand, clay, and garden soil. Every day, she measured the plants and wrote the results in a notebook.','The sand plants were the weakest, while the garden soil plants grew tallest. On fair day, Mika felt nervous, but she explained her results clearly. She did not win first prize. Still, the judges praised her careful notes, and Mika realized that learning something new was the real reward.'],[['measured','found the size of something'],['nervous','worried or uneasy'],['praised','said good things about'],['reward','something good you get for effort']],[['What question did Mika’s project ask?',['Which soil helps beans grow fastest?','How tall is a bean?','Why is the sky blue?','When do plants sleep?'],0,'Her project compared soils.'],['Which plants grew tallest?',['Sand','Clay','Garden soil','All the same'],2,'Garden soil plants grew tallest.'],['What is the best main idea?',['Mika learned that careful work and curiosity matter more than winning','Beans are tall','Fairs are crowded','Notebooks are useful'],0,'The ending shows learning was the real reward.'],['Why did the judges praise Mika?',['She won first prize','Her notes were careful','She was late','She planted flowers'],1,'They praised her careful notes.'],['“Reward” means…',['A punishment','A tool','Something good you get for effort','A kind of soil'],2,'A reward is a good thing you earn.']],'Think of a question you can test. Write what you will do first, next, and last.'),
RR('rei-en-10','en','Grade 6','Life on a Coral Reef',['A coral reef may look like colorful rock, but it is made of tiny animals called coral polyps. Over many years, these polyps build hard skeletons that join together to form a reef. The Philippines is part of the Coral Triangle, a sea area with more kinds of marine life than almost anywhere else.','Reefs give fish a place to hide, feed, and raise their young, and they protect coastlines from strong waves. However, reefs grow very slowly and are easily harmed by pollution, warming water, and careless anchors. Protecting them means keeping the sea clean and visiting responsibly.'],[['polyps','tiny soft animals that build coral'],['marine','related to the sea'],['coastlines','the land along the edge of the sea'],['responsibly','in a careful and caring way']],[['What are coral reefs made of?',['Rocks only','Tiny animals called coral polyps','Plants','Sand'],1,'Coral polyps build the reef.'],['Which sea area includes the Philippines?',['Coral Triangle','Bermuda Triangle','Arctic Ocean','Red Sea'],0,'The Philippines is part of the Coral Triangle.'],['What is the main idea?',['Coral reefs are important living habitats that need protection','Fish are colorful','Waves are strong','Anchors are heavy'],0,'The passage shows why reefs matter and how to protect them.'],['What can harm coral reefs?',['Clean water','Pollution and warming water','Healthy fish','Gentle waves'],1,'These are named as harms in the passage.'],['“Marine” describes things that…',['Live in the sky','Grow in deserts','Fly at night','Are related to the sea'],3,'Marine life lives in the sea.']],'Write three ways you can help keep the sea clean when you visit a beach.'),
{id:"enr-fil-1",category:"enr",lang:"fil",level:"Grade 4",title:"Ang Pawikan sa Dalampasigan",
paragraphs:["Kapag gabi at tahimik ang dalampasigan, umaahon ang inang pawikan mula sa dagat. Dahan-dahan siyang gumagapang sa buhangin, humuhukay ng butas, at nangingitlog doon. Pagkatapos, tinatabunan niya ang mga itlog at bumabalik sa dagat.","Pagkalipas ng halos dalawang buwan, napipisa ang mga itlog. Ang mga sisiw na pawikan ay kusang gumagapang patungo sa dagat, na sinusundan ang liwanag sa abot-tanaw. Ngunit kapag may maliwanag na ilaw mula sa mga bahay o resort, minsan ay naliligaw sila papunta sa kalsada.","Kaya may mga komunidad na nagbabantay ng mga pugad at nagtatayo ng pawikan hatchery. Pinoprotektahan din ng batas ang mga pawikan dahil kakaunti na ang bilang nila."],
vocab:[{word:"pawikan",meaning:"pagong na nakatira sa dagat"},{word:"dalampasigan",meaning:"tabing-dagat"},{word:"napipisa",meaning:"lumalabas mula sa itlog"},{word:"abot-tanaw",meaning:"guhit kung saan tila nagtatagpo ang langit at dagat"},{word:"pugad",meaning:"tirahan o lagayan ng itlog"}],
questions:[Q("lit","Kailan umaahon ang inang pawikan?",["Tuwing umaga","Kapag gabi at tahimik","Tuwing tanghali","Kapag umuulan"],1,"Gabi at tahimik ang dalampasigan."),Q("lit","Ano ang ginagawa ng inang pawikan pagkatapos mangitlog?",["Binabantayan ang pugad","Tinatabunan ang itlog at bumabalik sa dagat","Kinakain ang itlog","Nagpapahinga sa kalsada"],1,"Tinatabunan niya ang mga itlog at bumabalik sa dagat."),Q("voc","Ano ang kahulugan ng “napipisa”?",["Nawawala","Lumalabas mula sa itlog","Nahuhuli","Lumalangoy"],1,"Ito ay paglabas ng sisiw mula sa itlog."),Q("main","Ano ang pangunahing kaisipan?",["Madaling mahuli ang pawikan","Mahalagang protektahan ang mga pawikan at ang kanilang pugad","Maganda ang mga resort","Mabilis lumaki ang pawikan"],1,"Ang buong teksto ay tungkol sa pagprotekta sa kanila."),Q("cause","Bakit minsan naliligaw ang mga sisiw?",["Madilim ang dagat","Nalilito sila sa maliwanag na ilaw ng mga bahay at resort","Mabagal silang gumapang","Walang buhangin"],1,"Sinusundan nila ang liwanag, kaya naliligaw sila sa ibang ilaw."),Q("inf","Ano ang dapat gawin ng mga bahay sa tabing-dagat sa gabi ng pagpisa?",["Magpatugtog nang malakas","Patayin o hinaan ang ilaw na nakaharap sa dagat","Magpaputok","Magsabit ng maraming parol"],1,"Para hindi malito ang mga sisiw."),Q("inf","Bakit kaya kailangan ng hatchery?",["Para mas ligtas ang mga itlog at sisiw","Para ibenta ang pawikan","Para paglaruan","Para pagandahin ang beach"],0,"Binabantayan doon ang mga itlog."),Q("conn","Ano ang magagawa mo para makatulong sa kalikasan sa inyong lugar?",["Magtapon ng basura sa dagat","Maglinis ng tabing-dagat o ilog at magtapon sa tamang basurahan","Wala, bata pa lang ako","Magsindi ng maraming ilaw"],1,"Malaking tulong ang maliliit na gawain.")],
task:"Mag-isip ng pangalan para sa isang sisiw na pawikan at isulat ang unang araw nito sa dagat."},
RE('enr-fil-2','fil','Grade 4','Ang mga Alitaptap ng Bakawan',['Isang gabi, isinama ni Lolo Nando ang apo niyang si Migo sa ilog na napapaligiran ng bakawan. Madilim ang paligid, at tanging huni ng mga kuliglig ang naririnig. Biglang nagsindi ang mga puno na parang may libu-libong maliliit na ilaw. “Alitaptap po!” bulalas ni Migo.','Ipinaliwanag ni Lolo na tirahan ng alitaptap, alimango, at maraming isda ang bakawan. Ang mga ugat nito ay humahawak sa putik at pumipigil sa pagguho ng lupa. Hinaharang din nito ang malalakas na alon tuwing may bagyo, kaya ligtas ang mga bahay sa tabing-dagat.','Kinabukasan, nagpasya si Migo na sumali sa pagtatanim ng bakawan ng kanilang barangay. Bitbit niya ang maliit na punla na parang kayamanan. Mula noon, sinisigurado niyang hindi tinatapunan ng basura ang ilog. “Kung mawawala ang bakawan,” bulong niya, “mawawala rin ang mga ilaw.”'],[['bakawan','punong tumutubo sa maalat na tubig sa tabing-dagat'],['alitaptap','insektong may kumikislap na ilaw'],['pumipigil','hindi hinahayaang mangyari'],['punla','batang halaman na itatanim']],[['Sino ang isinama ni Lolo Nando sa ilog?',['Si Migo','Si Ana','Si Rey','Si Lita'],0,'Isinama niya ang apong si Migo.'],['Ano ang ginawa ni Migo kinabukasan?',['Nanghuli ng alitaptap','Nagtinda ng isda','Sumali sa pagtatanim ng bakawan','Lumipat ng bahay'],2,'Sumali siya sa pagtatanim ng bakawan.'],['Ano ang ibig sabihin ng “pumipigil”?',['Nagpapabilis','Hindi hinahayaang mangyari','Nagbubukas','Tumatakas'],1,'Pinipigilan ng ugat ang pagguho ng lupa.'],['Ano ang pangunahing kaisipan?',['Mahalaga ang bakawan sa kalikasan at sa tao','Madilim ang gabi','Mahilig si Migo sa ilog','Mahal ang punla'],0,'Ipinakita ang maraming pakinabang ng bakawan.'],['Bakit ligtas ang mga bahay sa tabing-dagat kapag may bagyo?',['Mataas ang bahay','Walang ulan','Hinaharang ng bakawan ang malalakas na alon','May bakod'],2,'Hinaharang ng bakawan ang alon.'],['Ano ang malamang na mangyari sa mga alitaptap kung mawawala ang bakawan?',['Dadami sila','Mawawalan sila ng tirahan','Lalaki sila','Lilipat sila sa bahay'],1,'Sa bakawan sila nakatira.'],['Ano ang ipinahihiwatig ng bulong ni Migo na “mawawala rin ang mga ilaw”?',['Takot siya sa dilim','Ayaw niya ng alitaptap','Naunawaan niyang magkakaugnay ang mga bagay sa kalikasan','Gusto na niyang matulog'],2,'Nakita niya ang ugnayan ng bakawan at alitaptap.'],['Ano ang magagawa mo para makatulong sa kalikasan sa inyong barangay?',['Magsunog ng basura','Magtanim at huwag magtapon ng basura sa ilog','Pumitas ng lahat ng bulaklak','Wala, bata pa ako'],1,'Maliit na gawain ang may malaking tulong.']],'Gumuhit ng bakawan sa gabi at ang mga alitaptap na nakatira roon.'),
RE('enr-fil-3','fil','Grade 4','Ang Butanding ng Donsol',['Sa Donsol, Sorsogon, dinarayo ng mga turista ang butanding o whale shark. Ito ang pinakamalaking isda sa buong mundo, at ang pinakamalalaki ay halos kasinghaba ng bus. Sa kabila ng laki, mahinahon ito at hindi mapanganib sa tao.','Plankton, mga napakaliliit na hayop at halaman sa dagat, ang pangunahing pagkain ng butanding. Binubuka nito ang malaking bibig at sinasala ang tubig upang makuha ang pagkain. Kaya sa mga lugar na masaganang plankton, doon madalas lumitaw ang butanding.','May mahigpit na patakaran sa pakikipag-ugnayan dito. Bawal hawakan ang butanding, bawal gumamit ng flash, at dapat may gabay na kasama ang bawat bangka. Layunin nitong hindi matakot o masaktan ang hayop. Dahil sa maayos na pangangalaga, naging tanyag ang Donsol at nagkaroon ng hanapbuhay ang maraming mangingisda bilang gabay.'],[['plankton','napakaliliit na hayop at halaman sa dagat'],['sinasala','pinaghihiwalay ang pagkain mula sa tubig'],['mahinahon','kalmado at hindi marahas'],['hanapbuhay','trabahong pinagkukunan ng kita']],[['Saang lugar dinarayo ang butanding?',['Donsol, Sorsogon','Boracay','Baguio','Bohol'],0,'Sa Donsol, Sorsogon.'],['Ano ang pangunahing pagkain ng butanding?',['Pusit','Plankton','Damo','Malalaking isda'],1,'Plankton ang pangunahing pagkain nito.'],['Ano ang ibig sabihin ng “mahinahon”?',['Marahas','Kalmado at hindi marahas','Mabilis','Maingay'],1,'Hindi mapanganib ang butanding.'],['Ano ang pangunahing kaisipan?',['Maraming turista sa Donsol','Mabilis ang bangka','Ang butanding ay dapat ingatan at igalang ng mga bumibisita','Malaki ang bus'],2,'Binibigyang-diin ang mga patakaran at pangangalaga.'],['Bakit bawal gumamit ng flash at humawak sa butanding?',['Para makatipid','Para hindi mabasa ang kamera','Para hindi ito matakot o masaktan','Para bumilis ang bangka'],2,'Layunin nitong protektahan ang hayop.'],['Bakit kaya madalas lumitaw ang butanding sa ilang lugar?',['Malamig ang hangin','Maraming bangka','May ilaw doon','Masagana ang plankton doon'],3,'Doon sila nakakakita ng pagkain.'],['Sino ang nakikinabang sa maayos na pangangalaga ng butanding?',['Ang hayop at ang kabuhayan ng komunidad','Ang pabrika','Ang eroplano','Walang nakikinabang'],0,'Protektado ang hayop at may hanapbuhay ang tao.'],['Ano ang dapat mong gawin sa lugar na may protektadong hayop?',['Hawakan para sa litrato','Sundin ang patakaran at huwag manggulo','Pakainin ng kahit ano','Habulin ito'],1,'Igalang ang tirahan at kaligtasan ng hayop.']],'Gumawa ng poster ng tatlong patakaran sa pagbisita sa butanding.'),
RE('enr-fil-4','fil','Grade 5','Ang Higanteng Parol ng San Fernando',['Tuwing Disyembre, nagliliwanag ang lungsod ng San Fernando sa Pampanga dahil sa mga higanteng parol. Dito ginaganap ang isang tanyag na paligsahan kung saan nagpapakitang-gilas ang mga barangay sa paggawa ng parol na may libo-libong kumikislap na ilaw.','Hindi simple ang paggawa. Kailangan ng mga disenyador, mga manggagawang marunong magwelding ng bakal, at mga kabataang tumutulong sa pagdidikit ng papel at pagkakabit ng bumbilya. Inaabot ng maraming buwan ang paghahanda, kaya kapag nagsimula na ang parada ng mga ilaw, hindi maiiwasang humanga ang mga manonood.','Higit sa ganda, ang parol ay sumisimbolo sa pagkakaisa. Nagsasama-sama ang magkakapitbahay, magkakaiba man ang trabaho at edad, para sa iisang layunin. Kaya tinaguriang Christmas Capital of the Philippines ang San Fernando.'],[['nagpapakitang-gilas','ipinapakita ang husay'],['disenyador','taong nagbabalangkas ng hitsura ng isang bagay'],['sumisimbolo','kumakatawan'],['pagkakaisa','sama-samang kilos para sa iisang layunin']],[['Anong buwan nagliliwanag ang San Fernando dahil sa parol?',['Disyembre','Marso','Hulyo','Oktubre'],0,'Tuwing Disyembre.'],['Saang lalawigan matatagpuan ang San Fernando na binanggit?',['Cebu','Pampanga','Bataan','Laguna'],1,'Nasa Pampanga ito.'],['Ano ang ibig sabihin ng “sumisimbolo”?',['Nagbebenta','Kumakatawan','Naglilinis','Nagpapahinga'],1,'Ang parol ay kumakatawan sa pagkakaisa.'],['Ano ang pangunahing kaisipan?',['Mahal ang bumbilya','Maraming barangay sa Pampanga','Ang higanteng parol ay bunga ng pagtutulungan at pagkakaisa','Madali ang paggawa ng parol'],2,'Binigyang-diin ang pagsasama-sama ng komunidad.'],['Bakit inaabot ng maraming buwan ang paghahanda?',['Walang gustong tumulong','Wala silang pera','Mahaba ang Disyembre','Masalimuot ang paggawa at maraming kailangang gawin'],3,'Maraming hakbang at tao ang kasali.'],['Ano ang ipinahihiwatig ng pagtutulungan ng magkakaibang tao sa paggawa ng parol?',['Pare-pareho ang trabaho nila','Kayang magsama-sama ng tao sa iisang layunin','Walang gustong manalo','Bawal ang bata'],1,'Magkakaiba man sila, nagkakaisa sila.'],['Bakit kaya tinawag na Christmas Capital ang San Fernando?',['Malamig doon','Maraming simbahan','Tanyag ito sa mga parol tuwing Pasko','Malapit ito sa dagat'],2,'Dahil sa tanyag nitong higanteng parol.'],['Paano ka makapag-aambag sa proyekto ng komunidad?',['Manood lang','Sumali at tumulong ayon sa kaya','Magreklamo','Umalis'],1,'Kahit maliit na tulong ay mahalaga.']],'Magdisenyo ng sarili mong parol at ilarawan ang mga materyales nito.'),
RE('enr-fil-5','fil','Grade 5','Ang Munting Aklatan ni Dindo',['Walang aklatan sa baryo nina Dindo. Para makapagbasa, kailangan pa niyang maglakbay nang isang oras papunta sa bayan. Kaya isang araw, kinuha niya ang lumang kahon ng sabon at ginawa itong istante. Nilagyan niya ito ng pitong aklat na nakuha niya sa mga kapitbahay at inilagay sa tapat ng kanilang bahay.','Sa una, iilan lang ang nagbasa. Pero lumipas ang mga linggo at dumami ang mga bata. Ang ilan ay nagdala rin ng sarili nilang aklat. Isang hapon, nakita ng kapitan ng barangay ang kahon at humanga siya. “Ano ang kailangan mo?” tanong niya.','“Mas malaking lugar po, para hindi mabasa ng ulan ang mga aklat,” sagot ni Dindo. Pagkalipas ng isang buwan, nagkaroon ng maliit na kubo na may bubong at mga upuan. Nakasulat sa karatula: “Aklatan ni Dindo — Basahin, Ibalik, Ibahagi.” Hindi na kailangan pang maglakbay ng mga bata para sa isang kuwento.'],[['baryo','maliit na pamayanan sa kanayunan'],['istante','tabla o kahon na pinaglalagyan ng aklat'],['humanga','nabilib'],['Ibahagi','ibigay o ipaalam sa iba']],[['Ilang aklat ang inilagay ni Dindo sa unang kahon?',['Lima','Pito','Sampu','Dalawa'],1,'Pitong aklat.'],['Ano ang hiniling ni Dindo sa kapitan?',['Pera','Laruan','Mas malaking lugar para hindi mabasa ng ulan ang mga aklat','Bagong bahay'],2,'Gusto niyang protektado ang mga aklat.'],['Ano ang ibig sabihin ng “humanga”?',['Nainis','Nabilib','Natakot','Nalito'],1,'Nabilib ang kapitan.'],['Ano ang pangunahing kaisipan?',['Mahal ang aklat','Maulan sa baryo','Malayo ang bayan','Ang maliit na ideya ay maaaring lumago at makatulong sa komunidad'],3,'Nagsimula sa isang kahon at naging kubo.'],['Bakit nagsimula si Dindo ng munting aklatan?',['Gusto niyang magbenta','Walang aklatan sa baryo at malayo ang bayan','Inutusan siya','Wala siyang ginagawa'],1,'Kailangan niya ng mababasa.'],['Ano ang masasabi mo kay Dindo batay sa ginawa niya?',['Tamad','Mayabang','Malikhain at may malasakit','Mahiyain'],2,'Gumawa siya ng paraan para makatulong.'],['Ano ang ipinahihiwatig ng pagdami ng mga batang nagbabasa?',['Nagustuhan ng mga bata ang aklatan','Ayaw nila ng laro','Wala silang pasok','Nawala ang mga aklat'],0,'Dumarami ang gumagamit dahil nakatulong ito.'],['Paano ka makapagbabahagi ng aklat sa iyong komunidad?',['Itago lahat','Magpahiram o mag-donate ng mga aklat','Sirain','Ibenta nang mahal'],1,'Ang pagbabahagi ay tumutulong sa iba.']],'Magplano ng sarili mong munting aklatan. Saan mo ito ilalagay at anong aklat ang uunahin mo?'),
RE('enr-en-1','en','Grade 4','The Mango Tree on Mabini Street',['Every summer, the old mango tree on Mabini Street was heavy with golden fruit. Lola Pacing, who lived under it, never sold a single mango. Instead, she filled baskets and left them at the gate with a note: “Take what you need.”','One year, a typhoon snapped the tree’s biggest branch, and the next summer there were only a few mangoes. Neighbors who used to take baskets began to bring things instead: a pail of water, fertilizer, a ladder for pruning. Without being asked, they took turns caring for the tree.','The year after, the branches were full again. This time, there were so many mangoes that the neighbors made jam to share with the whole street. Lola Pacing smiled and said, “A tree gives most to those who give back.”'],[['snapped','broke suddenly'],['fertilizer','plant food that helps soil'],['pruning','cutting branches to help a plant grow well'],['golden','bright yellow like gold']],[['What did Lola Pacing leave at the gate?',['Baskets of mangoes with a note','Money','Jam','Water'],0,'She left baskets with a note.'],['What happened to the tree after the typhoon?',['The whole tree fell down','A big branch snapped','It was sold','It turned blue'],1,'Its biggest branch snapped.'],['“Pruning” means…',['Watering','Cutting branches to help a plant grow well','Picking fruit','Planting seeds'],1,'Pruning keeps a tree healthy.'],['What is the best main idea?',['Mangoes are sweet','Typhoons are strong','Caring for something shared brings good things back to everyone','Jam is tasty'],2,'The story shows giving and giving back.'],['Why were there fewer mangoes the next summer?',['Lola sold them','Neighbors took them all','The typhoon broke a big branch','It was too cold'],2,'The damaged tree produced less fruit.'],['What can you infer about Lola Pacing?',['She is selfish','She is generous and wise','She is angry','She is lazy'],1,'She shares and teaches kindness.'],['Why did neighbors care for the tree without being asked?',['They were paid','They felt grateful and wanted it to recover','They were afraid','They had nothing to do'],1,'They wanted to give back.'],['How can you care for something your community shares?',['Ignore it','Help clean and look after it','Take everything','Break it'],1,'Shared things need everyone’s care.']],'Write about a shared place in your community and how you can help care for it.'),
RE('enr-en-2','en','Grade 4','How Bats Help Farmers',['Many people think bats are scary, but farmers have good reasons to thank them. Insect-eating bats come out at night, and a colony can catch huge numbers of insects in a single night, including pests that nibble rice and corn.','Fruit bats help in a different way. They drink nectar from flowers and eat ripe fruit, then fly far away and drop seeds in their droppings. This helps new trees grow in cleared or damaged forests. Some plants, like durian and wild bananas, depend on bats to carry their pollen from flower to flower.','Sadly, many bats lose their homes when caves are disturbed or forests are cut down. Scientists encourage farmers to protect roosting caves and plant native trees so that bats can keep working as nature’s night shift.'],[['colony','a large group of animals living together'],['pests','animals that harm crops'],['pollen','tiny dust from flowers that helps make seeds'],['roosting','resting or sleeping']],[['When do insect-eating bats hunt?',['At noon','At night','In the morning','In the afternoon'],1,'They come out at night.'],['How do fruit bats help new trees grow?',['By dropping seeds far away','By eating leaves','By digging holes','By cutting branches'],0,'Seeds in their droppings grow into new trees.'],['“Pests” are…',['Pretty flowers','Kinds of caves','Animals that harm crops','Farm tools'],2,'Pests nibble rice and corn.'],['What is the main idea?',['Bats are scary','Fruits are sweet','Caves are dark','Bats help farmers and forests, so they need protection'],3,'The passage shows how useful bats are.'],['Why do many bats lose their homes?',['It rains too much','Caves are disturbed and forests are cut down','They like to move','They sleep too long'],1,'People disturb caves and cut forests.'],['What might happen to crops if insect-eating bats disappear?',['Crops would grow taller','Nothing would change','Pests could increase and harm more crops','Crops would turn blue'],2,'Fewer bats means more insects.'],['Why does the author call bats “nature’s night shift”?',['They work in a factory','They do helpful work while people sleep','They are always tired','They wear uniforms'],1,'They work at night.'],['How can people help bats in their area?',['Make loud noises in caves','Protect caves and plant native trees','Cut more trees','Catch them'],1,'This gives bats homes and food.']],'Draw a bat doing one of its helpful jobs and label it.'),
RE('enr-en-3','en','Grade 5','The Sampaguita Seller',['Every afternoon, ten-year-old Liza stood near the church steps with a bundle of sampaguita garlands. “Fresh flowers, five pesos!” she called, though most people hurried past. She sold just enough to buy rice for dinner and a few school supplies.','One Sunday, a man dropped his wallet while leaving the church. Liza picked it up and saw a thick stack of bills. Her heart pounded. She thought of her torn notebook and her mother’s empty rice jar. Then she remembered something Tatay used to say: “Honesty is the only thing that does not run out.”','She ran after the man and held out the wallet. He counted the money and found nothing missing. Smiling, he bought every garland she had and asked about her school. A month later, a letter arrived at Liza’s house: a scholarship from the man’s foundation. Liza read it twice before she believed it.'],[['bundle','a group of things tied together'],['garlands','rings or strings of flowers'],['pounded','beat strongly'],['scholarship','money that helps a student pay for school']],[['What did Liza sell?',['Sampaguita garlands','Candies','Newspapers','Rice'],0,'She sold sampaguita garlands.'],['What did Liza do after finding the wallet?',['Hid it','Ran after the man and returned it','Spent the money','Gave it to a stranger'],1,'She returned it.'],['A “scholarship” is…',['A school uniform','A kind of flower','Money that helps a student pay for school','A prize for running'],2,'It helps pay for school.'],['What is the best main idea?',['Flowers are cheap','Honesty can bring unexpected good things','Churches are busy','Wallets are heavy'],1,'Her honesty led to a scholarship.'],['Why did Liza return the wallet even though she needed money?',['She was afraid','The man was watching','She did not need money','She believed honesty mattered more'],3,'She remembered her father’s words.'],['How do you think Liza felt when she found the wallet?',['Bored','Tempted but conflicted','Sleepy','Angry at the man'],1,'Her heart pounded as she thought of her needs.'],['What does the scholarship suggest about the man?',['He was rude','He did not care','He forgot her','He was grateful and wanted to help her future'],3,'He valued her honesty.'],['What would you do if you found something valuable that belongs to someone else?',['Keep it','Return it to the owner or a trusted adult','Throw it away','Sell it'],1,'Returning it is the right thing to do.']],'Write a short ending for what Liza did with the scholarship.'),
RE('enr-en-4','en','Grade 5','Why Do We Have Day and Night?',['Every morning the sun appears to rise, and every evening it seems to sink below the horizon. In truth, the sun does not move across the sky. It is Earth that turns, spinning like a top around an invisible line called its axis.','One full spin takes about twenty-four hours. When your part of Earth faces the sun, it is daytime. As your area turns away, sunlight fades into dusk and then night. At the same time, people on the other side of the planet are enjoying daylight. That is why the Philippines can be sleeping while the United States is wide awake.','Because Earth turns, places far apart do not share the same clock time, so the world is divided into time zones. If you travel east or west by plane, you may need to adjust your watch.'],[['horizon','the line where the sky seems to meet the land or sea'],['axis','an imaginary line through the center of a spinning object'],['dusk','the time when daylight fades'],['adjust','change a little so it fits']],[['What does Earth spin around?',['Its axis','The moon','A mountain','The sea'],0,'Earth spins around its axis.'],['About how long does one full spin of Earth take?',['One week','One hour','One year','Twenty-four hours'],3,'One spin takes about twenty-four hours.'],['“Dusk” is…',['Bright noon','The time when daylight fades','A kind of cloud','A strong wind'],1,'Dusk comes before night.'],['What is the main idea?',['Day and night happen because Earth spins','The sun moves across the sky','Nights are dark','Clocks are useful'],0,'The passage explains day and night.'],['Why can the Philippines be sleeping while the United States is awake?',['Their clocks are broken','The moon moves','They are on opposite sides of Earth as it turns','They have different suns'],2,'When one side faces the sun, the other does not.'],['What does it mean that the sun “appears” to rise?',['The sun really moves','It looks like the sun moves, but Earth is turning','The sun is small','The sun sleeps'],1,'It is an effect of Earth’s spin.'],['Why might travelers need to adjust their watches?',['Watches break in planes','Planes are slow','Time stops','Places far apart have different clock times'],3,'Time zones differ.'],['How could you explain day and night to a younger child?',['Say it is magic','Use a flashlight and a ball to show Earth turning','Say the sun is tired','Say nights are random'],1,'A model makes the idea easier to see.']],'Draw Earth, the sun, and an arrow showing which way Earth spins.'),
RE('enr-en-5','en','Grade 5','The Dreamweavers of the T’boli',['In the highlands of South Cotabato, T’boli women weave a special cloth called t’nalak. It is made from the fibers of abaca, a plant related to the banana. First, the women strip the stalks and dry the fibers in the sun. Then they tie small bundles of thread with strands of grass, so the dye cannot reach certain parts.','After dyeing the thread in red, black, and natural shades, the weavers slowly build the cloth on a loom. A single piece can take weeks or even months to finish. What makes t’nalak unique is that many weavers say their patterns come from dreams, guided by Fu Dalu, the spirit of abaca.','Today, t’nalak is used in clothing, bags, and home decoration. Young T’boli girls learn the craft from their mothers and grandmothers, keeping alive a tradition that is both art and story.'],[['abaca','a plant whose strong fibers are used to make cloth and rope'],['loom','a frame used for weaving cloth'],['unique','one of a kind'],['tradition','a custom passed down through generations']],[['What plant is t’nalak made from?',['Cotton','Pineapple','Abaca','Rice'],2,'It is made from abaca fibers.'],['Where do T’boli women weave t’nalak?',['South Cotabato','Batanes','Palawan','Cebu'],0,'In the highlands of South Cotabato.'],['A “loom” is…',['A kind of dye','A type of grass','A basket','A frame used for weaving cloth'],3,'Weavers build the cloth on a loom.'],['What is the main idea?',['Banana plants are tall','T’nalak is a special cloth that carries T’boli art and tradition','Dye is red','Women like clothes'],1,'The passage shows how t’nalak is made and valued.'],['Why are thread bundles tied with grass before dyeing?',['To make thread heavier','So the dye cannot reach those parts','To dry faster','To hide knots'],1,'It creates patterns.'],['What does it suggest that weavers say patterns come from dreams?',['The craft is connected to belief and imagination','They sleep while weaving','Patterns are random','They copy a book'],0,'Dreams guide their designs.'],['Why might making t’nalak take weeks or months?',['The thread is lazy','The loom is broken','They sell it slowly','Every step is done by hand with great care'],3,'It is detailed handwork.'],['How can people help keep traditions like t’nalak alive?',['Copy and sell cheap imitations','Ignore it','Learn about it, buy from real makers, and respect them','Throw it away'],2,'Support and respect help traditions continue.']],'Design a pattern inspired by a dream you remember and describe its colors.'),
